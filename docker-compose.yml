version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=0
    image: perkasa-erp-oss-bss:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "node /app/apps/web/healthcheck.js || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
