services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: perkasa-erp-oss-bss:latest
    container_name: perkasa-erp-oss-bss
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks:
      - coolify
    stop_grace_period: 60s
    mem_limit: 2048m
    mem_reservation: 512m
    cpus: "1.0"

networks:
  coolify:
    external: true
    name: coolify
