name: "TRAE webpsb server access"

on:
  push:
    branches: [trae-webpsb-fix]
  workflow_dispatch:

concurrency:
  group: trae-webpsb-serial
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.COOLIFY_SERVER_SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p $HOME/.ssh && chmod 700 $HOME/.ssh
          RAW=$HOME/.ssh/raw_key
          FINAL=$HOME/.ssh/id_ed25519_coolify
          printf '%s' "$SSH_PRIVATE_KEY" > $RAW
          BODY=$RAW.body
          tail -n +2 $RAW | head -n -1 | grep -v '^[[:space:]]*$' > $BODY || true
          { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; cat $BODY; echo "-----END OPENSSH PRIVATE KEY-----"; } > $FINAL
          chmod 600 $FINAL
          echo "key bytes: $(wc -c < $FINAL)"
          rm -f $RAW $BODY

      - name: MEASURE4
        env:
          HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
        run: |
          set +e
          KEY=$HOME/.ssh/id_ed25519_coolify
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $KEY"
          ssh $OPTS "$USER@$HOST" 'bash -s' <<'REMOTE'
          echo "===== [W1] DOCKER SYSTEM DF ====="
          docker system df 2>&1
          echo
          echo "===== [W2] /var/lib/docker (top) ====="
          du -sh /var/lib/docker/* 2>/dev/null | sort -h | tail -10
          echo
          echo "===== [W3] Top-level dirs on / ====="
          du -xsh /* 2>/dev/null | sort -h | tail -14
          echo
          echo "===== [W4] IMAGES (all, by size) ====="
          docker images --format '{{.Repository}}:{{.Tag}}|{{.Size}}|{{.CreatedSince}}' 2>&1 | head -40
          echo
          echo "===== [W5] CONTAINERS (all) ====="
          docker ps -a --format '{{.Names}}|{{.Image}}|{{.Status}}' 2>&1 | head -40
          echo
          echo "===== [W6] Docker json logs >100M ====="
          find /var/lib/docker/containers -name '*-json.log' -size +100M -printf '%s %p\n' 2>/dev/null | sort -rn | head -15
          echo
          echo "===== [W7] /data sizes ====="
          du -sh /data/* 2>/dev/null | sort -h | tail -12
          echo "DONE"
          REMOTE
