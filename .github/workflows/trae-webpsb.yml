name: "TRAE webpsb server access"

on:
  push:
    branches: [trae-webpsb-fix]
  workflow_dispatch:

concurrency:
  group: trae-webpsb-serial
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.COOLIFY_SERVER_SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p $HOME/.ssh && chmod 700 $HOME/.ssh
          RAW=$HOME/.ssh/raw_key
          FINAL=$HOME/.ssh/id_ed25519_coolify
          printf '%s' "$SSH_PRIVATE_KEY" > $RAW
          BODY=$RAW.body
          tail -n +2 $RAW | head -n -1 | grep -v '^[[:space:]]*$' > $BODY || true
          { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; cat $BODY; echo "-----END OPENSSH PRIVATE KEY-----"; } > $FINAL
          chmod 600 $FINAL
          echo "key bytes: $(wc -c < $FINAL)"
          rm -f $RAW $BODY

      - name: FIX5
        env:
          HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
        run: |
          set +e
          KEY=$HOME/.ssh/id_ed25519_coolify
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $KEY"
          ssh $OPTS "$USER@$HOST" 'bash -s' <<'REMOTE'
          APP=pic3vleasj465ooh77ioicw6
          DB=p50kpcya4hegfp577m855paz
          echo "===== [X1] DISK BEFORE ====="
          df -h / | tail -2
          echo
          echo "===== [X2] BUILD CACHE PRUNE ====="
          docker builder prune -af 2>&1 | tail -5
          echo
          echo "===== [X3] DANGLING IMAGE PRUNE ====="
          docker image prune -f 2>&1 | tail -3
          echo
          echo "===== [X4] DISK AFTER ====="
          df -h / | tail -2
          echo
          echo "===== [X5] RESTART DB CONTAINER ====="
          docker restart $DB 2>&1
          echo "restart issued, tunggu 25s..."
          sleep 25
          echo
          echo "===== [X6] DB STATE ====="
          docker inspect -f 'Health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} Restarts={{.RestartCount}}' $DB 2>&1
          docker exec $DB pg_isready 2>&1
          echo
          echo "===== [X7] DB LOGS (tail 20) ====="
          docker logs --tail 20 $DB 2>&1
          echo
          echo "===== [X8] PRISMA USER COUNT ====="
          docker exec -w /app $APP node -e "const{PrismaClient}=require('@prisma/client');const p=new PrismaClient();p.user.count().then(c=>{console.log('PRISMA_OK count=',c);return p.\$disconnect()}).catch(e=>console.log('PRISMA_ERR',String(e.message).split('\n').slice(0,3).join(' | ')))" 2>&1 | head -5
          echo
          echo "===== [X9] LOGIN PROBE ====="
          docker exec $APP node -e "fetch('http://127.0.0.1:3000/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:'__trae_probe__',password:'__trae_probe__'})}).then(r=>r.text()).then(t=>console.log('PROBE_RESP',t)).catch(e=>console.log('PROBE_ERR',e.message))" 2>&1 | tail -2
          echo "DONE"
          REMOTE
