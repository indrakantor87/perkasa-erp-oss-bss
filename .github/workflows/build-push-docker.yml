name: Build & Push Docker Image to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILDKIT: "0"
  COMPOSE_DOCKER_CLI_BUILD: "0"
  DEBIAN_FRONTEND: "noninteractive"
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-flight verify (2 critical files only)
        run: |
          set -e
          test -f "$GITHUB_WORKSPACE/Dockerfile" && echo "  ✓ Dockerfile"
          test -f "$GITHUB_WORKSPACE/apps/web/package.json" && echo "  ✓ apps/web/package.json"
          test -f "$GITHUB_WORKSPACE/apps/web/public/branding/perkasa-networks-original.png" && echo "  ✓ branding PNG original (sidebar)"
          echo "OK - pre-flight passed"

      - name: Build production image
        id: build
        run: |
          set -e
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMG_LATEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          IMG_SHA="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}"
          echo "IMG_LATEST=$IMG_LATEST" >> "$GITHUB_OUTPUT"
          echo "IMG_SHA=$IMG_SHA" >> "$GITHUB_OUTPUT"
          echo "--- docker build (legacy engine, DOCKER_BUILDKIT=0) ---"
          docker build \
            --file ./Dockerfile \
            --build-arg NEXT_TELEMETRY_DISABLED=1 \
            --build-arg DEBIAN_FRONTEND=noninteractive \
            --build-arg NODE_OPTIONS="--max-old-space-size=4096" \
            --tag "$IMG_LATEST" \
            --tag "$IMG_SHA" \
            . 2>&1 | tail -n 80
          echo "--- built images ---"
          docker images --format "{{.Repository}}:{{.Tag}}    {{.Size}}" | grep "perkasa-erp-oss-bss" | head -5 || true

      - name: Push to GHCR
        run: |
          set -e
          IMG_LATEST="${{ steps.build.outputs.IMG_LATEST }}"
          IMG_SHA="${{ steps.build.outputs.IMG_SHA }}"
          echo "--- docker push $IMG_SHA ---"
          docker push "$IMG_SHA" 2>&1 | tail -5
          echo "--- docker push $IMG_LATEST ---"
          docker push "$IMG_LATEST" 2>&1 | tail -5
          echo "✅ OK - pushed both tags"
          echo ""
          echo "Digest:"
          docker inspect "$IMG_LATEST" --format '{{index .RepoDigests 0}}' 2>&1 || true
