name: Build & Push Docker Image to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILDKIT: "1"
  DOCKER_BUILDX: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  BUILDKIT_PROGRESS: plain
  BUILDKIT_INLINE_CACHE: "1"
  DEBIAN_FRONTEND: "noninteractive"
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Dockerfile and apps/web source exist
        run: |
          echo "=== Check workspace structure ==="
          ls -la "${{ github.workspace }}/" | head -40
          echo ""
          echo "=== Check critical files ==="
          for f in Dockerfile docker-compose.yaml apps/web/package.json apps/web/next.config.ts apps/web/healthcheck.js apps/web/shims.d.ts; do
            if [ -f "${{ github.workspace }}/${f}" ]; then
              echo "  ✓ ${f}"
            else
              echo "  ✗ MISSING: ${f}"
              exit 255
            fi
          done

      - name: Set up Docker Buildx (stable, default driver)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
          install: true
          use: true

      - name: Docker daemon info and BuildKit readiness
        run: |
          sudo systemctl is-active --quiet docker || sudo systemctl start docker
          docker info 2>&1 | head -n 20 || true
          echo ""
          echo "=== DOCKER_BUILDKIT=$DOCKER_BUILDKIT ==="
          docker buildx version 2>&1 | head -5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=
            type=ref,event=branch
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Perkasa ERP OSS BSS
            org.opencontainers.image.description=Satu website operasional ISP untuk sales, support, inventory, HR, dan billing.
            org.opencontainers.image.vendor=Perkasa Networks
            org.opencontainers.image.licenses=proprietary

      - name: Build and push Docker image (BuildKit, provenance false for small manifest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            NEXT_TELEMETRY_DISABLED=1
            DEBIAN_FRONTEND=noninteractive
            CACHEBUST=gha-${{ github.sha }}
          outputs: type=registry
