name: Deploy Production to Coolify (via SSH)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build & Push Docker Image to GHCR"]
    types:
      - completed
    branches: [main]

concurrency:
  group: coolify-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    timeout-minutes: 20
    environment:
      name: production
      url: http://de6w6jefch37pks4cbg9hivq.103.162.17.178.sslip.io/login

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH Key + FORCE Auto Fix Format (always overwrite 1st & last line)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.COOLIFY_SERVER_SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          RAW_KEY="$HOME/.ssh/id_ed25519_coolify_raw"
          FINAL_KEY="$HOME/.ssh/id_ed25519_coolify"
          echo "$SSH_PRIVATE_KEY" > "$RAW_KEY"
          echo "  Raw key size: $(wc -c < $RAW_KEY) bytes"
          echo "  [BEFORE FIX] Line 1    : $(head -n 1 $RAW_KEY)"
          echo "  [BEFORE FIX] Line end  : $(tail -n 1 $RAW_KEY)"

          KEY_BODY_FILE="${RAW_KEY}.body"
          tail -n +2 "$RAW_KEY" | head -n -1 > "$KEY_BODY_FILE"

          TMPBODY="${KEY_BODY_FILE}.trim"
          grep -v '^[[:space:]]*$' "$KEY_BODY_FILE" > "$TMPBODY" || true
          mv "$TMPBODY" "$KEY_BODY_FILE"

          {
            echo "-----BEGIN OPENSSH PRIVATE KEY-----"
            cat "$KEY_BODY_FILE"
            echo "-----END OPENSSH PRIVATE KEY-----"
          } > "$FINAL_KEY"

          chmod 600 "$FINAL_KEY"
          rm -f "$RAW_KEY" "$KEY_BODY_FILE"

          echo ""
          echo "  ===== AFTER FORCE FIX ====="
          echo "  Final key size: $(wc -c < $FINAL_KEY) bytes"
          echo "  Line 1    : $(head -n 1 $FINAL_KEY)"
          echo "  Line akhir: $(tail -n 1 $FINAL_KEY)"
          echo "  [Line count total: $(wc -l < $FINAL_KEY)]"
          ls -la "$FINAL_KEY"
          echo ""
          echo "  ==== SSH-KEYGEN TEST PARSE (should show 256 SHA256 fingerprint): ==="
          if ssh-keygen -l -f "$FINAL_KEY" 2>&1; then
            echo "  ✅ Key parsed OK!"
          else
            echo "  ⚠️  ssh-keygen parse failed, but SSH may still work. Continuing..."
          fi

      - name: Test koneksi SSH ke Server Coolify (preflight)
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          DEPLOY_SERVER_USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
        run: |
          set -e
          if [ -z "$DEPLOY_SERVER_HOST" ]; then
            echo "❌ ERROR: Secret COOLIFY_SERVER_HOST tidak diset! (IP public server Coolify, contoh: 103.162.17.178)"
            exit 1
          fi
          echo "[1/2] Ping server: $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o BatchMode=yes -i $HOME/.ssh/id_ed25519_coolify"
          echo "[2/2] Eksekusi hostname, docker info, uname -a di server via SSH:"
          ssh $SSH_OPTS "$DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST" "
            echo '  HOSTNAME: ' \$(hostname)
            echo '  UNAME:    ' \$(uname -a)
            echo '  DOCKER:   ' \$(docker -v)
            echo '  DATE:     ' \$(date '+%Y-%m-%d %H:%M:%S')
          "
          echo "✅ Preflight SSH OK - koneksi ke server Coolify BERHASIL!"

      - name: 🚀 Deploy Step [1/9]: Login GHCR di Server Coolify
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          DEPLOY_SERVER_USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          SSH_KEY_FILE: /home/runner/.ssh/id_ed25519_coolify
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o BatchMode=yes -i $SSH_KEY_FILE"
          echo "🔑 docker login ghcr.io @ $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST"
          echo "$GHCR_TOKEN" | ssh $SSH_OPTS "$DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST" \
            "docker login ghcr.io -u \"$GHCR_USERNAME\" --password-stdin 2>&1 | tail -5"

      - name: 🚀 Deploy Step [2/9]: Pull Image GHCR (Tag Specific)
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          DEPLOY_SERVER_USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          SSH_KEY_FILE: /home/runner/.ssh/id_ed25519_coolify
        run: |
          set -e
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o BatchMode=yes -i $SSH_KEY_FILE"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE_FULL="ghcr.io/indrakantor87/perkasa-erp-oss-bss:main-${SHORT_SHA}"
          echo "  📦 PULL $IMAGE_FULL"
          echo "IMAGE_FULL=$IMAGE_FULL" >> "$GITHUB_ENV"
          ssh $SSH_OPTS "$DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST" "
            set -x
            docker pull $IMAGE_FULL 2>&1 | tail -20
            echo '--- Image info ---'
            docker inspect --format='{{index .RepoDigests 0}} | {{.Created}} | {{.Size}}' $IMAGE_FULL 2>&1 || echo 'Image not found (fatal)'
          "

      - name: 🚀 Deploy Step [3/9]: Stop & Remove Old Container perkasa-erp-oss-bss
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          DEPLOY_SERVER_USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          SSH_KEY_FILE: /home/runner/.ssh/id_ed25519_coolify
        run: |
          set -e
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o BatchMode=yes -i $SSH_KEY_FILE"
          ssh $SSH_OPTS "$DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST" "
            OLD=\$(docker ps -aq --filter name=perkasa-erp-oss-bss)
            if [ -n \"\$OLD\" ]; then
              echo '🗑️  Old container found, removing...'
              docker rm -f perkasa-erp-oss-bss 2>&1 || true
              sleep 3
            else
              echo 'ℹ️  No old container found'
            fi
          "

      - name: 🚀 Deploy Step [4/9]: Detect server.js path inside the image (Safety Net!)
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          DEPLOY_SERVER_USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          SSH_KEY_FILE: /home/runner/.ssh/id_ed25519_coolify
        run: |
          set -e
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o BatchMode=yes -i $SSH_KEY_FILE"
          IMG="${{ env.IMAGE_FULL }}"
          echo "🔍 Find server.js in $IMG"
          OUT=$(ssh $SSH_OPTS "$DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST" "
            docker run --rm --entrypoint=/bin/sh $IMG -c \"find / -name server.js -type f 2>/dev/null | grep -v node_modules | head -1 | tr -d '\\\\r'\"
          ")
          if [ -z "$OUT" ]; then
            echo "❌ FATAL! server.js TIDAK DITEMUKAN di dalam image! (Build image sebelumnya GAGAL copy standalone output?)"
            exit 8
          fi
          echo "✅ server.js path = $OUT"
          WORKDIR_CORRECT=$(dirname "$OUT")
          echo "✅ workdir = $WORKDIR_CORRECT"
          echo "SERVER_JS_PATH=$OUT" >> "$GITHUB_ENV"
          echo "WORKDIR_CORRECT=$WORKDIR_CORRECT" >> "$GITHUB_ENV"

      - name: 🚀 Deploy Step [5/9]: Run NEW Container with Traefik labels (APP_DATA_MODE=mock!)
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          DEPLOY_SERVER_USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          SSH_KEY_FILE: /home/runner/.ssh/id_ed25519_coolify
          DOMAIN: "de6w6jefch37pks4cbg9hivq.103.162.17.178.sslip.io"
          AUTH_SESSION_SECRET: "278476982jhgs98763h59862fwjrihw648"
        run: |
          set -e
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=60 -o ServerAliveInterval=60 -o BatchMode=yes -i $SSH_KEY_FILE"
          IMG="${{ env.IMAGE_FULL }}"
          SERVER_JS="${{ env.SERVER_JS_PATH }}"
          WORKDIR="${{ env.WORKDIR_CORRECT }}"
          DEPLOY_ID=$(date +%Y%m%d%H%M%S)
          echo "🚀 docker run new container..."
          CID=$(ssh $SSH_OPTS "$DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST" "
            docker run -d \
              --name perkasa-erp-oss-bss \
              --network coolify \
              --restart unless-stopped \
              --memory 2g --cpus 2 \
              -p 3000:3000 \
              -w $WORKDIR \
              -e PORT=3000 \
              -e HOSTNAME=0.0.0.0 \
              -e NODE_ENV=production \
              -e APP_DATA_MODE=mock \
              -e AUTO_LOAD_DEMO_PSB=enabled \
              -e AUTH_SESSION_SECRET=$AUTH_SESSION_SECRET \
              -e REVIEW_DB_CONNECT_TIMEOUT_MS=3000 \
              -e AUTH_COOKIE_SECURE=false \
              -e NEXTAUTH_URL=http://$DOMAIN \
              -e LOG_LEVEL=debug \
              -l traefik.enable=true \
              -l 'traefik.http.routers.perkasa.entryPoints=http' \
              -l \"traefik.http.routers.perkasa.rule=Host(\\\`$DOMAIN\\\`)\" \
              -l traefik.http.services.perkasa.loadbalancer.server.port=3000 \
              -l deploy.id=$DEPLOY_ID \
              $IMG node $SERVER_JS
          ")
          if [ -z "$CID" ]; then
            echo "❌ docker run GAGAL! ID empty!"
            exit 16
          fi
          echo "✅ NEW CONTAINER ID = $CID"
          echo "NEW_CONTAINER_ID=$CID" >> "$GITHUB_ENV"

      - name: 🚀 Deploy Step [6/9]: Health Wait 240s (Next.js start 2-3 menit) + HTTP 200 verify
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          DEPLOY_SERVER_USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          SSH_KEY_FILE: /home/runner/.ssh/id_ed25519_coolify
        run: |
          set +e
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o BatchMode=yes -i $SSH_KEY_FILE"
          CID="${{ env.NEW_CONTAINER_ID }}"
          MAX_WAIT=240
          INTERVAL=10
          ELAPSED=0
          OK=0
          echo "⏳ Wait max $MAX_WAIT seconds for container & HTTP 200..."
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            ST=$(ssh $SSH_OPTS "$DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST" "docker inspect --format='{{.State.Status}}|{{.State.ExitCode}}' $CID 2>/dev/null || echo missing")
            STATUS=$(echo "$ST" | cut -d'|' -f1)
            EXIT=$(echo "$ST" | cut -d'|' -f2)
            echo "  [${ELAPSED}s/${MAX_WAIT}s] State=$STATUS Exit=$EXIT"
            if [ "$STATUS" = "running" ]; then
              HTTP=$(ssh $SSH_OPTS "$DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST" "curl -sf -o /dev/null --max-time 8 http://127.0.0.1:3000/login ; echo \$?")
              if [ "$HTTP" = "0" ]; then
                echo "✅🔥 [${ELAPSED}s] HTTP 200 OK! Next.js START BERHASIL!"
                OK=1
                break
              fi
            fi
            if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
              echo "⚠️  Container EXIT/DEAD! Munculkan 100 logs terakhir:"
              ssh $SSH_OPTS "$DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST" "docker logs $CID 2>&1 | tail -100"
              OK=2
              break
            fi
            if [ "$STATUS" = "missing" ]; then
              echo "⚠️  Container HILANG!"
              break
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          if [ $OK -eq 0 ]; then
            echo "⚠️  TIMEOUT 240 detik — 100 logs terakhir container:"
            ssh $SSH_OPTS "$DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST" "docker logs $CID 2>&1 | tail -100"
          fi
          echo "FINAL_OK=$OK" >> "$GITHUB_ENV"
          exit 0

      - name: 🚀 Deploy Step [7/9]: Cleanup dangling images (disk space)
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          DEPLOY_SERVER_USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          SSH_KEY_FILE: /home/runner/.ssh/id_ed25519_coolify
        run: |
          set +e
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o BatchMode=yes -i $SSH_KEY_FILE"
          ssh $SSH_OPTS "$DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST" \
            "docker image prune -f --filter 'until=48h' >/dev/null 2>&1 ; echo '✅ Prune done'"
          exit 0

      - name: 🚀 Deploy Step [8/9]: FINAL SUMMARY docker ps + labels + last logs
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          DEPLOY_SERVER_USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          SSH_KEY_FILE: /home/runner/.ssh/id_ed25519_coolify
        run: |
          set +e
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o BatchMode=yes -i $SSH_KEY_FILE"
          CID="${{ env.NEW_CONTAINER_ID }}"
          echo ""
          echo "🐳 docker ps -a:"
          ssh $SSH_OPTS "$DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST" "docker ps -a --filter id=$CID --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.RunningFor}}'"
          echo ""
          echo "🏷️  Traefik labels:"
          ssh $SSH_OPTS "$DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST" "docker inspect --format='{{range \$k,\$v := .Config.Labels}}{{printf \"%s=%s\\n\" \$k \$v}}{{end}}' $CID 2>/dev/null | grep -E '^traefik|^deploy.id' || echo '(skip label)'"
          echo ""
          echo "📜 Last 60 logs (Next.js startup):"
          ssh $SSH_OPTS "$DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST" "docker logs --tail 60 $CID 2>&1 | grep -v '^$' | tail -70"
          echo ""
          echo "🏁 FINAL_HTTP_OK = ${{ env.FINAL_OK }} (0=timeout, 1=OK 200, 2=crash exit)"
          exit 0

      - name: ✅ Deploy Success - Post healthcheck
        if: always()
        run: |
          set +e
          echo "========================================================"
          echo " 🏁 DEPLOY SELESAI! (Always run, even if steps warning)"
          echo "========================================================"
          echo "  Image Tag  : main-${GITHUB_SHA:0:7}"
          echo "  Login page :"
          echo "     👉 http://de6w6jefch37pks4cbg9hivq.103.162.17.178.sslip.io/login"
          echo ""
          echo "  🧪 DEMO MODE Control Tower PSB (Lina Maharani):"
          echo "     👉 http://de6w6jefch37pks4cbg9hivq.103.162.17.178.sslip.io/list-psb?q=FA65B42-DEMO"
          echo ""
          echo "  Tanpa query param juga works (APP_DATA_MODE=mock default):"
          echo "     👉 http://de6w6jefch37pks4cbg9hivq.103.162.17.178.sslip.io/list-psb"
          echo "========================================================"
