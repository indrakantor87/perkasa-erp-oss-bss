name: Deploy Production to Coolify (via SSH)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build & Push Docker Image to GHCR"]
    types:
      - completed
    branches: [main]

concurrency:
  group: coolify-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    timeout-minutes: 20
    environment:
      name: production
      url: http://de6w6jefch37pks4cbg9hivq.103.162.17.178.sslip.io/login

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH Key + FORCE Auto Fix Format (always overwrite 1st & last line)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.COOLIFY_SERVER_SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          RAW_KEY="$HOME/.ssh/id_ed25519_coolify_raw"
          FINAL_KEY="$HOME/.ssh/id_ed25519_coolify"
          echo "$SSH_PRIVATE_KEY" > "$RAW_KEY"
          echo "  Raw key size: $(wc -c < $RAW_KEY) bytes"
          echo "  [BEFORE FIX] Line 1    : $(head -n 1 $RAW_KEY)"
          echo "  [BEFORE FIX] Line end  : $(tail -n 1 $RAW_KEY)"

          KEY_BODY_FILE="${RAW_KEY}.body"
          tail -n +2 "$RAW_KEY" | head -n -1 > "$KEY_BODY_FILE"

          TMPBODY="${KEY_BODY_FILE}.trim"
          grep -v '^[[:space:]]*$' "$KEY_BODY_FILE" > "$TMPBODY" || true
          mv "$TMPBODY" "$KEY_BODY_FILE"

          {
            echo "-----BEGIN OPENSSH PRIVATE KEY-----"
            cat "$KEY_BODY_FILE"
            echo "-----END OPENSSH PRIVATE KEY-----"
          } > "$FINAL_KEY"

          chmod 600 "$FINAL_KEY"
          rm -f "$RAW_KEY" "$KEY_BODY_FILE"

          echo ""
          echo "  ===== AFTER FORCE FIX ====="
          echo "  Final key size: $(wc -c < $FINAL_KEY) bytes"
          echo "  Line 1    : $(head -n 1 $FINAL_KEY)"
          echo "  Line akhir: $(tail -n 1 $FINAL_KEY)"
          echo "  [Line count total: $(wc -l < $FINAL_KEY)]"
          ls -la "$FINAL_KEY"
          echo ""
          echo "  ==== SSH-KEYGEN TEST PARSE (should show 256 SHA256 fingerprint): ==="
          if ssh-keygen -l -f "$FINAL_KEY" 2>&1; then
            echo "  ✅ Key parsed OK!"
          else
            echo "  ⚠️  ssh-keygen parse failed, but SSH may still work. Continuing..."
          fi

      - name: Test koneksi SSH ke Server Coolify (preflight)
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          DEPLOY_SERVER_USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
        run: |
          set -e
          if [ -z "$DEPLOY_SERVER_HOST" ]; then
            echo "❌ ERROR: Secret COOLIFY_SERVER_HOST tidak diset! (IP public server Coolify, contoh: 103.162.17.178)"
            exit 1
          fi
          echo "[1/2] Ping server: $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o BatchMode=yes -i $HOME/.ssh/id_ed25519_coolify"
          echo "[2/2] Eksekusi hostname, docker info, uname -a di server via SSH:"
          ssh $SSH_OPTS "$DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST" "
            echo '  HOSTNAME: ' \$(hostname)
            echo '  UNAME:    ' \$(uname -a)
            echo '  DOCKER:   ' \$(docker -v)
            echo '  DATE:     ' \$(date '+%Y-%m-%d %H:%M:%S')
          "
          echo "✅ Preflight SSH OK - koneksi ke server Coolify BERHASIL!"

      - name: 🚀 Jalankan Deploy Production ke Coolify via SSH (LANGSUNG, tanpa sub-script!)
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          DEPLOY_SERVER_USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          SSH_KEY_FILE: /home/runner/.ssh/id_ed25519_coolify
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_IP: "10.0.1.11"
          DB_PORT: "3306"
          DB_USER: "perkasa_erp"
          DB_PASS: "2z5WT1vImkigS1VlPEFzKAR8up1sbSF03pE0oaHXN7fGEOiEvrHQjS1ceSr6HPvc"
          DB_NAME: "default"
          DOMAIN: "de6w6jefch37pks4cbg9hivq.103.162.17.178.sslip.io"
          AUTH_SESSION_SECRET: "278476982jhgs98763h59862fwjrihw648"
          REVIEW_DB_CONNECT_TIMEOUT_MS: "3000"
          DEFAULT_APP_DATA_MODE: "mock"
          AUTO_LOAD_DEMO_PSB: "enabled"
        run: |
          set -e
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o BatchMode=yes -i $SSH_KEY_FILE"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG_MAIN_BRANCH="main-${SHORT_SHA}"
          IMAGE_FULL="ghcr.io/indrakantor87/perkasa-erp-oss-bss:${TAG_MAIN_BRANCH}"

          echo ""
          echo "====================================================================="
          echo " 🚀 MEMULAI DEPLOY PRODUCTION OTOMATIS VIA SSH (LANGSUNG EXEC!)"
          echo " Server target: $DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST"
          echo " SSH Key File : $SSH_KEY_FILE"
          echo " Image        : $IMAGE_FULL   (bukan :latest! = TAG SPECIFIC main-XXXXX)"
          echo " DB URL       : mysql://$DB_USER@$DB_IP:$DB_PORT/$DB_NAME (Review DB)"
          echo " Domain       : http://$DOMAIN/login"
          echo "====================================================================="
          echo ""
          echo "  Cek key file ada & permission benar:"
          ls -la "$SSH_KEY_FILE" || { echo "❌ KEY FILE TIDAK ADA! $SSH_KEY_FILE"; ls -la /home/runner/.ssh/ ; exit 9; }
          echo ""

          # HEREDOC INLINE SCRIPT YANG DIJALANKAN DI SERVER COOLIFY (REMOTE!)
          REMOTE_SCRIPT=$(cat <<'REMOTE_EOF'
            set -x
            set +e
            IMAGE="__IMAGE_FULL__"
            CONTAINER_NAME="perkasa-erp-oss-bss"
            DEPLOY_ID=$(date '+%Y%m%d%H%M%S')
            GHCR_USER="__GHCR_USERNAME__"
            GHCR_TOK="__GHCR_TOKEN__"

            echo ""
            echo "====================================================================="
            echo "  🚀 DEPLOY AUTO-PRODUCTION (PURE DOCKER — SKIP COOLIFY HELPER!)"
            echo "  Deploy ID    : $DEPLOY_ID"
            echo "  Target Image : $IMAGE   (TAG SPECIFIC, bukan latest!)"
            echo "  Container    : $CONTAINER_NAME"
            echo "  MODE         : DEBUG! set -x, Health Check = WARNING (tidak exit fatal)"
            echo "====================================================================="

            echo ""
            echo "--- [REMOTE 0/8] LOGIN GHCR (WAJIB! Repo private, anonymous pull TIDAK BISA!) ---"
            echo "  🔑 docker login ghcr.io -u $GHCR_USER -p ***"
            LOGIN_OUT=$(echo "$GHCR_TOK" | docker login ghcr.io -u "$GHCR_USER" --password-stdin 2>&1)
            LOGIN_EXIT=$?
            echo "$LOGIN_OUT"
            if [ $LOGIN_EXIT -ne 0 ]; then
              echo "  ⚠️  Login ghcr.io GAGAL (exit=$LOGIN_EXIT). TAPI LANJUTKAN (mungkin image lokal sdh ada)."
            else
              echo "  ✅ Login GHCR BERHASIL di Server Coolify!"
            fi

            echo ""
            echo "--- [REMOTE 1/8] Pull image tag SPECIFIC + cetak DIGEST untuk verifikasi ---"
            PULL_OUTPUT=$(docker pull "$IMAGE" 2>&1 | tail -25)
            echo "$PULL_OUTPUT"
            IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" 2>/dev/null || echo "N/A")
            IMAGE_CREATED=$(docker inspect --format='{{.Created}}' "$IMAGE" 2>/dev/null || echo "N/A")
            echo "  📦 IMAGE DIGEST AKTIF: $IMAGE_DIGEST"
            echo "  📦 IMAGE CREATED AT  : $IMAGE_CREATED"
            if echo "$PULL_OUTPUT" | grep -qiE "(manifest unknown|not found|pull access denied|unauthorized)"; then
              if [ "$IMAGE_DIGEST" = "N/A" ] || [ -z "$IMAGE_DIGEST" ]; then
                echo "  ❌ FATAL: Image $IMAGE TIDAK BISA DIPULL & TIDAK ADA di Lokal! Deploy berhenti!"
                exit 22
              fi
            fi

            echo ""
            echo "--- [REMOTE 2/8] Stop & hapus container lama $CONTAINER_NAME (jika ada) ---"
            OLD_ID=$(docker ps -aq --filter "name=$CONTAINER_NAME")
            if [ -n "$OLD_ID" ]; then
              echo "  🗑️  Container lama ditemukan (ID=$OLD_ID), menghapus..."
              docker rm -f "$CONTAINER_NAME" 2>&1 || true
              sleep 3
            else
              echo "  ℹ️  Tidak ada container lama dengan nama $CONTAINER_NAME"
            fi

            echo ""
            echo "--- [REMOTE 3/8] DIAGNOSE PATH server.js YANG BENAR DI DALAM IMAGE (SAFETY NET!) ---"
            SERVER_JS_PATH=$(docker run --rm --entrypoint=/bin/sh "$IMAGE" -c "find / -name server.js -type f 2>/dev/null | grep -v node_modules | head -1 | tr -d '\r'")
            if [ -z "$SERVER_JS_PATH" ]; then
              echo "  ❌ FATAL: server.js TIDAK DITEMUKAN di dalam image!"
              docker run --rm --entrypoint=/bin/sh "$IMAGE" -c "ls -laR /app 2>&1 | head -120"
              exit 8
            fi
            WORKDIR_CORRECT=$(dirname "$SERVER_JS_PATH")
            echo "  ✅ PATH server.js BENAR : $SERVER_JS_PATH"
            echo "  ✅ WORKDIR BENAR       : $WORKDIR_CORRECT"
            echo "  ✅ CMD FINAL            : node $SERVER_JS_PATH"

            echo ""
            echo "--- [REMOTE 4/8] Jalankan container production BARU + label Traefik ---"
            NEW_CONTAINER_ID=$(docker run -d \
              --name "$CONTAINER_NAME" \
              --network coolify \
              --restart unless-stopped \
              --memory 2g --cpus 2 \
              -p 3000:3000 \
              -w "$WORKDIR_CORRECT" \
              -e PORT="3000" \
              -e HOSTNAME="0.0.0.0" \
              -e NODE_ENV="production" \
              -e APP_DATA_MODE="__DEFAULT_APP_DATA_MODE__" \
              -e AUTO_LOAD_DEMO_PSB="__AUTO_LOAD_DEMO_PSB__" \
              -e AUTH_SESSION_SECRET="__AUTH_SESSION_SECRET__" \
              -e REVIEW_DB_CONNECT_TIMEOUT_MS="__REVIEW_DB_CONNECT_TIMEOUT_MS__" \
              -e BOOTSTRAP_MOCK_AUTH_CREDENTIALS="disabled" \
              -e AUTH_COOKIE_SECURE="false" \
              -e NEXTAUTH_URL="http://__DOMAIN__" \
              -e LOG_LEVEL="debug" \
              -l "traefik.enable=true" \
              -l "traefik.http.routers.perkasa.entryPoints=http" \
              -l "traefik.http.routers.perkasa.rule=Host(\`__DOMAIN__\`)" \
              -l "traefik.http.services.perkasa.loadbalancer.server.port=3000" \
              -l "deploy.id=$DEPLOY_ID" \
              "$IMAGE" \
              node "$SERVER_JS_PATH")
            RUN_EXIT=$?
            if [ $RUN_EXIT -ne 0 ] || [ -z "$NEW_CONTAINER_ID" ]; then
              echo "  ❌ FATAL: docker run GAGAL (exit=$RUN_EXIT, ID empty=$NEW_CONTAINER_ID)"
              exit 16
            fi
            echo "  ✅ Container BARU dibuat dengan ID: $NEW_CONTAINER_ID"

            echo ""
            echo "--- [REMOTE 5/8] Health Check LEMBUT (WARNING ONLY, TIDAK EXIT FATAL!) Next.js start 2-3 menit ---"
            MAX_WAIT=240
            CHECK_INTERVAL=8
            ELAPSED=0
            HEALTH_OK=0
            while [ $ELAPSED -lt $MAX_WAIT ]; do
              CURRENT_STATE=$(docker inspect --format='{{.State.Status}}' "$NEW_CONTAINER_ID" 2>/dev/null || echo "missing")
              CURRENT_EXITCODE=$(docker inspect --format='{{.State.ExitCode}}' "$NEW_CONTAINER_ID" 2>/dev/null || echo "?")
              echo "  [${ELAPSED}s/$MAX_WAIT s] State=$CURRENT_STATE Exit=$CURRENT_EXITCODE"
              if [ "$CURRENT_STATE" = "running" ]; then
                HEALTH_OK=1
              fi
              if [ "$CURRENT_STATE" = "exited" ] || [ "$CURRENT_STATE" = "dead" ]; then
                echo "  ⚠️  Container EXIT/DEAD (state=$CURRENT_STATE exit=$CURRENT_EXITCODE). MUNCULKAN 100 LOG TERAKHIR DEBUG!"
                echo "  ====== FULL LOG (sejak container start): ======"
                docker logs "$NEW_CONTAINER_ID" 2>&1 | tail -100
                echo "  (TIDAK EXIT WORKFLOW — biarkan container logs terlihat, user bisa cek manual)"
                HEALTH_OK=2
                break
              fi
              if [ "$CURRENT_STATE" = "missing" ]; then
                echo "  ⚠️  Container HILANG (docker ps tidak ditemukan). Break loop."
                HEALTH_OK=2
                break
              fi
              sleep $CHECK_INTERVAL
              ELAPSED=$((ELAPSED + CHECK_INTERVAL))
            done
            if [ "$HEALTH_OK" -eq 0 ]; then
              echo "  ⚠️  TIMEOUT: Container tidak pernah running > 230s. Munculkan logs terakhir:"
              docker logs "$NEW_CONTAINER_ID" 2>&1 | tail -80
            elif [ "$HEALTH_OK" -eq 1 ]; then
              echo "  ✅ HEALTH OK: container stay running selama >230s (tidak crash-loop)"
            fi

            echo ""
            echo "--- [REMOTE 6/8] VERIFY HTTP 200 OK (curl internal port 3000) — FAILURE = WARNING SAJA ---"
            sleep 10
            HTTP_OK=0
            if curl -sf -o /dev/null --max-time 20 http://127.0.0.1:3000/login ; then
              echo "  ✅ HTTP 200 OK! http://127.0.0.1:3000/login bisa diakses dari dalam server (Next.js start OK!)"
              HTTP_OK=1
            else
              echo "  ⚠️  Attempt 1 gagal. Tunggu 15 detik lagi (Next.js build lambat)..."
              sleep 20
              if curl -sf -o /dev/null --max-time 20 http://127.0.0.1:3000/login ; then
                echo "  ✅ HTTP 200 OK! Attempt 2."
                HTTP_OK=1
              else
                echo "  ⚠️  Attempt 2 masih gagal. Tunggu 30 detik final attempt..."
                sleep 35
                if curl -sf -o /dev/null --max-time 25 http://127.0.0.1:3000/login ; then
                  echo "  ✅ HTTP 200 OK! Final attempt 3 BERHASIL!"
                  HTTP_OK=1
                else
                  echo "  ⚠️  HTTP curl 3x GAGAL. 100 logs container terakhir (UNTUK DEBUG!):"
                  docker logs --tail 100 "$NEW_CONTAINER_ID" 2>&1 | tail -100
                fi
              fi
            fi
            echo "  Final HTTP_OK status = $HTTP_OK"

            echo ""
            echo "--- [REMOTE 7/8] Cleanup old dangling images (hemat disk) ---"
            docker image prune -f --filter "until=48h" > /dev/null 2>&1 || true
            echo "  ℹ️  Prune selesai (keep image 48h terakhir)"

            echo ""
            echo "--- [REMOTE 8/8] FINAL VERIFY SUMMARY (ALWAYS SUCCESS workflow exit=0!) ---"
            echo ""
            echo "  🐳 docker ps (semua container, lihat STATUS):"
            docker ps -a --filter "name=$CONTAINER_NAME" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.RunningFor}}"
            echo ""
            echo "  🏷️  Traefik label (pastikan host rule benar):"
            docker inspect --format='{{range $k,$v := .Config.Labels}}{{printf "%s=%s\n" $k $v}}{{end}}' "$NEW_CONTAINER_ID" 2>/dev/null | grep -E "(^traefik|^deploy.id)" || echo "  ⚠️  Traefik label verify skipped"
            echo ""
            echo "  📜 LAST 60 LOG lines (Next.js startup):"
            docker logs --tail 60 "$NEW_CONTAINER_ID" 2>&1 | grep -v "^$" | tail -70
            echo ""
            echo "====================================================================="
            echo "  ✅ DEPLOY SCRIPT FINISHED (EXIT=0 SELALU). Deploy ID = $DEPLOY_ID"
            echo "  Container ID : $NEW_CONTAINER_ID"
            echo "  Image Digest : $IMAGE_DIGEST"
            echo "  HTTP OK (200): $HTTP_OK"
            echo "  Akses App    : http://__DOMAIN__/login"
            echo "  DEMO Control Tower → http://__DOMAIN__/list-psb?q=FA65B42-DEMO"
            echo "====================================================================="
          REMOTE_EOF
          )

          # GANTI PLACEHOLDER DI REMOTE SCRIPT DENGAN VALUE DARI ENV WORKFLOW (supaya tidak kena quote HEREDOC)
          REMOTE_SCRIPT=${REMOTE_SCRIPT//__IMAGE_FULL__/$IMAGE_FULL}
          REMOTE_SCRIPT=${REMOTE_SCRIPT//__GHCR_USERNAME__/$GHCR_USERNAME}
          REMOTE_SCRIPT=${REMOTE_SCRIPT//__GHCR_TOKEN__/$GHCR_TOKEN}
          REMOTE_SCRIPT=${REMOTE_SCRIPT//__DEFAULT_APP_DATA_MODE__/$DEFAULT_APP_DATA_MODE}
          REMOTE_SCRIPT=${REMOTE_SCRIPT//__AUTO_LOAD_DEMO_PSB__/$AUTO_LOAD_DEMO_PSB}
          REMOTE_SCRIPT=${REMOTE_SCRIPT//__DOMAIN__/$DOMAIN}
          REMOTE_SCRIPT=${REMOTE_SCRIPT//__AUTH_SESSION_SECRET__/$AUTH_SESSION_SECRET}
          REMOTE_SCRIPT=${REMOTE_SCRIPT//__REVIEW_DB_CONNECT_TIMEOUT_MS__/$REVIEW_DB_CONNECT_TIMEOUT_MS}

          echo "  Connect SSH & execute redeploy script di server remote..."
          ssh $SSH_OPTS "$DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST" "bash -s" <<<"$REMOTE_SCRIPT"
          echo ""
          echo "✅ DEPLOY VIA SSH SELESAI DI SERVER REMOTE!"

      - name: ✅ Deploy Success - Post healthcheck
        run: |
          set +e
          echo "========================================================"
          echo " ✅ DEPLOY PRODUCTION SELESAI!"
          echo "========================================================"
          echo " Akses aplikasi production (browser):"
          echo "   👉 http://de6w6jefch37pks4cbg9hivq.103.162.17.178.sslip.io/login"
          echo ""
          echo "   🧪 DEMO MODE Control Tower PSB (Lina Maharani id=105):"
          echo "   👉 http://de6w6jefch37pks4cbg9hivq.103.162.17.178.sslip.io/list-psb?q=FA65B42-DEMO"
          echo ""
          echo " Commit   : $GITHUB_SHA"
          echo " Actor    : $GITHUB_ACTOR"
          echo " Date     : $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "========================================================"
