name: "⭐ RECOVERY INTI 1-2-3: Docker Start All Exited + Proxy Restart (Bash Saja)"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  recovery_core:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "0. Precheck & Install SSH Key"
        run: |
          set +e
          HOST="${{ secrets.COOLIFY_SERVER_HOST }}"
          USER="${{ secrets.COOLIFY_SERVER_USER }}"
          USER="${USER:-root}"
          KEY="${{ secrets.COOLIFY_SERVER_SSH_PRIVATE_KEY }}"
          HOST_LEN=$(printf '%s' "$HOST" | wc -c | tr -d ' ')
          KEY_LEN=$(printf '%s' "$KEY" | wc -c | tr -d ' ')
          echo "HOST=$HOST"
          echo "USER=$USER"
          echo "HOST_LEN=$HOST_LEN"
          echo "KEY_LEN=$KEY_LEN"
          if [ "$KEY_LEN" -lt 150 ]; then
            echo "ERROR: SSH PRIVATE KEY KOSONG / terlalu pendek. Isi di Repo Settings > Secrets > Actions"
            exit 1
          fi
          mkdir -p $HOME/.ssh
          chmod 700 $HOME/.ssh
          KEY_FILE=$HOME/.ssh/id_ed25519_coolify
          printf '%s\n' '-----BEGIN OPENSSH PRIVATE KEY-----' > /tmp/hdr.txt
          printf '%s\n' '-----END OPENSSH PRIVATE KEY-----' > /tmp/tlr.txt
          printf '%s' "$KEY" | grep -v 'OPENSSH PRIVATE KEY' | tr -d '\r' > /tmp/body.txt
          (cat /tmp/hdr.txt; cat /tmp/body.txt; cat /tmp/tlr.txt) > $KEY_FILE
          chmod 600 $KEY_FILE
          echo "KEY_FILE=$KEY_FILE" >> $GITHUB_ENV
          echo "USER=$USER" >> $GITHUB_ENV
          echo "HOST=$HOST" >> $GITHUB_ENV
          ssh -V
          echo "OK: SSH key ready"

      - name: "⭐ STEP 1: SSH PREFLIGHT + Lihat Container Sebelum Recovery"
        run: |
          set +e
          KEY=$HOME/.ssh/id_ed25519_coolify
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $KEY"
          OUTPUT=$(ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" '
            set +e
            echo "===== [SERVER UPTIME & DISK] ====="
            uptime
            echo ""
            df -h /
            echo ""
            echo "===== [DOCKER PS -a SEBELUM RECOVERY] ====="
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}" 2>&1 | head -50
            echo ""
            echo "===== [EXITED / CREATED / DEAD containers (akan di-start)] ====="
            docker ps -aq -f status=exited -f status=created -f status=dead 2>&1
            echo ""
            echo "===== [COOLIFY PROXY STATUS] ====="
            docker ps --format "table {{.Names}}\t{{.Status}}" 2>&1 | grep -iE "proxy|traefik"
            echo "PREFLIGHT OK"
          ' 2>&1)
          RC=$?
          echo "$OUTPUT"
          echo ""
          echo "STEP 1 SSH RC=$RC"
          if [ $RC -ne 0 ]; then
            echo ""
            echo "==================== STEP 1 FAIL — LAST 80 LINES OUTPUT ===================="
            printf "%s\n" "$OUTPUT" | tail -80
            echo "============================================================================"
            echo "ERROR: SSH gagal! Periksa secrets COOLIFY_SERVER_HOST / USER / SSH_PRIVATE_KEY."
            exit 1
          fi

      - name: "⭐ STEP 2: HAPUS CONTAINER MANUAL SALAH LABEL (web-psb-perkasa manual single quote) + PASTIKAN NETWORK COOLIFY ADA"
        run: |
          set +e
          KEY=$HOME/.ssh/id_ed25519_coolify
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $KEY"
          OUTPUT=$(ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" '
            set +e
            echo "=== Bersihkan container manual yang labelnya salah (single quote) ==="
            BAD=$(docker ps -aq --format "{{.Names}}" | grep -iE "^web-psb-perkasa$|fallback$" | head -20)
            for C in $BAD; do
              echo "  -> docker rm -f $C"
              docker rm -f $C 2>&1 | head -2
            done
            echo ""
            echo "=== Pastikan network coolify ada ==="
            NET_EXIST=$(docker network ls --format "{{.Name}}" | grep -cE "^coolify$")
            if [ "$NET_EXIST" -eq 0 ]; then
              echo "  buat network coolify"
              docker network create coolify 2>&1 | head -2
            else
              echo "  network coolify sudah ada OK"
            fi
            echo ""
            echo "=== Pastikan coolify-proxy UP ==="
            PRX=$(docker ps -aq --format "{{.Names}}" | grep -iE coolify-proxy | head -1)
            if [ -n "$PRX" ]; then
              PRX_UP=$(docker inspect --format="{{.State.Running}}" "$PRX" 2>/dev/null)
              if [ "$PRX_UP" != "true" ]; then
                echo "  start $PRX"
                docker start "$PRX" 2>&1 | head -2
              else
                echo "  $PRX sudah UP"
              fi
            fi
            echo "STEP 2 OK"
          ' 2>&1)
          RC=$?
          echo "$OUTPUT"
          echo ""
          echo "STEP 2 SSH RC=$RC"
          if [ $RC -ne 0 ]; then
            echo ""
            echo "==================== STEP 2 FAIL — LAST 80 LINES OUTPUT ===================="
            printf "%s\n" "$OUTPUT" | tail -80
            echo "============================================================================"
            echo "WARNING: Step2 non-critical FAIL — LANJUTKAN Step3+ (priority Web PSB)"
          fi

      - name: "⭐ STEP 3: DOCKER START SEMUA EXITED / CREATED / DEAD CONTAINERS (COOLIFY ASLI = LABEL BACKTICK BENAR!) [NON-CRITICAL, TIMEOUT 2M]"
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set +e
          KEY=$HOME/.ssh/id_ed25519_coolify
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $KEY"
          OUTPUT=$(ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" '
            set +e
            echo "=== STEP 3: DOCKER START SEMUA EXITED (NON-CRITICAL, TIMEOUT PAKSA 2M) ==="
            LIST=$(docker ps -aq -f status=exited -f status=created -f status=dead 2>/dev/null)
            LIST_COUNT=$(echo "$LIST" | grep -c . || true)
            echo "  Jumlah exited containers = $LIST_COUNT (maksimal 20 di-start, selewatnya SKIP demi kecepatan Step5 Web PSB P1)"
            TOTAL=0; OK=0; FAIL=0; FAIL_LIST=""
            START_LIMIT=20; STARTED_NOW=0
            for C in $LIST; do
              NAME=$(docker inspect --format="{{.Name}}" "$C" 2>/dev/null | sed s#/##)
              case "$NAME" in *coolify-helper*) TOTAL=$((TOTAL+1)); continue ;; esac
              TOTAL=$((TOTAL+1)); STARTED_NOW=$((STARTED_NOW+1))
              if [ $STARTED_NOW -gt $START_LIMIT ]; then
                FAIL=$((FAIL+1)); FAIL_LIST="$FAIL_LIST ${NAME}(skip-limit)"; continue
              fi
              timeout 8 docker start "$C" >/dev/null 2>&1
              RC=$?
              if [ $RC -eq 0 ]; then
                UP=$(docker inspect --format="{{.State.Running}}" "$C" 2>/dev/null)
                if [ "$UP" = "true" ]; then OK=$((OK+1)); else FAIL=$((FAIL+1)); FAIL_LIST="$FAIL_LIST $NAME"; fi
              else
                FAIL=$((FAIL+1)); FAIL_LIST="$FAIL_LIST $NAME"
              fi
            done
            echo "RINGKASAN: TOTAL=$TOTAL | OK=$OK | FAIL=$FAIL (LIMIT=$START_LIMIT)"
            [ -n "$FAIL_LIST" ] && echo "CONTAINER YANG FAIL/SKIP (non-critical): [${FAIL_LIST:0:200}...]"
            echo "=== DOCKER PS UP (first 20) ==="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" 2>&1 | head -20
            echo "STEP 3 OK (non-critical, Step5 Web PSB P1 DIUTAMAKAN!)"
          ' 2>&1)
          RC=$?
          echo "$OUTPUT"
          echo ""
          echo "STEP 3 SSH RC=$RC"
          if [ $RC -ne 0 ]; then
            echo ""
            echo "==================== STEP 3 FAIL — LAST 80 LINES OUTPUT ===================="
            printf "%s\n" "$OUTPUT" | tail -80
            echo "============================================================================"
            echo "WARNING: Step3 non-critical FAIL — LANJUTKAN Step4/5/6 (PRIORITAS Web PSB P1!)"
          fi

      - name: "⭐ STEP 4: RESTART COOLIFY-PROXY (Traefik) AGAR RELOAD DYNAMIC CONFIG + WAIT 45s"
        continue-on-error: true
        run: |
          set +e
          KEY=$HOME/.ssh/id_ed25519_coolify
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $KEY"
          OUTPUT=$(ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" '
            set +e
            echo "=== STEP 4: RESTART COOLIFY-PROXY + WAIT 45s ==="
            PRX=$(docker ps -aq --format "{{.Names}}" | grep -iE coolify-proxy | head -1)
            [ -n "$PRX" ] && docker restart "$PRX" 2>&1 | head -2
            sleep 45
            echo "=== Final container list UP ==="
            docker ps --format "table {{.Names}}\t{{.Status}}" 2>&1 | head -30
            echo "STEP 4 OK"
          ' 2>&1)
          RC=$?
          echo "$OUTPUT"
          echo ""
          echo "STEP 4 SSH RC=$RC"
          if [ $RC -ne 0 ]; then
            echo ""
            echo "==================== STEP 4 FAIL — LAST 80 LINES OUTPUT ===================="
            printf "%s\n" "$OUTPUT" | tail -80
            echo "============================================================================"
            echo "WARNING: Step4 non-critical FAIL — LANJUTKAN Step5/6 (PRIORITAS Web PSB P1!)"
          fi

      - name: "⭐ STEP 5: WEB PSB CUSTOM DOMAIN (PRIORITAS #1) - 4 FAIL_FAST VERIFY BT|NET|LABEL|APP + MULTI METHOD BACKTICK"
        timeout-minutes: 12
        run: |
          set +e
          KEY=$HOME/.ssh/id_ed25519_coolify
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $KEY"
          OUTPUT=$(ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" '
            set +e
            echo "=== STEP 5: WEB PSB CUSTOM DOMAIN (PRIORITAS #1) - 4 FAIL_FAST VERIFY + MULTI METHOD BACKTICK ==="
            echo "[5.0] MULTI-METHOD BACKTICK EXPANSION (PILIH YANG HASIL ASCII 96)"
            ord_of() {
              printf "%s" "$1" | od -An -tuC | tr -d " \n"
            }
            BT1=$(printf "\x60")
            BT2=$(printf "\140")
            BT3=$(printf "\\$(printf "%03o" 96)")
            BT_LEN1=${#BT1}; BT_LEN2=${#BT2}; BT_LEN3=${#BT3}
            ORD1=$(ord_of "$BT1"); ORD2=$(ord_of "$BT2"); ORD3=$(ord_of "$BT3")
            [ -z "$ORD1" ] && ORD1=0; [ -z "$ORD2" ] && ORD2=0; [ -z "$ORD3" ] && ORD3=0
            echo "  BT1 printf_hex  len=$BT_LEN1 ORD=$ORD1 (expect 96)"
            echo "  BT2 printf_oct  len=$BT_LEN2 ORD=$ORD2 (expect 96)"
            echo "  BT3 printf_dec  len=$BT_LEN3 ORD=$ORD3 (expect 96)"
            BT=""
            if [ "$ORD1" -eq 96 ] && [ "$BT_LEN1" -eq 1 ]; then BT="$BT1"; echo "  ✅ PAKAI BT1 printf hex OK"; fi
            if [ -z "$BT" ] && [ "$ORD2" -eq 96 ] && [ "$BT_LEN2" -eq 1 ]; then BT="$BT2"; echo "  ✅ PAKAI BT2 printf oct OK"; fi
            if [ -z "$BT" ] && [ "$ORD3" -eq 96 ] && [ "$BT_LEN3" -eq 1 ]; then BT="$BT3"; echo "  ✅ PAKAI BT3 printf dec OK"; fi
            BT_ORD=$(ord_of "$BT"); BT_LEN=${#BT}
            [ -z "$BT_ORD" ] && BT_ORD=0
            if [ "$BT_ORD" -ne 96 ] || [ "$BT_LEN" -ne 1 ]; then
              echo "FAIL_FAST_REASON=BT_EXPAND_NOT_BACKTICK|BT_ORD=$BT_ORD|BT_LEN=$BT_LEN|ORD1=$ORD1|ORD2=$ORD2|ORD3=$ORD3"
              exit 1
            fi
            echo "  ✅ VERIFY5A OK: BT FINAL ORD=$BT_ORD LEN=$BT_LEN (ASCII 96 backtick)"
            echo "[5.1] EXTRACT ENV VARS NEXT.JS DARI CONTAINER COOLIFY LAMA (jika ada)"
            OLD_PSB_ENV=$(docker ps -aq --format "{{.Names}}" | grep -iE "^web-psb-perkasa-|^web_psb" | head -1)
            ENV_DATABASE_URL=""; ENV_NEXTAUTH_URL=""; ENV_JWT_SECRET=""
            if [ -n "$OLD_PSB_ENV" ]; then
              echo "  Ketemu container lama $OLD_PSB_ENV -> extract env vars..."
              ENV_DATABASE_URL=$(docker inspect "$OLD_PSB_ENV" 2>/dev/null | grep -A2000 "Env\":" | grep -oE "DATABASE_URL=[^,\" ]+" | head -1 | sed "s/DATABASE_URL=//")
              ENV_NEXTAUTH_URL=$(docker inspect "$OLD_PSB_ENV" 2>/dev/null | grep -A2000 "Env\":" | grep -oE "NEXTAUTH_URL=[^,\" ]+" | head -1 | sed "s/NEXTAUTH_URL=//")
              ENV_JWT_SECRET=$(docker inspect "$OLD_PSB_ENV" 2>/dev/null | grep -A2000 "Env\":" | grep -oE "JWT_SECRET=[^,\" ]+" | head -1 | sed "s/JWT_SECRET=//")
              [ -n "$ENV_DATABASE_URL" ] && echo "  ✅ DATABASE_URL ditemukan (len=${#ENV_DATABASE_URL})"
              [ -n "$ENV_NEXTAUTH_URL" ] && echo "  ✅ NEXTAUTH_URL=$ENV_NEXTAUTH_URL"
              [ -n "$ENV_JWT_SECRET" ] && echo "  ✅ JWT_SECRET ditemukan (len=${#ENV_JWT_SECRET})"
            else
              echo "  (tidak ada container lama, pakai env dasar)"
            fi
            echo "[5.2] HAPUS CONTAINER PSB LAMA (label salah)"
            OLD_LIST=$(docker ps -aq --format "{{.Names}}" | grep -iE "web.psb|webpsb|psb|ultrafast|fallback|recoverycore")
            [ -n "$OLD_LIST" ] && for C in $OLD_LIST; do docker rm -f $C >/dev/null 2>&1; done
            echo "[5.3] CARI & VERIFIKASI IMAGE WEB PSB"
            docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}\t{{.ID}}" 2>&1 | grep -iE "psb|perkasa|web" | head -15
            IMG_PSB=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -iE "local-web-psb" | head -1)
            [ -z "$IMG_PSB" ] && IMG_PSB=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -iE "web-psb-perkasa|webpsb" | head -1)
            [ -z "$IMG_PSB" ] && IMG_PSB="ghcr.io/indrakantor87/web-psb-perkasa:latest"
            echo "  Image terpilih: $IMG_PSB"
            docker image inspect "$IMG_PSB" > /dev/null 2>&1
            RC_IMG=$?
            if [ $RC_IMG -ne 0 ]; then
              echo "FAIL_FAST_REASON=IMAGE_NOT_FOUND|IMAGE=$IMG_PSB|RC=$RC_IMG"
              echo "  LIST IMAGES (30 teratas):"
              docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}\t{{.ID}}" 2>&1 | head -30
              exit 1
            fi
            echo "  ✅ Image OK"
            echo "[5.4] DOCKER RUN 2 LABEL HOST (Custom + SSLIP)"
            NAME="webpsb-recoverycore-customdomain"
            SSLIP_DOM="pic3vleasj465ooh77ioicw6.103.162.17.178.sslip.io"
            CUSTOM_DOM="webpsb.perkasa.net.id"
            L_RULE_SSLIP="traefik.http.routers.wpssl.rule=Host(${BT}${SSLIP_DOM}${BT})"
            L_RULE_CUSTOM="traefik.http.routers.wpnetid.rule=Host(${BT}${CUSTOM_DOM}${BT})"
            echo "  Rule SSLIP RAW: $L_RULE_SSLIP"
            echo "  Rule Custom RAW: $L_RULE_CUSTOM"
            RULE_CUSTOM_LEN=${#L_RULE_CUSTOM}
            echo "  Rule Custom len=$RULE_CUSTOM_LEN"
            PSB_PORT_HOST=3005
            PORT_USED=$(netstat -tln 2>/dev/null | grep -c ":$PSB_PORT_HOST " || true)
            if [ "$PORT_USED" -gt 0 ]; then
              PSB_PORT_HOST=3006
              PORT_USED2=$(netstat -tln 2>/dev/null | grep -c ":$PSB_PORT_HOST " || true)
              if [ "$PORT_USED2" -gt 0 ]; then
                echo "FAIL_FAST_REASON=PORT_CONFLICT|PORT3005_USED=$PORT_USED|PORT3006_USED=$PORT_USED2"
                netstat -tln 2>/dev/null | head -20
                exit 1
              fi
            fi
            echo "  Port: $PSB_PORT_HOST:3000"
            docker rm -f "$NAME" 2>/dev/null || true
            sleep 1
            EXTRA_ENV=""
            [ -n "$ENV_DATABASE_URL" ] && EXTRA_ENV="$EXTRA_ENV -e DATABASE_URL=$ENV_DATABASE_URL"
            [ -n "$ENV_NEXTAUTH_URL" ] && EXTRA_ENV="$EXTRA_ENV -e NEXTAUTH_URL=$ENV_NEXTAUTH_URL"
            [ -n "$ENV_JWT_SECRET" ] && EXTRA_ENV="$EXTRA_ENV -e JWT_SECRET=$ENV_JWT_SECRET"
            echo "  Extra env flags: [$EXTRA_ENV]"
            docker run -d --name "$NAME" --network coolify --restart unless-stopped -p ${PSB_PORT_HOST}:3000 -e PORT=3000 -e HOSTNAME=0.0.0.0 -e NODE_ENV=production $EXTRA_ENV -l "traefik.enable=true" -l "traefik.docker.network=coolify" -l "traefik.http.routers.wpssl.entryPoints=http" -l "$L_RULE_SSLIP" -l "traefik.http.services.wpssl.loadbalancer.server.port=3000" -l "traefik.http.routers.wpnetid.entryPoints=http" -l "$L_RULE_CUSTOM" -l "traefik.http.services.wpnetid.loadbalancer.server.port=3000" "$IMG_PSB" > /tmp/psb_cid.txt 2> /tmp/psb_err.txt
            RC=$?
            CID=$(cat /tmp/psb_cid.txt 2>/dev/null | head -1 | tr -d "\r\n")
            ERR=$(cat /tmp/psb_err.txt 2>/dev/null | tail -15 | tr -d "\r")
            if [ $RC -ne 0 ] || [ -z "$CID" ]; then
              echo "FAIL_FAST_REASON=DOCKER_RUN_FAILED|RC=$RC|CID=[$CID]"
              echo "STDERR docker run (15 lines):"
              printf "%s\n" "$ERR"
              echo "LIST CONTAINER psb related:"
              docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Ports}}" 2>&1 | grep -iE "web.psb|webpsb|psb|ultrafast|fallback|recoverycore"
              exit 1
            fi
            echo "  ✅ Docker run OK CID=${CID:0:20} | Custom: https://$CUSTOM_DOM | SSLIP: http://$SSLIP_DOM"
            echo "  [VERIFY5B] CONTAINER ATTACH NETWORK COOLIFY"
            sleep 3
            NET_ID=$(docker inspect -f "{{.NetworkSettings.Networks.coolify.NetworkID}}" "$CID" 2>/dev/null)
            NET_IP=$(docker inspect -f "{{.NetworkSettings.Networks.coolify.IPAddress}}" "$CID" 2>/dev/null)
            NET_LEN=${#NET_ID}
            echo "    NetworkID len=$NET_LEN value=[${NET_ID:0:20}...]"
            echo "    Network coolify IP=$NET_IP"
            if [ "$NET_LEN" -lt 5 ]; then
              echo "FAIL_FAST_REASON=CONTAINER_NOT_ATTACH_COOLIFY_NETWORK|NET_ID_LEN=$NET_LEN|NET_ID=[$NET_ID]"
              echo "  NETWORK LIST INSPECT:"
              docker inspect -f "{{json .NetworkSettings.Networks}}" "$CID" 2>/dev/null
              echo "  DOCKER NETWORK LS:"
              docker network ls --format "table {{.Name}}\t{{.Driver}}\t{{.Scope}}"
              exit 1
            fi
            echo "  ✅ VERIFY5B OK: Container terdaftar di network coolify (IP=$NET_IP)"
            echo "  [VERIFY5C] HOST RULE LABEL ASCII INSPECT (BACKTICK ORD 96 WAJIB ADA)"
            RULE_CUSTOM_VAL=$(docker inspect -f "{{ index .Config.Labels \"traefik.http.routers.wpnetid.rule\" }}" "$CID" 2>/dev/null)
            RULE_SSLIP_VAL=$(docker inspect -f "{{ index .Config.Labels \"traefik.http.routers.wpssl.rule\" }}" "$CID" 2>/dev/null)
            echo "    Rule wpnetid (custom) dari docker label inspect=[$RULE_CUSTOM_VAL]"
            echo "    Rule wpssl (sslip)   dari docker label inspect=[$RULE_SSLIP_VAL]"
            RULE_ORD_ARRAY=""
            FOUND_BACKTICK_CUSTOM=0
            RC_LEN=${#RULE_CUSTOM_VAL}
            for ((i=0;i<RC_LEN;i++)); do
              ch="${RULE_CUSTOM_VAL:i:1}"
              ord=$(ord_of "$ch"); [ -z "$ord" ] && ord=0
              if [ "$ord" -eq 96 ]; then FOUND_BACKTICK_CUSTOM=$((FOUND_BACKTICK_CUSTOM+1)); fi
              RULE_ORD_ARRAY="$RULE_ORD_ARRAY $ord"
            done
            echo "    Rule Custom ord array (len=$RC_LEN backtick_count=$FOUND_BACKTICK_CUSTOM):[${RULE_ORD_ARRAY:0:200}...]"
            FOUND_BACKTICK_SSLIP=0
            RS_LEN=${#RULE_SSLIP_VAL}
            RULE_ORD_ARRAY2=""
            for ((i=0;i<RS_LEN;i++)); do
              ch="${RULE_SSLIP_VAL:i:1}"
              ord=$(ord_of "$ch"); [ -z "$ord" ] && ord=0
              if [ "$ord" -eq 96 ]; then FOUND_BACKTICK_SSLIP=$((FOUND_BACKTICK_SSLIP+1)); fi
              RULE_ORD_ARRAY2="$RULE_ORD_ARRAY2 $ord"
            done
            echo "    Rule SSLIP ord array (len=$RS_LEN backtick_count=$FOUND_BACKTICK_SSLIP):[${RULE_ORD_ARRAY2:0:200}...]"
            if [ "$FOUND_BACKTICK_CUSTOM" -lt 2 ] || [ "$FOUND_BACKTICK_SSLIP" -lt 2 ]; then
              echo "FAIL_FAST_REASON=HOST_RULE_LABEL_NOT_BACKTICK|CUSTOM_BT=$FOUND_BACKTICK_CUSTOM/2|SSLIP_BT=$FOUND_BACKTICK_SSLIP/2"
              echo "  ALL LABELS CID:"
              docker inspect -f "{{json .Config.Labels}}" "$CID" 2>/dev/null | tr "," "\n" | grep -iE "traefik|host|rule" | head -30
              exit 1
            fi
            echo "  ✅ VERIFY5C OK: Label wpnetid=$FOUND_BACKTICK_CUSTOM backtick + wpssl=$FOUND_BACKTICK_SSLIP backtick (BUKAN single/double quote!)"
            echo "  [VERIFY5D] POLL CONTAINER RUNNING 3x 5s (CEK NEXT.JS TIDAK CRASH SETELAH START)"
            POLL_OK=0
            for p in 1 2 3; do
              sleep 5
              ST=$(docker inspect --format="{{.State.Running}}" "$CID" 2>/dev/null)
              EX=$(docker inspect --format="{{.State.ExitCode}}" "$CID" 2>/dev/null)
              echo "    Poll $p: Running=$ST Exit=$EX"
              if [ "$ST" = "true" ] && [ "$EX" -eq 0 ]; then POLL_OK=$((POLL_OK+1)); fi
            done
            if [ "$POLL_OK" -lt 2 ]; then
              echo "FAIL_FAST_REASON=APP_CRASH_AFTER_RUN|POLL_OK=$POLL_OK/3|Exit=$EX"
              echo "  LAST 60 LOGS PSB:"
              docker logs --tail 60 "$CID" 2>&1 | tail -70
              echo "  FULL STATE:"
              docker inspect -f "{{json .State}}" "$CID" 2>/dev/null
              exit 1
            fi
            echo "  ✅ VERIFY5D OK: Container Next.js tetap running 3x poll ($POLL_OK/3 = app tidak crash)"
            echo "  [5.4.1] FINAL DIAGNOSTIC BEFORE PROXY RESTART"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" 2>&1 | grep -iE "web.psb|webpsb|psb|proxy"
            echo "  Status=$(docker inspect --format="{{.State.Status}}" "$CID" 2>/dev/null) Running=$(docker inspect --format="{{.State.Running}}" "$CID" 2>/dev/null) Exit=$(docker inspect --format="{{.State.ExitCode}}" "$CID" 2>/dev/null)"
            echo "  LOGS last 20 app:"
            docker logs --tail 20 "$CID" 2>&1 | tail -25
            echo "  CURL LOCAL port $PSB_PORT_HOST:"
            curl -sv --max-time 15 http://127.0.0.1:${PSB_PORT_HOST}/ 2>&1 | tail -15 || true
            echo "[5.5] RESTART PROXY + WAIT 50s"
            PRX=$(docker ps -aq --format "{{.Names}}" | grep -iE coolify-proxy | head -1)
            [ -n "$PRX" ] && docker restart "$PRX" >/dev/null 2>&1
            sleep 50
            echo "[5.6] CHECK 2 DOMAINS WEB PSB VIA TRAEFIK LOCAL"
            OKC=0; TOT=0
            check() {
              TOT=$((TOT+1))
              code=$(curl -s -o /dev/null -w "%{http_code}" --resolve $1:80:127.0.0.1 --max-time 15 http://$1/ 2>/dev/null)
              code="${code:-000}"
