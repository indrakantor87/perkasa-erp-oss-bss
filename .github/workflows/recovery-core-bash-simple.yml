name: "RUN28 DIAGNOSTIC READ-ONLY: WebPSB Login Internal Server Error"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag_r25:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: "0. Install SSH Key STANDARD SAFE"
        run: |
          USER="${{ secrets.COOLIFY_SERVER_USER }}"; USER="${USER:-root}"
          KEY="${{ secrets.COOLIFY_SERVER_SSH_PRIVATE_KEY }}"
          HOST="${{ secrets.COOLIFY_SERVER_HOST }}"
          mkdir -p $HOME/.ssh; chmod 700 $HOME/.ssh
          K=$HOME/.ssh/id_rsa_r25
          install -m 600 /dev/null $K
          printf '%s\n' "$KEY" > $K
          chmod 600 $K
          echo "KEY=$K" >> $GITHUB_ENV
          echo "USER=$USER" >> $GITHUB_ENV
          echo "HOST=$HOST" >> $GITHUB_ENV

      - name: "RUN28: Read-only WebPSB login diagnostic"
        id: diag_fix
        continue-on-error: true
        run: |
          set +e
          K=${{ env.KEY }}
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $K"
          OUT=$(ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" '
            set +e
            D=webpsb.perkasa.net.id
            PRX=$(docker ps --filter "ancestor=traefik:v3.6" --format "{{.ID}}" 2>/dev/null | head -1); PRX=${PRX:-NONE}
            PSB_IDS=$(docker ps --filter "ancestor=local-web-psb:6f3e12e" --format "{{.ID}}" 2>/dev/null | tr "\n" " " | sed "s/[[:space:]]\+$//"); PSB_IDS=${PSB_IDS:-NONE}
            PSB1=$(printf "%s\n" "$PSB_IDS" | awk "{print \$1}"); PSB1=${PSB1:-NONE}
            NOW=$(date -u +%FT%TZ 2>/dev/null); NOW=${NOW:-unknown}; echo "R28_TS: $NOW"

            if [ "$PRX" = "NONE" ]; then
              echo "R28_TRAEFIK: NOT_FOUND"
            else
              TIMG=$(docker inspect -f "{{.Config.Image}}" "$PRX" 2>/dev/null)
              TST=$(docker inspect -f "{{.State.Status}}" "$PRX" 2>/dev/null)
              echo "R28_TRAEFIK: FOUND id=$PRX img=${TIMG:-unknown} st=${TST:-unknown}"
              CMD=$( (docker inspect -f "{{range .Args}}{{println .}}{{end}}" "$PRX" 2>/dev/null; docker inspect -f "{{range .Config.Cmd}}{{println .}}{{end}}" "$PRX" 2>/dev/null) | sed "/^$/d" )
              EPS=$(printf "%s\n" "$CMD" | grep -E "^\-\-entrypoints\." 2>/dev/null | sed -E "s/^--entrypoints\.([^.]+)\..*$/\1/" | sort -u | tr "\n" " " | sed "s/[[:space:]]\+$//")
              [ -z "$EPS" ] && EPS="UNKNOWN"
              echo "R28_ENTRYPOINTS: $EPS"
              RES=$(printf "%s\n" "$CMD" | grep -E "^\-\-certificatesresolvers\." 2>/dev/null | sed -E "s/^--certificatesresolvers\.([^.]+)\..*$/\1/" | sort -u | tr "\n" " " | sed "s/[[:space:]]\+$//")
              [ -z "$RES" ] && RES="NONE"
              echo "R28_TLS_RESOLVERS: $RES"
              P_DOCK=$(printf "%s\n" "$CMD" | grep -E "^\-\-providers\.docker(=|$)" 2>/dev/null | head -1 | sed "s/^--providers\.docker=//")
              P_FILE=$(printf "%s\n" "$CMD" | grep -E "^\-\-providers\.file(=|$)" 2>/dev/null | head -1 | sed "s/^--providers\.file=//")
              P_DIR=$(printf "%s\n" "$CMD" | grep -E "^\-\-providers\.file\.directory=" 2>/dev/null | head -1 | sed "s/^--providers\.file\.directory=//")
              [ -z "$P_DOCK" ] && P_DOCK="UNKNOWN"
              [ -z "$P_FILE" ] && P_FILE="UNKNOWN"
              [ -z "$P_DIR" ] && P_DIR="UNKNOWN"
              echo "R28_PROVIDERS: docker=$P_DOCK file=$P_FILE dir=$P_DIR"
            fi

            if [ "$PSB_IDS" = "NONE" ] || [ "$PSB1" = "NONE" ]; then
              echo "R28_PSB: NOT_FOUND"
            else
              CNT=$(printf "%s\n" "$PSB_IDS" | wc -w | tr -d " "); echo "R28_PSB: FOUND count=$CNT ids=${PSB_IDS:0:80}"
              PSB_META=$(docker ps --filter "ancestor=local-web-psb:6f3e12e" --format "{{.ID}} {{.Names}}" 2>/dev/null | tr "\n" " " | sed "s/[[:space:]]\\+$//")
              [ -z "$PSB_META" ] && PSB_META="UNKNOWN"
              echo "R28_PSB_NAMES: ${PSB_META:0:220}"
              MATRIX=""
              BEST="$PSB1"
              for id in $PSB_IDS; do
                nm=$(docker ps --filter "id=$id" --format "{{.Names}}" 2>/dev/null | head -1)
                [ -z "$nm" ] && nm="${id:0:12}"
                env=$(docker inspect -f "{{range .Config.Env}}{{println .}}{{end}}" "$id" 2>/dev/null)
                dbk=NO; printf "%s\n" "$env" | grep -q "^DATABASE_URL=" >/dev/null 2>&1 && dbk=YES
                ask=NO; { printf "%s\n" "$env" | grep -q "^AUTH_SECRET=" >/dev/null 2>&1 || printf "%s\n" "$env" | grep -q "^NEXTAUTH_SECRET=" >/dev/null 2>&1; } && ask=YES
                [ "$dbk" = "YES" ] && BEST="$id"
                MATRIX="${MATRIX}${id:0:12}:${nm}:DB=${dbk}:AUTH=${ask} | "
              done
              echo "R28_PSB_MATRIX: ${MATRIX:0:900}"
              PSB1="$BEST"
              C_STATUS=$(docker inspect -f "{{.State.Status}}" "$PSB1" 2>/dev/null)
              C_HEALTH=$(docker inspect -f "{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}" "$PSB1" 2>/dev/null)
              C_RESTART=$(docker inspect -f "{{.RestartCount}}" "$PSB1" 2>/dev/null)
              C_EXIT=$(docker inspect -f "{{.State.ExitCode}}" "$PSB1" 2>/dev/null)
              C_START=$(docker inspect -f "{{.State.StartedAt}}" "$PSB1" 2>/dev/null | head -c 19)
              echo "R28_CONTAINER: status=${C_STATUS:-unknown} health=${C_HEALTH:-none} restarts=${C_RESTART:-0} exit=${C_EXIT:-0} started=${C_START:-unknown}"
              ENV=$(docker inspect -f "{{range .Config.Env}}{{println .}}{{end}}" "$PSB1" 2>/dev/null)
              DBK=NO; printf "%s\n" "$ENV" | grep -q "^DATABASE_URL=" >/dev/null 2>&1 && DBK=YES
              NUS=NO; printf "%s\n" "$ENV" | grep -q "^NEXTAUTH_SECRET=" >/dev/null 2>&1 && NUS=YES
              NUU=NO; printf "%s\n" "$ENV" | grep -q "^NEXTAUTH_URL=" >/dev/null 2>&1 && NUU=YES
              AUS=NO; printf "%s\n" "$ENV" | grep -q "^AUTH_SECRET=" >/dev/null 2>&1 && AUS=YES
              AUU=NO; printf "%s\n" "$ENV" | grep -q "^AUTH_URL=" >/dev/null 2>&1 && AUU=YES
              echo "R28_AUTH_KEYS: DATABASE_URL=$DBK NEXTAUTH_SECRET=$NUS NEXTAUTH_URL=$NUU AUTH_SECRET=$AUS AUTH_URL=$AUU"
            fi

            PORT=$(docker image inspect local-web-psb:6f3e12e 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin)[0]; ports=(d.get(\"Config\") or {}).get(\"ExposedPorts\") or {}; c=[k.split(\"/\",1)[0] for k in ports.keys() if k.split(\"/\",1)[0].isdigit()]; print(c[0] if c else \"3000\")" 2>/dev/null | head -1)
            PORT=${PORT:-3000}
            echo "R28_PORT: $PORT"

            if [ "$PRX" != "NONE" ] && [ "$PSB1" != "NONE" ]; then
              PRX_NETS=$(docker inspect -f "{{range \$k, \$v := .NetworkSettings.Networks}}{{println \$k}}{{end}}" "$PRX" 2>/dev/null | tr "\n" " " | sed "s/[[:space:]]\+$//")
              PSB_NETS=$(docker inspect -f "{{range \$k, \$v := .NetworkSettings.Networks}}{{println \$k}}{{end}}" "$PSB1" 2>/dev/null | tr "\n" " " | sed "s/[[:space:]]\+$//")
              COMMON="NO"; CNET="NONE"
              for n in $PRX_NETS; do
                printf "%s\n" "$PSB_NETS" | grep -w "$n" >/dev/null 2>&1 && COMMON="YES" && CNET="$n" && break
              done
              echo "R28_NETWORK_COMMON: $COMMON name=$CNET"
            else
              echo "R28_NETWORK_COMMON: UNKNOWN name=NONE"
            fi

            DYN=/data/coolify/proxy/dynamic
            if [ -d "$DYN" ]; then
              FC=$(find "$DYN" -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d " ")
              FN=$(ls -1 "$DYN" 2>/dev/null | head -5 | tr "\n" " " | sed "s/[[:space:]]\+$//")
              [ -z "$FN" ] && FN="(empty)"
              echo "R28_DYNAMIC_DIR: YES files=$FC sample=$FN"
            else
              echo "R28_DYNAMIC_DIR: NO path=$DYN"
            fi

            APP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 "http://127.0.0.1:$PORT/login" 2>/dev/null)
            echo "R28_APP_LOCAL: /login code=${APP:-000} port=$PORT"

            DBR="UNKNOWN"
            if [ "$PSB1" != "NONE" ]; then
              HAS_NODE=$(docker exec "$PSB1" node -v >/dev/null 2>&1; echo $?)
              if [ "$HAS_NODE" = "0" ]; then
                DBR=$(docker exec "$PSB1" node -e "const u=process.env.DATABASE_URL||\"\"; if(!u){console.log(\"DB_URL_MISSING\"); process.exit(0);} const m=u.match(/^(\\w+):\\/\\/([^@]+@)?([^:\\/]+)(:(\\d+))?/); if(!m){console.log(\"DB_URL_PARSE_FAIL\"); process.exit(0);} const scheme=m[1]; const host=m[3]; const port=m[5] || ((scheme===\"postgres\"||scheme===\"postgresql\")?\"5432\":(scheme===\"mysql\")?\"3306\":\"\"); if(!port){console.log(\"DB_PORT_UNKNOWN\"); process.exit(0);} const net=require(\"net\"); const s=net.connect({host:host,port:Number(port),timeout:3000},()=>{console.log(\"DB_TCP_OK host=\"+host+\" port=\"+port); s.end();}); s.on(\"timeout\",()=>{console.log(\"DB_TCP_TIMEOUT host=\"+host+\" port=\"+port); s.destroy();}); s.on(\"error\",(e)=>{console.log(\"DB_TCP_ERR \"+(e.code||\"UNKNOWN\"));});" 2>/dev/null | tr -d "\r\n" | head -c 140)
              else
                DBR="DB_NODE_MISSING"
              fi
              [ -z "$DBR" ] && DBR="UNKNOWN"
            fi
            echo "R28_DATABASE: $DBR"

            A1=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 12 "https://$D/api/auth/session" 2>/dev/null); [ -z "$A1" ] && A1="000"
            A2=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 12 "https://$D/api/auth/providers" 2>/dev/null); [ -z "$A2" ] && A2="000"
            A3=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 12 "https://$D/api/login" 2>/dev/null); [ -z "$A3" ] && A3="000"
            echo "R28_LOGIN_API: session=$A1 providers=$A2 api_login=$A3"

            LOGX="(no_match)"
            if [ "$PSB1" != "NONE" ]; then
              LOGRAW=$(docker logs --tail 220 "$PSB1" 2>&1 | tr -d "\r")
              LOGF=$(printf "%s\n" "$LOGRAW" | grep -Ei "error|prisma|database|auth|session|econn|500|exception|fatal" 2>/dev/null || true)
              LOGX=$(printf "%s\n" "$LOGF" | tail -n 20 | tr "\n" ";" | head -c 900)
              [ -z "$LOGX" ] && LOGX="(no_match)"
            fi
            echo "R28_APP_LOG: $LOGX"

            echo "R28_NO_CHANGES: YES"
          ' 2>&1)
          RC=$?
          echo "RAW_OUT<<EOF_R25" >> $GITHUB_OUTPUT
          printf '%s\n' "$OUT" >> $GITHUB_OUTPUT
          echo "EOF_R25" >> $GITHUB_OUTPUT
          echo "SSH_RC=$RC" >> $GITHUB_OUTPUT
          echo "--- RAW OUT START RC=$RC ---"
          printf '%s\n' "$OUT"
          echo "--- RAW OUT END ---"

      - name: "RUN28: Summary (annotations)"
        continue-on-error: true
        run: |
          set +eo pipefail
          OUT="${{ steps.diag_fix.outputs.RAW_OUT }}"
          SSH_RC="${{ steps.diag_fix.outputs.SSH_RC }}"
          getv() {
            local key="$1"
            printf '%s\n' "$OUT" | { grep -E "^${key}:" || true; } | head -1 | cut -d: -f2- | sed 's/^[[:space:]]*//; s/[[:space:]]\+$//'
          }

          TS="$(getv R28_TS)"
          TRAEFIK="$(getv R28_TRAEFIK) ep=$(getv R28_ENTRYPOINTS) resolvers=$(getv R28_TLS_RESOLVERS) prov=$(getv R28_PROVIDERS) dyn=$(getv R28_DYNAMIC_DIR)"
          PSB="$(getv R28_PSB) names=$(getv R28_PSB_NAMES)"
          MATRIX="$(getv R28_PSB_MATRIX)"
          CONT="$(getv R28_CONTAINER)"
          NET="$(getv R28_NETWORK_COMMON)"
          PORT="$(getv R28_PORT)"
          APP="$(getv R28_APP_LOCAL)"
          DB="$(getv R28_DATABASE)"
          AUTH="$(getv R28_AUTH_KEYS)"
          API="$(getv R28_LOGIN_API)"
          LOG="$(getv R28_APP_LOG)"
          NC="$(getv R28_NO_CHANGES)"

          for line in \
            "TS: $TS" \
            "TRAEFIK: $TRAEFIK" \
            "PSB: $PSB" \
            "PSB_MATRIX: $MATRIX" \
            "CONTAINER: $CONT" \
            "NETWORK_COMMON: $NET" \
            "PORT: $PORT" \
            "APPLICATION: $APP" \
            "DATABASE: $DB" \
            "AUTH_KEYS: $AUTH" \
            "LOGIN_API: $API" \
            "APP_LOG: $LOG" \
            "NO_CHANGES: $NC SSH_RC=$SSH_RC"; do
            title="$(printf '%s' "$line" | cut -d: -f1 | head -c 60)"
            val="$(printf '%s' "$line" | cut -d: -f2- | sed 's/^[[:space:]]*//' | head -c 900)"
            val_safe="$(printf '%s' "$val" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::notice title=${title}::${val_safe}"
            printf '%s\n' "$line"
          done
