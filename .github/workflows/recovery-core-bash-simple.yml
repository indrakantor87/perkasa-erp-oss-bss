name: "⭐ RECOVERY INTI 1-2-3: Docker Start All Exited + Proxy Restart (Bash Saja)"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  recovery_core:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "0. Precheck & Install SSH Key"
        run: |
          set +e
          HOST="${{ secrets.COOLIFY_SERVER_HOST }}"
          USER="${{ secrets.COOLIFY_SERVER_USER }}"
          USER="${USER:-root}"
          KEY="${{ secrets.COOLIFY_SERVER_SSH_PRIVATE_KEY }}"
          HOST_LEN=$(printf '%s' "$HOST" | wc -c | tr -d ' ')
          KEY_LEN=$(printf '%s' "$KEY" | wc -c | tr -d ' ')
          echo "HOST=$HOST"
          echo "USER=$USER"
          echo "HOST_LEN=$HOST_LEN"
          echo "KEY_LEN=$KEY_LEN"
          if [ "$KEY_LEN" -lt 150 ]; then
            echo "ERROR: SSH PRIVATE KEY KOSONG / terlalu pendek. Isi di Repo Settings > Secrets > Actions"
            exit 1
          fi
          mkdir -p $HOME/.ssh
          chmod 700 $HOME/.ssh
          KEY_FILE=$HOME/.ssh/id_ed25519_coolify
          printf '%s\n' '-----BEGIN OPENSSH PRIVATE KEY-----' > /tmp/hdr.txt
          printf '%s\n' '-----END OPENSSH PRIVATE KEY-----' > /tmp/tlr.txt
          printf '%s' "$KEY" | grep -v 'OPENSSH PRIVATE KEY' | tr -d '\r' > /tmp/body.txt
          (cat /tmp/hdr.txt; cat /tmp/body.txt; cat /tmp/tlr.txt) > $KEY_FILE
          chmod 600 $KEY_FILE
          echo "KEY_FILE=$KEY_FILE" >> $GITHUB_ENV
          echo "USER=$USER" >> $GITHUB_ENV
          echo "HOST=$HOST" >> $GITHUB_ENV
          ssh -V
          echo "OK: SSH key ready"

      - name: "⭐ STEP 1: SSH PREFLIGHT + Lihat Container Sebelum Recovery"
        run: |
          set +e
          KEY=$HOME/.ssh/id_ed25519_coolify
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $KEY"
          OUTPUT=$(ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" '
            set +e
            echo "===== [SERVER UPTIME & DISK] ====="
            uptime
            echo ""
            df -h /
            echo ""
            echo "===== [DOCKER PS -a SEBELUM RECOVERY] ====="
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}" 2>&1 | head -50
            echo ""
            echo "===== [EXITED / CREATED / DEAD containers (akan di-start)] ====="
            docker ps -aq -f status=exited -f status=created -f status=dead 2>&1
            echo ""
            echo "===== [COOLIFY PROXY STATUS] ====="
            docker ps --format "table {{.Names}}\t{{.Status}}" 2>&1 | grep -iE "proxy|traefik"
            echo "PREFLIGHT OK"
          ' 2>&1)
          RC=$?
          echo "$OUTPUT"
          echo ""
          echo "STEP 1 SSH RC=$RC"
          if [ $RC -ne 0 ]; then
            echo ""
            echo "==================== STEP 1 FAIL — LAST 80 LINES OUTPUT ===================="
            printf "%s\n" "$OUTPUT" | tail -80
            echo "============================================================================"
            echo "ERROR: SSH gagal! Periksa secrets COOLIFY_SERVER_HOST / USER / SSH_PRIVATE_KEY."
            exit 1
          fi

      - name: "⭐ STEP 2: HAPUS CONTAINER MANUAL SALAH LABEL (web-psb-perkasa manual single quote) + PASTIKAN NETWORK COOLIFY ADA"
        run: |
          set +e
          KEY=$HOME/.ssh/id_ed25519_coolify
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $KEY"
          OUTPUT=$(ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" '
            set +e
            echo "=== Bersihkan container manual yang labelnya salah (single quote) ==="
            BAD=$(docker ps -aq --format "{{.Names}}" | grep -iE "^web-psb-perkasa$|fallback$" | head -20)
            for C in $BAD; do
              echo "  -> docker rm -f $C"
              docker rm -f $C 2>&1 | head -2
            done
            echo ""
            echo "=== Pastikan network coolify ada ==="
            NET_EXIST=$(docker network ls --format "{{.Name}}" | grep -cE "^coolify$")
            if [ "$NET_EXIST" -eq 0 ]; then
              echo "  buat network coolify"
              docker network create coolify 2>&1 | head -2
            else
              echo "  network coolify sudah ada OK"
            fi
            echo ""
            echo "=== Pastikan coolify-proxy UP ==="
            PRX=$(docker ps -aq --format "{{.Names}}" | grep -iE coolify-proxy | head -1)
            if [ -n "$PRX" ]; then
              PRX_UP=$(docker inspect --format="{{.State.Running}}" "$PRX" 2>/dev/null)
              if [ "$PRX_UP" != "true" ]; then
                echo "  start $PRX"
                docker start "$PRX" 2>&1 | head -2
              else
                echo "  $PRX sudah UP"
              fi
            fi
            echo "STEP 2 OK"
          ' 2>&1)
          RC=$?
          echo "$OUTPUT"
          echo ""
          echo "STEP 2 SSH RC=$RC"
          if [ $RC -ne 0 ]; then
            echo ""
            echo "==================== STEP 2 FAIL — LAST 80 LINES OUTPUT ===================="
            printf "%s\n" "$OUTPUT" | tail -80
            echo "============================================================================"
            echo "WARNING: Step2 non-critical FAIL — LANJUTKAN Step3+ (priority Web PSB)"
          fi

      - name: "⭐ STEP 3: DOCKER START SEMUA EXITED / CREATED / DEAD CONTAINERS (COOLIFY ASLI = LABEL BACKTICK BENAR!) [PALING PENTING]"
        continue-on-error: true
        run: |
          set +e
          KEY=$HOME/.ssh/id_ed25519_coolify
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $KEY"
          OUTPUT=$(ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" '
            set +e
            echo "=== STEP 3: DOCKER START SEMUA EXITED (COOLIFY ASLI LABEL BACKTICK BENAR!) ==="
            LIST=$(docker ps -aq -f status=exited -f status=created -f status=dead 2>/dev/null)
            TOTAL=0; OK=0; FAIL=0; FAIL_LIST=""
            for C in $LIST; do
              NAME=$(docker inspect --format="{{.Name}}" "$C" 2>/dev/null | sed s#/##)
              case "$NAME" in *coolify-helper*) TOTAL=$((TOTAL+1)); continue ;; esac
              TOTAL=$((TOTAL+1))
              docker start "$C" >/dev/null 2>&1
              RC=$?
              sleep 1
              if [ $RC -eq 0 ]; then
                UP=$(docker inspect --format="{{.State.Running}}" "$C" 2>/dev/null)
                if [ "$UP" = "true" ]; then OK=$((OK+1)); else FAIL=$((FAIL+1)); FAIL_LIST="$FAIL_LIST $NAME"; fi
              else
                FAIL=$((FAIL+1)); FAIL_LIST="$FAIL_LIST $NAME"
              fi
            done
            echo "RINGKASAN: TOTAL=$TOTAL | OK=$OK | FAIL=$FAIL"
            [ -n "$FAIL_LIST" ] && echo "CONTAINER YANG FAIL (skip non-critical): $FAIL_LIST"
            echo "=== DOCKER PS UP ==="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" 2>&1 | head -30
            echo "STEP 3 OK (fail=$FAIL non-critical, TIDAK HENTIKAN Step5/6 Web PSB P1)"
          ' 2>&1)
          RC=$?
          echo "$OUTPUT"
          echo ""
          echo "STEP 3 SSH RC=$RC"
          if [ $RC -ne 0 ]; then
            echo ""
            echo "==================== STEP 3 FAIL — LAST 80 LINES OUTPUT ===================="
            printf "%s\n" "$OUTPUT" | tail -80
            echo "============================================================================"
            echo "WARNING: Step3 non-critical FAIL — LANJUTKAN Step4/5/6 (PRIORITAS Web PSB P1!)"
          fi

      - name: "⭐ STEP 4: RESTART COOLIFY-PROXY (Traefik) AGAR RELOAD DYNAMIC CONFIG + WAIT 45s"
        continue-on-error: true
        run: |
          set +e
          KEY=$HOME/.ssh/id_ed25519_coolify
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $KEY"
          OUTPUT=$(ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" '
            set +e
            echo "=== STEP 4: RESTART COOLIFY-PROXY + WAIT 45s ==="
            PRX=$(docker ps -aq --format "{{.Names}}" | grep -iE coolify-proxy | head -1)
            [ -n "$PRX" ] && docker restart "$PRX" 2>&1 | head -2
            sleep 45
            echo "=== Final container list UP ==="
            docker ps --format "table {{.Names}}\t{{.Status}}" 2>&1 | head -30
            echo "STEP 4 OK"
          ' 2>&1)
          RC=$?
          echo "$OUTPUT"
          echo ""
          echo "STEP 4 SSH RC=$RC"
          if [ $RC -ne 0 ]; then
            echo ""
            echo "==================== STEP 4 FAIL — LAST 80 LINES OUTPUT ===================="
            printf "%s\n" "$OUTPUT" | tail -80
            echo "============================================================================"
            echo "WARNING: Step4 non-critical FAIL — LANJUTKAN Step5/6 (PRIORITAS Web PSB P1!)"
          fi

      - name: "⭐ STEP 5: WEB PSB CUSTOM DOMAIN (PRIORITAS #1) - Docker run EXPLICIT 2 LABEL HOST (CUSTOM + SSLIP) dengan BACKTICK printf hex \\x60 100% BENAR"
        timeout-minutes: 8
        run: |
          set +e
          KEY=$HOME/.ssh/id_ed25519_coolify
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $KEY"
          OUTPUT=$(ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" '
            set +e
            echo "=== STEP 5: WEB PSB CUSTOM DOMAIN (PRIORITAS #1) - 2 LABEL HOST BACKTICK printf hex 0x60 ==="
            BT=$(printf "\x60")
            echo "[5.2] HAPUS CONTAINER PSB LAMA (label salah)"
            OLD_LIST=$(docker ps -aq --format "{{.Names}}" | grep -iE "web.psb|webpsb|psb|ultrafast|fallback|recoverycore")
            [ -n "$OLD_LIST" ] && for C in $OLD_LIST; do docker rm -f $C >/dev/null 2>&1; done
            echo "[5.3] CARI & VERIFIKASI IMAGE WEB PSB"
            docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}\t{{.ID}}" 2>&1 | grep -iE "psb|perkasa|web" | head -15
            IMG_PSB=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -iE "local-web-psb" | head -1)
            [ -z "$IMG_PSB" ] && IMG_PSB=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -iE "web-psb-perkasa|webpsb" | head -1)
            [ -z "$IMG_PSB" ] && IMG_PSB="ghcr.io/indrakantor87/web-psb-perkasa:latest"
            echo "  Image terpilih: $IMG_PSB"
            docker image inspect "$IMG_PSB" > /dev/null 2>&1
            RC_IMG=$?
            if [ $RC_IMG -ne 0 ]; then
              echo "FAIL_FAST_REASON=IMAGE_NOT_FOUND|IMAGE=$IMG_PSB|RC=$RC_IMG"
              echo "  LIST IMAGES (30 teratas):"
              docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}\t{{.ID}}" 2>&1 | head -30
              exit 1
            fi
            echo "  ✅ Image OK"
            echo "[5.4] DOCKER RUN 2 LABEL HOST (Custom + SSLIP)"
            NAME="webpsb-recoverycore-customdomain"
            SSLIP_DOM="pic3vleasj465ooh77ioicw6.103.162.17.178.sslip.io"
            CUSTOM_DOM="webpsb.perkasa.net.id"
            L_RULE_SSLIP="traefik.http.routers.wpssl.rule=Host(${BT}${SSLIP_DOM}${BT})"
            L_RULE_CUSTOM="traefik.http.routers.wpnetid.rule=Host(${BT}${CUSTOM_DOM}${BT})"
            echo "  Rule SSLIP : $L_RULE_SSLIP"
            echo "  Rule Custom: $L_RULE_CUSTOM"
            PSB_PORT_HOST=3005
            PORT_USED=$(netstat -tln 2>/dev/null | grep -c ":$PSB_PORT_HOST " || true)
            if [ "$PORT_USED" -gt 0 ]; then
              PSB_PORT_HOST=3006
              PORT_USED2=$(netstat -tln 2>/dev/null | grep -c ":$PSB_PORT_HOST " || true)
              if [ "$PORT_USED2" -gt 0 ]; then
                echo "FAIL_FAST_REASON=PORT_CONFLICT|PORT3005_USED=$PORT_USED|PORT3006_USED=$PORT_USED2"
                netstat -tln 2>/dev/null | head -20
                exit 1
              fi
            fi
            echo "  Port: $PSB_PORT_HOST:3000"
            docker rm -f "$NAME" 2>/dev/null || true
            sleep 1
            docker run -d --name "$NAME" --network coolify --restart unless-stopped -p ${PSB_PORT_HOST}:3000 -e PORT=3000 -e HOSTNAME=0.0.0.0 -e NODE_ENV=production -l "traefik.enable=true" -l "traefik.http.routers.wpssl.entryPoints=http" -l "$L_RULE_SSLIP" -l "traefik.http.services.wpssl.loadbalancer.server.port=3000" -l "traefik.http.routers.wpnetid.entryPoints=http" -l "$L_RULE_CUSTOM" -l "traefik.http.services.wpnetid.loadbalancer.server.port=3000" "$IMG_PSB" > /tmp/psb_cid.txt 2> /tmp/psb_err.txt
            RC=$?
            CID=$(cat /tmp/psb_cid.txt 2>/dev/null | head -1 | tr -d "\r\n")
            ERR=$(cat /tmp/psb_err.txt 2>/dev/null | tail -15 | tr -d "\r")
            if [ $RC -ne 0 ] || [ -z "$CID" ]; then
              echo "FAIL_FAST_REASON=DOCKER_RUN_FAILED|RC=$RC|CID=[$CID]"
              echo "STDERR docker run (15 lines):"
              printf "%s\n" "$ERR"
              echo "LIST CONTAINER psb related:"
              docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Ports}}" 2>&1 | grep -iE "web.psb|webpsb|psb|ultrafast|fallback|recoverycore"
              exit 1
            fi
            echo "  ✅ Docker run OK CID=${CID:0:20} | Custom: https://$CUSTOM_DOM | SSLIP: http://$SSLIP_DOM"
            echo "  [5.4.1] DIAGNOSTIC AFTER RUN"
            sleep 5
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" 2>&1 | grep -iE "web.psb|webpsb|psb|proxy"
            echo "  Status=$(docker inspect --format="{{.State.Status}}" "$CID" 2>/dev/null) Running=$(docker inspect --format="{{.State.Running}}" "$CID" 2>/dev/null) Exit=$(docker inspect --format="{{.State.ExitCode}}" "$CID" 2>/dev/null)"
            echo "  LABELS traefik/name:"
            docker inspect "$CID" 2>/dev/null | grep -iE "traefik|name|maintainer" | head -20
            echo "  LOGS last 20:"
            docker logs --tail 20 "$CID" 2>&1 | tail -25
            echo "  CURL LOCAL port $PSB_PORT_HOST:"
            curl -sv --max-time 15 http://127.0.0.1:${PSB_PORT_HOST}/ 2>&1 | tail -15 || true
            echo "[5.5] RESTART PROXY + WAIT 50s"
            PRX=$(docker ps -aq --format "{{.Names}}" | grep -iE coolify-proxy | head -1)
            [ -n "$PRX" ] && docker restart "$PRX" >/dev/null 2>&1
            sleep 50
            echo "[5.6] CHECK 2 DOMAINS WEB PSB VIA TRAEFIK LOCAL"
            OKC=0; TOT=0
            check() {
              TOT=$((TOT+1))
              code=$(curl -s -o /dev/null -w "%{http_code}" --resolve $1:80:127.0.0.1 --max-time 15 http://$1/ 2>/dev/null)
              code="${code:-000}"
              case "$code" in 200|301|302|307|308) echo "    ✅ [HTTP $code] $2 => $1"; OKC=$((OKC+1)) ;; *) echo "    ❌ [HTTP $code] $2 => $1" ;; esac
            }
            check "webpsb.perkasa.net.id" "WEB PSB CUSTOM [P1]"
            check "pic3vleasj465ooh77ioicw6.103.162.17.178.sslip.io" "WEB PSB SSLIP [P2]"
            echo "  STEP5 HASIL: $OKC / $TOT"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" 2>&1 | grep -iE "web.psb|webpsb|psb|proxy"
            echo "STEP 5 OK"
          ' 2>&1)
          RC=$?
          echo "$OUTPUT"
          echo ""
          echo "STEP 5 SSH RC=$RC"
          if [ $RC -ne 0 ]; then
            echo ""
            echo "==================== STEP 5 FAIL — LAST 80 LINES OUTPUT ===================="
            printf "%s\n" "$OUTPUT" | tail -80
            echo "=============================================================================="
            echo "❌❌❌ STEP5 FAIL RC=$RC! FAIL FAST BEKERJA. Workflow status MERAH JELAS (bukan hijau palsu RUN6)."
            exit 1
          fi
          echo "✅ STEP 5 SSH SUCCESS RC=$RC. Lanjut Step6 Final Check 6 domains"

      - name: "⭐ STEP 6: FINAL HTTP CHECK 6 DOMAINS VIA TRAEFIK (curl --resolve ke 127.0.0.1:80)"
        run: |
          set +e
          KEY=$HOME/.ssh/id_ed25519_coolify
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $KEY"
          RESULT=$(ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" '
            set +e
            echo "=== STEP 6: FINAL CHECK 6 DOMAINS VIA TRAEFIK LOCAL ==="
            D1=webpsb.perkasa.net.id
            D2=b8qxcx7nu5nfvcygs1gg1fyt.103.162.17.178.sslip.io
            D3=uw0gsooko48kwgwogk8wc8gs.103.162.17.178.sslip.io
            D4=h4ow4sw0k04ksgsgskcwoow8.103.162.17.178.sslip.io
            D5=ikgc8kkwcc08kkgkskc0gwg4.103.162.17.178.sslip.io
            D6=pic3vleasj465ooh77ioicw6.103.162.17.178.sslip.io
            OKC=0; TOT=0
            check() {
              TOT=$((TOT+1))
              code=$(curl -s -o /dev/null -w "%{http_code}" --resolve $1:80:127.0.0.1 --max-time 15 http://$1/ 2>/dev/null)
              code="${code:-000}"
              case "$code" in 200|301|302|307|308) echo "  ✅ [$code] $2 => $1"; OKC=$((OKC+1)) ;; *) echo "  ❌ [$code] $2 => $1" ;; esac
            }
            check $D1 "WEB PSB CUSTOM [P1]"
            check $D2 "ERP OSS BSS"
            check $D3 "LANDING"
            check $D4 "FINANCE"
            check $D5 "GA WEB"
            check $D6 "WEB PSB SSLIP [P6]"
            echo "HASIL: $OKC / $TOT HTTP 200/30x"
            CUSTOM_CODE=$(curl -s -o /dev/null -w "%{http_code}" --resolve $D1:80:127.0.0.1 --max-time 20 http://$D1/ 2>/dev/null)
            CUSTOM_CODE="${CUSTOM_CODE:-000}"
            SSLIP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --resolve $D6:80:127.0.0.1 --max-time 20 http://$D6/ 2>/dev/null)
            SSLIP_CODE="${SSLIP_CODE:-000}"
            echo "  Web PSB CUSTOM => HTTP $CUSTOM_CODE"
            echo "  Web PSB SSLIP  => HTTP $SSLIP_CODE"
            WEBPSB_REQ_OK=0
            case "$CUSTOM_CODE" in 200|301|302|307|308) WEBPSB_REQ_OK=$((WEBPSB_REQ_OK+1)) ;; esac
            case "$SSLIP_CODE" in 200|301|302|307|308) WEBPSB_REQ_OK=$((WEBPSB_REQ_OK+1)) ;; esac
            if [ "$WEBPSB_REQ_OK" -ne 2 ]; then
              echo "FAIL_FAST_REASON=WEB_PSB_HTTP_FAIL|CUSTOM=$CUSTOM_CODE|SSLIP=$SSLIP_CODE|OK=$WEBPSB_REQ_OK/2"
              echo "--- DIAGNOSTIC: docker ps webpsb / proxy ---"
              docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}" 2>&1 | grep -iE "web.psb|webpsb|psb|proxy|coolify-proxy"
              PRX=$(docker ps -aq --format "{{.Names}}" | grep -iE coolify-proxy | head -1)
              [ -n "$PRX" ] && echo "--- PROXY last 25 logs ---" && docker logs --tail 25 "$PRX" 2>&1 | tail -30
              echo "--- CONTAINER PSB last 20 logs ---"
              PSB_LIST=$(docker ps -aq --format "{{.Names}}" 2>&1 | grep -iE "web.psb|webpsb|psb|ultrafast|fallback|recoverycore" | head -10)
              for C in $PSB_LIST; do echo "  == $C =="; docker logs --tail 20 "$C" 2>&1 | tail -25; done
              exit 1
            fi
            echo "✅ DUA DOMAIN WEB PSB HIDUP! CUSTOM=$CUSTOM_CODE SSLIP=$SSLIP_CODE"
            echo "EXIT 0 OK."
          ' 2>&1)
          RC=$?
          echo "$RESULT"
          echo ""
          echo "STEP 6 SSH RC=$RC"
          if [ $RC -ne 0 ]; then
            echo ""
            echo "==================== STEP 6 FAIL — LAST 80 LINES OUTPUT ===================="
            printf "%s\n" "$RESULT" | tail -80
            echo "=============================================================================="
            echo "❌❌❌ STEP6 FAIL RC=$RC! Workflow status MERAH JELAS (bukan hijau palsu RUN6)."
            exit 1
          fi
          echo "✅ STEP 6 SUCCESS RC=$RC (Web PSB Custom + SSLIP KEDUANYA OK!)"
          echo ""
          echo "=== FLOW RECOVERY SELESAI, SEMUA CHECK OK ==="
          echo "Buka https://webpsb.perkasa.net.id -> Ctrl+Shift+R (Hard Refresh ignore cache) untuk pastikan halaman login tampil, BUKAN 'no available server'!"
