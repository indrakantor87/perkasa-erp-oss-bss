name: "RUN18 DIAGNOSTIC: EntryPoints proxy ASLI + HTTP code redirect (SUPER KECIL anti truncate)"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag_run18:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "0. Install SSH Key"
        run: |
          set +e
          HOST="${{ secrets.COOLIFY_SERVER_HOST }}"
          USER="${{ secrets.COOLIFY_SERVER_USER }}"
          USER="${USER:-root}"
          KEY="${{ secrets.COOLIFY_SERVER_SSH_PRIVATE_KEY }}"
          mkdir -p $HOME/.ssh
          chmod 700 $HOME/.ssh
          KEY_FILE=$HOME/.ssh/id_ed25519_coolify
          printf '%s\n' '-----BEGIN OPENSSH PRIVATE KEY-----' > /tmp/hdr.txt
          printf '%s\n' '-----END OPENSSH PRIVATE KEY-----' > /tmp/tlr.txt
          printf '%s' "$KEY" | grep -v 'OPENSSH PRIVATE KEY' | tr -d '\r' > /tmp/body.txt
          (cat /tmp/hdr.txt; cat /tmp/body.txt; cat /tmp/tlr.txt) > $KEY_FILE
          chmod 600 $KEY_FILE
          echo "KEY_FILE=$KEY_FILE" >> $GITHUB_ENV
          echo "USER=$USER" >> $GITHUB_ENV
          echo "HOST=$HOST" >> $GITHUB_ENV

      - name: "RUN18 Step A: coolify-proxy ENTRYPOINTS ASLI (labels + args)"
        run: |
          set +e
          KEY=$HOME/.ssh/id_ed25519_coolify
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $KEY"
          OUT=$(ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" '
            set +e
            PRX=$(docker ps -aq --format "{{.Names}}" 2>/dev/null | grep -iE coolify-proxy | head -1)
            [ -z "$PRX" ] && echo "NO_PROXY" && exit 0
            echo "=== PROXY NAME: $PRX ==="
            echo "--- proxy All labels (key=value): ---"
            docker inspect "$PRX" 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);lbls=d[0].get(\"Config\",{}).get(\"Labels\",{});[print(f\"  {k}={v}\") for k,v in sorted(lbls.items())]" 2>/dev/null || echo "(python3 not avail fallback grep)"
            docker inspect "$PRX" 2>/dev/null | grep -iE "entrypoint|address|web|http|80|443" | head -30
            echo "--- proxy ARGS (traefik startup flags): ---"
            docker inspect "$PRX" 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);[print(f\"  ARG: {a}\") for a in d[0].get(\"Args\",[])]" 2>/dev/null
            echo "--- proxy CMD: ---"
            docker inspect "$PRX" 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);print(d[0].get(\"Config\",{}).get(\"Cmd\",[]))" 2>/dev/null
          ' 2>&1)
          echo "$OUT"
          echo "RC=$?"

      - name: "RUN18 Step B: HTTP code webpsb.perkasa.net.id LOCAL vs EKSTERNAL (redirect HTTPS?)"
        run: |
          set +e
          KEY=$HOME/.ssh/id_ed25519_coolify
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $KEY"
          OUT=$(ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" '
            set +e
            D=webpsb.perkasa.net.id
            echo "=== B1: CURL LOCAL resolve 127.0.0.1 HTTP ==="
            curl -sL --max-time 12 -D /tmp/h_local.txt --resolve $D:80:127.0.0.1 -o /dev/null http://$D/ 2>&1
            echo "HEADERS LOCAL (HTTP 80 ->127):"
            head -20 /tmp/h_local.txt 2>/dev/null
            echo "=== B2: CURL LOCAL resolve 127.0.0.1 HTTPS (skip verify) ==="
            curl -skL --max-time 12 -D /tmp/h_local_https.txt --resolve $D:443:127.0.0.1 -o /dev/null https://$D/ 2>&1
            echo "HEADERS LOCAL (HTTPS 443 ->127):"
            head -20 /tmp/h_local_https.txt 2>/dev/null
            echo "=== B3: CURL EKSTERNAL via PUBLIC IP (http://$D) ==="
            curl -sL --max-time 15 -D /tmp/h_pub_http.txt -o /tmp/b_pub_http.txt http://$D/ 2>&1 | head -5
            echo "HEADERS PUBLIC HTTP:"
            head -20 /tmp/h_pub_http.txt 2>/dev/null
            echo "BODY PUBLIC HTTP first 500 chars:"
            cut -c1-500 /tmp/b_pub_http.txt 2>/dev/null
            echo ""
            echo "=== B4: CURL EKSTERNAL via PUBLIC IP (https://$D) ==="
            curl -skL --max-time 15 -D /tmp/h_pub_https.txt -o /tmp/b_pub_https.txt https://$D/ 2>&1 | head -5
            echo "HEADERS PUBLIC HTTPS:"
            head -20 /tmp/h_pub_https.txt 2>/dev/null
            echo "BODY PUBLIC HTTPS first 500 chars:"
            cut -c1-500 /tmp/b_pub_https.txt 2>/dev/null
            echo ""
          ' 2>&1)
          echo "$OUT"
          echo "RC=$?"

      - name: "RUN18 Step C: DNS webpsb.perkasa.net.id + container rec17 labels"
        run: |
          set +e
          KEY=$HOME/.ssh/id_ed25519_coolify
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $KEY"
          OUT=$(ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" '
            set +e
            D=webpsb.perkasa.net.id
            echo "=== C1: DNS resolve $D ==="
            if command -v dig >/dev/null 2>&1; then dig +short $D | head -5
            elif command -v nslookup >/dev/null 2>&1; then nslookup $D 2>&1 | tail -10
            elif command -v getent >/dev/null 2>&1; then getent hosts $D
            else ping -c1 -W2 $D 2>&1 | head -3; fi
            echo "=== C2: REC17 container list ==="
            docker ps -a --format "{{.Names}} {{.Status}}" 2>/dev/null | grep -iE rec17
            echo "=== C3: REC17 labels traefik ==="
            CID=$(docker ps -aq --format "{{.Names}}" 2>/dev/null | grep -iE rec17-webpsb | head -1)
            if [ -n "$CID" ]; then
              echo "Container: $CID"
              docker inspect "$CID" 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);lbls=d[0].get(\"Config\",{}).get(\"Labels\",{});[print(f\"  {k}={v}\") for k,v in sorted(lbls.items()) if \"traefik\" in k.lower()]" 2>/dev/null
              echo "NetworkMode:"
              docker inspect -f "{{.HostConfig.NetworkMode}}" "$CID" 2>/dev/null
              echo "coolify network IP:"
              docker inspect -f "{{.NetworkSettings.Networks.coolify.IPAddress}}" "$CID" 2>/dev/null
            fi
          ' 2>&1)
          echo "$OUT"
          echo "RC=$?"
