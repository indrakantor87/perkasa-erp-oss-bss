name: "RUN22 DIAG LUAS: List ALL Container TANPA grep (cari nama proxy + PSB hilang)"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag_r22:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: "0. Install SSH Key STANDARD SAFE"
        run: |
          USER="${{ secrets.COOLIFY_SERVER_USER }}"; USER="${USER:-root}"
          KEY="${{ secrets.COOLIFY_SERVER_SSH_PRIVATE_KEY }}"
          HOST="${{ secrets.COOLIFY_SERVER_HOST }}"
          mkdir -p $HOME/.ssh; chmod 700 $HOME/.ssh
          K=$HOME/.ssh/id_rsa_r22
          install -m 600 /dev/null $K
          printf '%s\n' "$KEY" > $K
          chmod 600 $K
          echo "KEY=$K" >> $GITHUB_ENV
          echo "USER=$USER" >> $GITHUB_ENV
          echo "HOST=$HOST" >> $GITHUB_ENV

      - name: "R22: ALL DIAG LUAS server-side → RAW LINES prefix R22_"
        id: diag
        continue-on-error: true
        run: |
          K=${{ env.KEY }}
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $K"
          OUT=$(ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" '
            set +e
            echo "R22_DOCKER_PS_ALL: START"
            N=0
            docker ps -aq --format "{{.Names}}" 2>/dev/null | while read CNAME; do
              N=$((N+1)); if [ $N -le 25 ]; then
                IMG=$(docker inspect --format="{{.Config.Image}}" $CNAME 2>/dev/null | head -c 80)
                ST=$(docker inspect --format="{{.State.Status}}" $CNAME 2>/dev/null)
                echo "R22_C_${N}: NAME=$CNAME STATUS=$ST IMG=$IMG"
              fi
            done
            N=0
            for NET in coolify bridge host none; do
              EXISTS=$(docker network ls --format "{{.Name}}" 2>/dev/null | grep -cx "$NET")
              echo "R22_NET_${NET^^}: EXISTS=$EXISTS"
            done
            echo "R22_IMG_WEBPSB: $(docker images --format "{{.Repository}}:{{.Tag}} {{.Size}}" 2>/dev/null | grep -iE "local-webpsb|webpsb|web-psb" | head -3)"
            echo "R22_IMG_PROXY: $(docker images --format "{{.Repository}}:{{.Tag}} {{.Size}}" 2>/dev/null | grep -iE "traefik|coolify-proxy|proxy" | head -5)"
            N=0
            for CNAME in $(docker ps -aq --format "{{.Names}}" 2>/dev/null | grep -iE "proxy|traefik|coolify" | head -3); do
              N=$((N+1))
              echo "R22_PRX_CANDIDATE_${N}: $CNAME"
              for A in $(docker inspect $CNAME 2>/dev/null | python3 -c "import sys,json;[print(a) for a in json.load(sys.stdin)[0].get(\"Args\",[])]" 2>/dev/null | grep -iE "entrypoint|address|:80|:443|http|web"); do
                echo "R22_PRX${N}_ARG: $A"
              done | head -10
            done
            D=webpsb.perkasa.net.id
            C=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --resolve $D:80:127.0.0.1 http://$D/ 2>/dev/null); echo "R22_LOCAL_HTTP: ${C:-000}"
            C=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 10 --resolve $D:443:127.0.0.1 https://$D/ 2>/dev/null); echo "R22_LOCAL_HTTPS: ${C:-000}"
            C=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 http://$D/ 2>/dev/null); echo "R22_PUB_HTTP: ${C:-000}"
            C=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 15 https://$D/ 2>/dev/null); echo "R22_PUB_HTTPS: ${C:-000}"
            echo "R22_PSB_CANDIDATES: $(docker ps -aq --format "{{.Names}}" 2>/dev/null | grep -iE "webpsb|psb|web-psb|perkasa|rec[0-9]+-")"
          ' 2>&1)
          RC=$?
          echo "RAW_OUT<<EOF_R22" >> $GITHUB_OUTPUT
          printf '%s\n' "$OUT" >> $GITHUB_OUTPUT
          echo "EOF_R22" >> $GITHUB_OUTPUT
          echo "SSH_RC=$RC" >> $GITHUB_OUTPUT
          echo "--- RAW SERVER OUTPUT START ---"
          printf '%s\n' "$OUT"
          echo "--- RAW SERVER OUTPUT END RC=$RC ---"

      - name: "R22: CONVERT raw lines → GITHUB ANNOTATIONS ::error:: (terbaca di Summary!)"
        run: |
          OUT="${{ steps.diag.outputs.RAW_OUT }}"
          SSH_RC="${{ steps.diag.outputs.SSH_RC }}"
          N=0
          while IFS= read -r LINE; do
            LINE=$(printf '%s' "$LINE" | tr -d '\r' | tr '\n' ' ' | sed 's/[[:space:]]\+$//')
            [ -z "$LINE" ] && continue
            N=$((N+1))
            if echo "$LINE" | grep -qE '^R22_'; then
              TITLE=$(echo "$LINE" | cut -d: -f1 | head -c 100)
              VAL=$(echo "$LINE" | cut -d: -f2- | sed 's/^[[:space:]]*//' | head -c 200)
              VAL_SAFE=$(printf '%s' "$VAL" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::error title=${TITLE}::${VAL_SAFE}"
              echo "[ANN-$N] $TITLE :: $VAL"
            fi
            [ $N -ge 80 ] && break
          done <<< "$OUT"
          echo "Total lines: $N, SSH_RC=$SSH_RC"
