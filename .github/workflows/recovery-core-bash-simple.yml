name: "RUN29 READ-ONLY: Locate WebPSB DATABASE_URL in Coolify Metadata"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag_r29:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: "0. Install SSH Key STANDARD SAFE"
        run: |
          USER="${{ secrets.COOLIFY_SERVER_USER }}"; USER="${USER:-root}"
          KEY="${{ secrets.COOLIFY_SERVER_SSH_PRIVATE_KEY }}"
          HOST="${{ secrets.COOLIFY_SERVER_HOST }}"
          mkdir -p $HOME/.ssh; chmod 700 $HOME/.ssh
          K=$HOME/.ssh/id_rsa_r25
          install -m 600 /dev/null $K
          printf '%s\n' "$KEY" > $K
          chmod 600 $K
          echo "KEY=$K" >> $GITHUB_ENV
          echo "USER=$USER" >> $GITHUB_ENV
          echo "HOST=$HOST" >> $GITHUB_ENV

      - name: "RUN29: Read-only env locator (Coolify metadata + containers + Traefik target)"
        id: diag_ro
        continue-on-error: true
        run: |
          set +e
          K=${{ env.KEY }}
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $K"
          OUT=$(ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" '
            set +e
            D=webpsb.perkasa.net.id
            NOW=$(date -u +%FT%TZ 2>/dev/null); NOW=${NOW:-unknown}; echo "R29_TS: $NOW"

            DB_VARS="DATABASE_URL DIRECT_URL SHADOW_DATABASE_URL PRISMA_DATABASE_URL"
            AUTH_VARS="NEXTAUTH_SECRET NEXTAUTH_URL AUTH_SECRET AUTH_URL AUTH_TRUST_HOST"
            URL_VARS="DATABASE_URL DIRECT_URL SHADOW_DATABASE_URL PRISMA_DATABASE_URL NEXTAUTH_URL AUTH_URL"
            ALL_VARS="$DB_VARS $AUTH_VARS"

            root=/data/coolify
            if [ -d "$root" ]; then
              echo "R29_COOLIFY_DIR: FOUND path=$root"
            else
              echo "R29_COOLIFY_DIR: NOT_FOUND path=$root"
            fi

            redact_url() {
              python3 -c "import sys,re; u=sys.argv[1].strip(); u=re.sub(r\"(\\w+://)([^/@]+@)\", r\"\\1REDACTED@\", u); u=re.sub(r\"([?&](?:password|passwd|pass|token|secret)=[^&#]*)\", r\"\\1REDACTED\", u, flags=re.I); print(u)" "$1" 2>/dev/null | tr -d "\r\n" | head -c 220
            }

            scan_var_files() {
              v="$1"
              [ ! -d "$root" ] && echo "R29_FS_${v}: NOT_FOUND root_missing" && return 0
              files=$(grep -RIl "$v" "$root" 2>/dev/null | head -n 8 | tr "\n" " " | sed "s/[[:space:]]\+$//")
              if [ -z "$files" ]; then
                echo "R29_FS_${v}: NOT_FOUND"
                return 0
              fi

              hit=$(grep -RIn -m 1 -E "^[[:space:]]*${v}[[:space:]]*=" "$root" 2>/dev/null | head -1)
              if [ -n "$hit" ]; then
                f=$(printf "%s" "$hit" | cut -d: -f1)
                if printf "%s\n" "$URL_VARS" | grep -w "$v" >/dev/null 2>&1; then
                  val=$(printf "%s" "$hit" | cut -d: -f3- | sed -E "s/^[^=]*=//")
                  red=$(redact_url "$val")
                  [ -z "$red" ] && red="(redacted_unavailable)"
                  echo "R29_FS_${v}: FOUND file=$f redacted=$red"
                else
                  echo "R29_FS_${v}: FOUND file=$f"
                fi
              else
                echo "R29_FS_${v}: FOUND files=${files:0:260}"
              fi
            }

            for v in $ALL_VARS; do
              scan_var_files "$v"
            done

            ctr_check() {
              nm="$1"
              id=$(docker ps -a --filter "name=^/${nm}$" --format "{{.ID}}" 2>/dev/null | head -1)
              if [ -z "$id" ]; then
                echo "R29_CTR_${nm}: NOT_FOUND"
                return 0
              fi

              st=$(docker inspect -f "{{.State.Status}}" "$id" 2>/dev/null)
              img=$(docker inspect -f "{{.Config.Image}}" "$id" 2>/dev/null)
              ip=$(docker inspect -f "{{with index .NetworkSettings.Networks \"coolify\"}}{{.IPAddress}}{{end}}" "$id" 2>/dev/null)
              [ -z "$ip" ] && ip="(none)"
              echo "R29_CTR_${nm}: FOUND id=${id:0:12} st=${st:-unknown} img=${img:-unknown} ip=$ip"

              envk=$(docker inspect -f "{{range .Config.Env}}{{println .}}{{end}}" "$id" 2>/dev/null | awk -F= "{print \$1}" | sort -u | tr "\n" " ")
              [ -z "$envk" ] && envk="(none)"

              line=""
              for v in $ALL_VARS; do
                found="NOT_FOUND"
                printf "%s\n" "$envk" | grep -w "$v" >/dev/null 2>&1 && found="FOUND"
                line="${line}${v}=${found} "
              done
              echo "R29_ENV_${nm}: ${line:0:880}"

              lbl=$(docker inspect -f "{{range \$k, \$v := .Config.Labels}}{{println \$k \"=\" \$v}}{{end}}" "$id" 2>/dev/null | grep -F "$D" 2>/dev/null | head -n 3 | tr "\n" ";" | head -c 260)
              if [ -n "$lbl" ]; then
                echo "R29_LABEL_MATCH_${nm}: FOUND"
              else
                echo "R29_LABEL_MATCH_${nm}: NOT_FOUND"
              fi
            }

            ctr_check "rec17-webpsb-p1"
            ctr_check "webpsb-recoverycore-customdomain"
            ctr_check "web-psb-perkasa"

            PSB_IDS=$(docker ps --filter "ancestor=local-web-psb:6f3e12e" --format "{{.ID}}" 2>/dev/null | tr "\n" " " | sed "s/[[:space:]]\+$//"); PSB_IDS=${PSB_IDS:-NONE}
            if [ "$PSB_IDS" = "NONE" ]; then
              echo "R29_PSB_BY_IMAGE: NOT_FOUND"
            else
              meta=$(docker ps --filter "ancestor=local-web-psb:6f3e12e" --format "{{.ID}} {{.Names}}" 2>/dev/null | tr "\n" " " | sed "s/[[:space:]]\+$//")
              echo "R29_PSB_BY_IMAGE: FOUND ${meta:0:260}"
            fi

            DYN=/data/coolify/proxy/dynamic
            if [ -d "$DYN" ]; then
              dyn_hits=$(grep -RIl "$D" "$DYN" 2>/dev/null | head -n 6 | tr "\n" " " | sed "s/[[:space:]]\+$//")
              if [ -z "$dyn_hits" ]; then
                echo "R29_TRAEFIK_TARGET: NOT_FOUND in=$DYN"
              else
                f=$(printf "%s\n" "$dyn_hits" | awk "{print \$1}")
                svc=$(grep -E "^[[:space:]]*service:[[:space:]]*" "$f" 2>/dev/null | head -1 | sed -E "s/^[[:space:]]*service:[[:space:]]*//" | head -c 120)
                url=$(grep -E "^[[:space:]]*-[[:space:]]*url:[[:space:]]*http" "$f" 2>/dev/null | head -1 | sed -E "s/.*url:[[:space:]]*//" | tr -d "\r\n" | head -c 180)
                [ -z "$svc" ] && svc="(unknown)"
                [ -z "$url" ] && url="(none)"
                target="(unknown)"
                if printf "%s" "$url" | grep -q "^http://"; then
                  hip=$(printf "%s" "$url" | sed -E "s#^http://([^:/]+).*#\1#")
                  for nm in rec17-webpsb-p1 webpsb-recoverycore-customdomain web-psb-perkasa; do
                    cid=$(docker ps -a --filter "name=^/${nm}$" --format "{{.ID}}" 2>/dev/null | head -1)
                    [ -z "$cid" ] && continue
                    cip=$(docker inspect -f "{{with index .NetworkSettings.Networks \"coolify\"}}{{.IPAddress}}{{end}}" "$cid" 2>/dev/null)
                    [ -n "$cip" ] && [ "$cip" = "$hip" ] && target="$nm" && break
                  done
                fi
                echo "R29_TRAEFIK_TARGET: FOUND file=$f service=$svc backend=$url maps_to=$target"
              fi
            else
              echo "R29_TRAEFIK_TARGET: NOT_FOUND dir_missing=$DYN"
            fi

            echo "R29_NO_CHANGES: YES"
          ' 2>&1)
          RC=$?
          echo "RAW_OUT<<EOF_R29" >> $GITHUB_OUTPUT
          printf '%s\n' "$OUT" >> $GITHUB_OUTPUT
          echo "EOF_R29" >> $GITHUB_OUTPUT
          echo "SSH_RC=$RC" >> $GITHUB_OUTPUT
          echo "--- RAW OUT START RC=$RC ---"
          printf '%s\n' "$OUT"
          echo "--- RAW OUT END ---"

      - name: "RUN29: Summary (annotations)"
        continue-on-error: true
        run: |
          set +eo pipefail
          OUT="${{ steps.diag_ro.outputs.RAW_OUT }}"
          SSH_RC="${{ steps.diag_ro.outputs.SSH_RC }}"
          getv() {
            local key="$1"
            printf '%s\n' "$OUT" | { grep -E "^${key}:" || true; } | head -1 | cut -d: -f2- | sed "s/^[[:space:]]*//; s/[[:space:]]\+$//"
          }

          TS="$(getv R29_TS)"
          COOLIFY="$(getv R29_COOLIFY_DIR)"
          FS_DB="$(getv R29_FS_DATABASE_URL)"
          FS_DIRECT="$(getv R29_FS_DIRECT_URL)"
          FS_SHADOW="$(getv R29_FS_SHADOW_DATABASE_URL)"
          FS_PRISMA="$(getv R29_FS_PRISMA_DATABASE_URL)"
          FS_NXU="$(getv R29_FS_NEXTAUTH_URL)"
          FS_AUU="$(getv R29_FS_AUTH_URL)"
          FS_NXS="$(getv R29_FS_NEXTAUTH_SECRET)"
          FS_AUS="$(getv R29_FS_AUTH_SECRET)"
          FS_TRUST="$(getv R29_FS_AUTH_TRUST_HOST)"
          C1="$(getv R29_CTR_rec17-webpsb-p1)"
          E1="$(getv R29_ENV_rec17-webpsb-p1)"
          C2="$(getv R29_CTR_webpsb-recoverycore-customdomain)"
          E2="$(getv R29_ENV_webpsb-recoverycore-customdomain)"
          C3="$(getv R29_CTR_web-psb-perkasa)"
          E3="$(getv R29_ENV_web-psb-perkasa)"
          TRAF="$(getv R29_TRAEFIK_TARGET)"
          NC="$(getv R29_NO_CHANGES)"

          META="TS=$TS | COOLIFY_DIR=$COOLIFY | NO_CHANGES=$NC | SSH_RC=$SSH_RC"
          FS="DATABASE_URL=$FS_DB | DIRECT_URL=$FS_DIRECT | SHADOW_DATABASE_URL=$FS_SHADOW | PRISMA_DATABASE_URL=$FS_PRISMA | NEXTAUTH_URL=$FS_NXU | AUTH_URL=$FS_AUU | NEXTAUTH_SECRET=$FS_NXS | AUTH_SECRET=$FS_AUS | AUTH_TRUST_HOST=$FS_TRUST"
          CTRS="rec17-webpsb-p1={$C1} ; webpsb-recoverycore-customdomain={$C2} ; web-psb-perkasa={$C3}"
          ENVS="rec17-webpsb-p1={$E1} ; webpsb-recoverycore-customdomain={$E2} ; web-psb-perkasa={$E3}"

          for title in META FS CONTAINERS ENV TRAEFIK; do
            case "$title" in
              META) val="$META" ;;
              FS) val="$FS" ;;
              CONTAINERS) val="$CTRS" ;;
              ENV) val="$ENVS" ;;
              TRAEFIK) val="$TRAF" ;;
            esac
            val="$(printf '%s' "$val" | head -c 1100)"
            val_safe="$(printf '%s' "$val" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::notice title=${title}::${val_safe}"
            printf '%s\n' "${title}: ${val}"
          done
