name: "RUN36 DIAG+FIX MINIMAL: Restore DB env to rec17-webpsb-p1"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag_r36:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proceed_fix: ${{ steps.diag.outputs.proceed_fix }}
      app_id: ${{ steps.diag.outputs.app_id }}
      container_name: ${{ steps.diag.outputs.container_name }}
      compose_workdir: ${{ steps.diag.outputs.compose_workdir }}
      compose_service: ${{ steps.diag.outputs.compose_service }}
      compose_project: ${{ steps.diag.outputs.compose_project }}
      compose_config_files: ${{ steps.diag.outputs.compose_config_files }}
      envfile_has_database_url: ${{ steps.diag.outputs.envfile_has_database_url }}
      envfile_has_direct_url: ${{ steps.diag.outputs.envfile_has_direct_url }}
      container_has_database_url: ${{ steps.diag.outputs.container_has_database_url }}
      container_has_direct_url: ${{ steps.diag.outputs.container_has_direct_url }}
      compose_has_envfile: ${{ steps.diag.outputs.compose_has_envfile }}
      compose_mentions_database_url: ${{ steps.diag.outputs.compose_mentions_database_url }}
      compose_mentions_direct_url: ${{ steps.diag.outputs.compose_mentions_direct_url }}

    steps:
      - uses: actions/checkout@v4

      - name: "0. Install SSH Key STANDARD SAFE"
        run: |
          USER="${{ secrets.COOLIFY_SERVER_USER }}"; USER="${USER:-root}"
          KEY="${{ secrets.COOLIFY_SERVER_SSH_PRIVATE_KEY }}"
          HOST="${{ secrets.COOLIFY_SERVER_HOST }}"
          mkdir -p $HOME/.ssh; chmod 700 $HOME/.ssh
          K=$HOME/.ssh/id_rsa_r25
          install -m 600 /dev/null $K
          printf '%s\n' "$KEY" > $K
          chmod 600 $K
          echo "KEY=$K" >> $GITHUB_ENV
          echo "USER=$USER" >> $GITHUB_ENV
          echo "HOST=$HOST" >> $GITHUB_ENV

      - name: "RUN36: Read-only — determine Coolify env injection mechanism"
        id: diag
        continue-on-error: true
        run: |
          set +e
          K=${{ env.KEY }}
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $K"

          OUT=$(ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" '
            set +e

            APP_ID=pic3vleasj465ooh77ioicw6
            CONTAINER_NAME=rec17-webpsb-p1
            ROOT=/data/coolify

            container_exists() { docker ps -a --filter "name=^/$1$" --format "{{.ID}}" 2>/dev/null | head -1; }
            has_key_in_envfile() { f="$1"; k="$2"; [ -f "$f" ] || return 1; grep -q -E "^[[:space:]]*${k}[[:space:]]*=" "$f" 2>/dev/null; }
            container_has_env_key() { cid="$1"; k="$2"; docker inspect -f "{{range .Config.Env}}{{println .}}{{end}}" "$cid" 2>/dev/null | awk -F= "{print \$1}" | grep -x "$k" >/dev/null 2>&1; }
            label_get() { cid="$1"; key="$2"; docker inspect -f "{{ index .Config.Labels \"'"'"'$key'"'"'\" }}" "$cid" 2>/dev/null | tr -d "\r\n" | head -c 500; }
            mounts_have_app() { cid="$1"; docker inspect -f "{{range .Mounts}}{{println .Source}}{{end}}" "$cid" 2>/dev/null | grep -F "$APP_ID" >/dev/null 2>&1; }

            ENV_FILE="$ROOT/applications/$APP_ID/.env"
            CID=$(container_exists "$CONTAINER_NAME"); CID=${CID:-NONE}

            COMPOSE_WORKDIR=""
            COMPOSE_PROJECT=""
            COMPOSE_SERVICE=""
            COMPOSE_CONFIG_FILES=""
            if [ "$CID" != "NONE" ]; then
              COMPOSE_WORKDIR=$(label_get "$CID" "com.docker.compose.project.working_dir")
              COMPOSE_PROJECT=$(label_get "$CID" "com.docker.compose.project")
              COMPOSE_SERVICE=$(label_get "$CID" "com.docker.compose.service")
              COMPOSE_CONFIG_FILES=$(label_get "$CID" "com.docker.compose.project.config_files")
            fi

            ENVFILE_HAS_DATABASE_URL="NO"
            ENVFILE_HAS_DIRECT_URL="NO"
            has_key_in_envfile "$ENV_FILE" "DATABASE_URL" && ENVFILE_HAS_DATABASE_URL="YES"
            has_key_in_envfile "$ENV_FILE" "DIRECT_URL" && ENVFILE_HAS_DIRECT_URL="YES"

            CONTAINER_HAS_DATABASE_URL="NO"
            CONTAINER_HAS_DIRECT_URL="NO"
            if [ "$CID" != "NONE" ]; then
              container_has_env_key "$CID" "DATABASE_URL" && CONTAINER_HAS_DATABASE_URL="YES"
              container_has_env_key "$CID" "DIRECT_URL" && CONTAINER_HAS_DIRECT_URL="YES"
            fi

            MOUNTS_HAVE_APP="NO"
            [ "$CID" != "NONE" ] && mounts_have_app "$CID" && MOUNTS_HAVE_APP="YES"

            COMPOSE_HAS_ENVFILE="UNKNOWN"
            COMPOSE_MENTIONS_DATABASE_URL="UNKNOWN"
            COMPOSE_MENTIONS_DIRECT_URL="UNKNOWN"

            EXISTS_ALL="YES"
            if [ -n "$COMPOSE_CONFIG_FILES" ]; then
              COMPOSE_HAS_ENVFILE="NO"
              COMPOSE_MENTIONS_DATABASE_URL="NO"
              COMPOSE_MENTIONS_DIRECT_URL="NO"
              IFS="," read -r -a files <<< "$COMPOSE_CONFIG_FILES"
              for f in "${files[@]}"; do
                [ -f "$f" ] || { EXISTS_ALL="NO"; continue; }
                grep -E "^[[:space:]]*env_file[[:space:]]*:" "$f" >/dev/null 2>&1 && COMPOSE_HAS_ENVFILE="YES"
                grep -F "DATABASE_URL" "$f" >/dev/null 2>&1 && COMPOSE_MENTIONS_DATABASE_URL="YES"
                grep -F "DIRECT_URL" "$f" >/dev/null 2>&1 && COMPOSE_MENTIONS_DIRECT_URL="YES"
              done
            else
              EXISTS_ALL="NO"
            fi

            PROCEED_FIX="NO"
            if [ "$CID" != "NONE" ] \
              && [ "$ENVFILE_HAS_DATABASE_URL" = "YES" ] \
              && [ "$CONTAINER_HAS_DATABASE_URL" = "NO" ] \
              && [ -n "$COMPOSE_WORKDIR" ] \
              && [ -n "$COMPOSE_SERVICE" ] \
              && [ -n "$COMPOSE_CONFIG_FILES" ] \
              && [ "$EXISTS_ALL" = "YES" ]; then
              PROCEED_FIX="YES"
            fi

            echo "R36_APP_ID: $APP_ID"
            echo "R36_CONTAINER_NAME: $CONTAINER_NAME"
            echo "R36_CONTAINER_FOUND: $( [ "$CID" = "NONE" ] && echo NO || echo YES )"
            echo "R36_ENVFILE_PATH: $ENV_FILE"
            echo "R36_ENVFILE_HAS_DATABASE_URL: $ENVFILE_HAS_DATABASE_URL"
            echo "R36_ENVFILE_HAS_DIRECT_URL: $ENVFILE_HAS_DIRECT_URL"
            echo "R36_CONTAINER_HAS_DATABASE_URL: $CONTAINER_HAS_DATABASE_URL"
            echo "R36_CONTAINER_HAS_DIRECT_URL: $CONTAINER_HAS_DIRECT_URL"
            echo "R36_COMPOSE_PROJECT: $COMPOSE_PROJECT"
            echo "R36_COMPOSE_SERVICE: $COMPOSE_SERVICE"
            echo "R36_COMPOSE_WORKDIR: $COMPOSE_WORKDIR"
            echo "R36_COMPOSE_CONFIG_FILES: $COMPOSE_CONFIG_FILES"
            echo "R36_COMPOSE_FILES_EXIST: $EXISTS_ALL"
            echo "R36_COMPOSE_HAS_ENVFILE: $COMPOSE_HAS_ENVFILE"
            echo "R36_COMPOSE_MENTIONS_DATABASE_URL: $COMPOSE_MENTIONS_DATABASE_URL"
            echo "R36_COMPOSE_MENTIONS_DIRECT_URL: $COMPOSE_MENTIONS_DIRECT_URL"
            echo "R36_CONTAINER_MOUNTS_HAVE_APP_DIR: $MOUNTS_HAVE_APP"
            echo "R36_PROCEED_FIX: $PROCEED_FIX"
          ' 2>&1)

          echo "raw<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$OUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          getv() { printf '%s\n' "$OUT" | { grep -E "^$1:" || true; } | head -1 | cut -d: -f2- | sed "s/^[[:space:]]*//; s/[[:space:]]\+$//"; }
          proceed_fix="$(getv R36_PROCEED_FIX)"
          app_id="$(getv R36_APP_ID)"
          container_name="$(getv R36_CONTAINER_NAME)"
          compose_workdir="$(getv R36_COMPOSE_WORKDIR)"
          compose_service="$(getv R36_COMPOSE_SERVICE)"
          compose_project="$(getv R36_COMPOSE_PROJECT)"
          compose_config_files="$(getv R36_COMPOSE_CONFIG_FILES)"
          envfile_has_database_url="$(getv R36_ENVFILE_HAS_DATABASE_URL)"
          envfile_has_direct_url="$(getv R36_ENVFILE_HAS_DIRECT_URL)"
          container_has_database_url="$(getv R36_CONTAINER_HAS_DATABASE_URL)"
          container_has_direct_url="$(getv R36_CONTAINER_HAS_DIRECT_URL)"
          compose_has_envfile="$(getv R36_COMPOSE_HAS_ENVFILE)"
          compose_mentions_database_url="$(getv R36_COMPOSE_MENTIONS_DATABASE_URL)"
          compose_mentions_direct_url="$(getv R36_COMPOSE_MENTIONS_DIRECT_URL)"

          for kv in proceed_fix app_id container_name compose_workdir compose_service compose_project compose_config_files envfile_has_database_url envfile_has_direct_url container_has_database_url container_has_direct_url compose_has_envfile compose_mentions_database_url compose_mentions_direct_url; do
            eval "v=\${$kv}"
            [ -z "$v" ] && v="(missing)"
            echo "${kv}=$v" >> "$GITHUB_OUTPUT"
          done

      - name: "RUN36: Summary (read-only)"
        continue-on-error: true
        run: |
          set +eo pipefail
          OUT="${{ steps.diag.outputs.raw }}"
          getv() { printf '%s\n' "$OUT" | { grep -E "^$1:" || true; } | head -1 | cut -d: -f2- | sed "s/^[[:space:]]*//; s/[[:space:]]\+$//"; }
          for k in R36_PROCEED_FIX R36_COMPOSE_WORKDIR R36_COMPOSE_CONFIG_FILES R36_COMPOSE_SERVICE R36_ENVFILE_HAS_DATABASE_URL R36_ENVFILE_HAS_DIRECT_URL R36_CONTAINER_HAS_DATABASE_URL R36_CONTAINER_HAS_DIRECT_URL R36_COMPOSE_HAS_ENVFILE R36_COMPOSE_MENTIONS_DATABASE_URL R36_COMPOSE_MENTIONS_DIRECT_URL; do
            v="$(getv "$k")"; [ -z "$v" ] && v="(missing)"
            v="$(printf '%s' "$v" | head -c 1100)"
            v_safe="$(printf '%s' "$v" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::notice title=${k}::${v_safe}"
          done

  fix_r36:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [diag_r36]
    if: ${{ needs.diag_r36.outputs.proceed_fix == 'YES' }}

    steps:
      - uses: actions/checkout@v4

      - name: "0. Install SSH Key STANDARD SAFE"
        run: |
          USER="${{ secrets.COOLIFY_SERVER_USER }}"; USER="${USER:-root}"
          KEY="${{ secrets.COOLIFY_SERVER_SSH_PRIVATE_KEY }}"
          HOST="${{ secrets.COOLIFY_SERVER_HOST }}"
          mkdir -p $HOME/.ssh; chmod 700 $HOME/.ssh
          K=$HOME/.ssh/id_rsa_r25
          install -m 600 /dev/null $K
          printf '%s\n' "$KEY" > $K
          chmod 600 $K
          echo "KEY=$K" >> $GITHUB_ENV
          echo "USER=$USER" >> $GITHUB_ENV
          echo "HOST=$HOST" >> $GITHUB_ENV

      - name: "RUN36: CHANGE_PLAN (must print before change)"
        run: |
          set +e
          APP_ID="${{ needs.diag_r36.outputs.app_id }}"
          CTR="${{ needs.diag_r36.outputs.container_name }}"
          KEYS="DATABASE_URL DIRECT_URL"
          echo "::notice title=CHANGE_PLAN::Patch Compose env injection for ${CTR} to restore DB env keys via placeholders (no secrets printed), then force-recreate only that service using docker compose."
          echo "::notice title=AFFECTED_APPLICATION::${APP_ID}"
          echo "::notice title=AFFECTED_CONTAINER::${CTR}"
          echo "::notice title=ENV_KEYS_TO_RESTORE::${KEYS}"
          echo "::notice title=ROLLBACK_PLAN::Restore compose file from backup (.bak.RUN36.<ts>) and force-recreate only the same service again."

      - name: "RUN36: APPLY FIX — restore DATABASE_URL/DIRECT_URL via Compose and recreate service"
        id: fix
        run: |
          set +e
          K=${{ env.KEY }}
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $K"

          OUT=$(ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" '
            set +e
            APP_ID=pic3vleasj465ooh77ioicw6
            CONTAINER_NAME=rec17-webpsb-p1
            ROOT=/data/coolify
            ENV_FILE="$ROOT/applications/$APP_ID/.env"

            container_exists() { docker ps -a --filter "name=^/$1$" --format "{{.ID}}" 2>/dev/null | head -1; }
            container_has_env_key() { cid="$1"; k="$2"; docker inspect -f "{{range .Config.Env}}{{println .}}{{end}}" "$cid" 2>/dev/null | awk -F= "{print \$1}" | grep -x "$k" >/dev/null 2>&1; }
            label_get() { cid="$1"; key="$2"; docker inspect -f "{{ index .Config.Labels \"'"'"'$key'"'"'\" }}" "$cid" 2>/dev/null | tr -d "\r\n" | head -c 800; }
            has_key_in_envfile() { f="$1"; k="$2"; [ -f "$f" ] || return 1; grep -q -E "^[[:space:]]*${k}[[:space:]]*=" "$f" 2>/dev/null; }

            CID=$(container_exists "$CONTAINER_NAME"); CID=${CID:-NONE}
            [ "$CID" = "NONE" ] && echo "FIX_ERR: container_not_found" && exit 2

            WORKDIR=$(label_get "$CID" "com.docker.compose.project.working_dir")
            SERVICE=$(label_get "$CID" "com.docker.compose.service")
            CFG=$(label_get "$CID" "com.docker.compose.project.config_files")
            [ -z "$WORKDIR" ] && echo "FIX_ERR: compose_workdir_missing" && exit 3
            [ -z "$SERVICE" ] && echo "FIX_ERR: compose_service_missing" && exit 4
            [ -z "$CFG" ] && echo "FIX_ERR: compose_config_files_missing" && exit 5

            has_key_in_envfile "$ENV_FILE" "DATABASE_URL" || { echo "FIX_ERR: envfile_missing_DATABASE_URL"; exit 6; }
            has_key_in_envfile "$ENV_FILE" "DIRECT_URL" || { echo "FIX_WARN: envfile_missing_DIRECT_URL"; }

            COMP="docker compose"
            $COMP version >/dev/null 2>&1 || COMP="docker-compose"
            $COMP version >/dev/null 2>&1 || { echo "FIX_ERR: docker_compose_not_found"; exit 7; }

            IFS="," read -r -a files <<< "$CFG"
            PATCH_FILE="${files[-1]}"
            [ -f "$PATCH_FILE" ] || { echo "FIX_ERR: patch_file_missing $PATCH_FILE"; exit 8; }

            TS=$(date -u +%Y%m%dT%H%M%SZ 2>/dev/null); TS=${TS:-unknown}
            BAK="${PATCH_FILE}.bak.RUN36.${TS}"
            cp -f "$PATCH_FILE" "$BAK" 2>/dev/null || { echo "FIX_ERR: backup_failed"; exit 9; }

            python3 - "$PATCH_FILE" "$SERVICE" << "PY"
import sys

path, service = sys.argv[1], sys.argv[2]
with open(path, "r", encoding="utf-8", errors="replace") as f:
    lines = f.read().splitlines(True)

def find_services_idx(lines):
    for i, ln in enumerate(lines):
        if ln.strip() == "services:":
            return i
    return None

def find_service_block(lines, service):
    services_i = find_services_idx(lines)
    if services_i is None:
        return None
    target = f"  {service}:"
    start = None
    for i in range(services_i + 1, len(lines)):
        if lines[i].startswith(target) and lines[i].strip() == target.strip():
            start = i
            break
    if start is None:
        return None
    end = len(lines)
    for j in range(start + 1, len(lines)):
        ln = lines[j]
        if ln.startswith("  ") and (not ln.startswith("    ")) and ln.strip().endswith(":"):
            end = j
            break
    return (start, end)

block = find_service_block(lines, service)
if not block:
    sys.exit(10)

start, end = block
svc_lines = lines[start:end]

def has_env_key_list_style(svc_lines, key):
    needle = f"- {key}="
    needle2 = f"- {key}=${{{key}}}"
    for ln in svc_lines:
        s = ln.strip()
        if s.startswith("- ") and (s == needle2 or s.startswith(needle)):
            return True
    return False

def has_env_key_map_style(svc_lines, key):
    needle = f"{key}:"
    for ln in svc_lines:
        if ln.startswith("      ") and ln.strip().startswith(needle):
            return True
    return False

def find_env_block(svc_lines):
    for i, ln in enumerate(svc_lines):
        if ln.startswith("    environment:"):
            j = i + 1
            while j < len(svc_lines) and (svc_lines[j].startswith("      ") or svc_lines[j].strip() == ""):
                j += 1
            return (i, j)
    return None

env_block = find_env_block(svc_lines)

def ensure_env_list(svc_lines, insert_at, keys):
    add = []
    for k in keys:
        add.append(f"      - {k}=${{{k}}}\n")
    return svc_lines[:insert_at] + ["    environment:\n"] + add + svc_lines[insert_at:]

keys = ["DATABASE_URL", "DIRECT_URL"]
if env_block:
    env_i, env_j = env_block
    children = svc_lines[env_i+1:env_j]
    is_list = False
    is_map = False
    for ln in children:
        t = ln.strip()
        if t.startswith("- "):
            is_list = True
            break
        if ":" in t and not t.startswith("#"):
            is_map = True
            break
    if not is_list and not is_map:
        is_list = True

    if is_list:
        for k in keys:
            if not has_env_key_list_style(svc_lines, k):
                svc_lines.insert(env_j, f"      - {k}=${{{k}}}\n")
                env_j += 1
    else:
        for k in keys:
            if not has_env_key_map_style(svc_lines, k):
                svc_lines.insert(env_j, f"      {k}: ${{{k}}}\n")
                env_j += 1
else:
    insert_at = None
    for i in range(1, len(svc_lines)):
        if svc_lines[i].startswith("    image:") or svc_lines[i].startswith("    build:"):
            insert_at = i + 1
            break
    if insert_at is None:
        insert_at = 1
    svc_lines = ensure_env_list(svc_lines, insert_at, keys)

new_lines = lines[:start] + svc_lines + lines[end:]
with open(path, "w", encoding="utf-8") as f:
    f.writelines(new_lines)
PY

            CFGA=""
            for f in "${files[@]}"; do
              CFGA="$CFGA -f $f"
            done

            cd "$WORKDIR" 2>/dev/null || { echo "FIX_ERR: cannot_cd_workdir"; exit 11; }
            $COMP $CFGA up -d --force-recreate --no-deps "$SERVICE" 2>/dev/null || { echo "FIX_ERR: compose_up_failed"; cp -f "$BAK" "$PATCH_FILE" 2>/dev/null; $COMP $CFGA up -d --force-recreate --no-deps "$SERVICE" 2>/dev/null; exit 12; }

            NEWCID=$(container_exists "$CONTAINER_NAME"); NEWCID=${NEWCID:-NONE}
            [ "$NEWCID" = "NONE" ] && { echo "FIX_ERR: container_missing_after_recreate"; cp -f "$BAK" "$PATCH_FILE" 2>/dev/null; $COMP $CFGA up -d --force-recreate --no-deps "$SERVICE" 2>/dev/null; exit 13; }

            DB_KEY="NOT_FOUND"
            DU_KEY="NOT_FOUND"
            container_has_env_key "$NEWCID" "DATABASE_URL" && DB_KEY="FOUND"
            container_has_env_key "$NEWCID" "DIRECT_URL" && DU_KEY="FOUND"

            HTTP_LOGIN_CODE=$(curl -k -sS -o /dev/null -w "%{http_code}" https://webpsb.perkasa.net.id/login 2>/dev/null)
            HTTP_LOGIN_CODE=${HTTP_LOGIN_CODE:-curl_failed}

            curl -k -sS -X POST -H "Content-Type: application/x-www-form-urlencoded" -d "username=__probe__&password=__probe__" https://webpsb.perkasa.net.id/login -o /dev/null 2>/dev/null

            PRISMA_ENV_ERR="NO"
            docker logs --tail 220 "$NEWCID" 2>/dev/null | grep -F "Environment variable not found: DATABASE_URL" >/dev/null 2>&1 && PRISMA_ENV_ERR="YES"

            echo "FIX_APPLIED: YES"
            echo "FIX_AFFECTED_APP: $APP_ID"
            echo "FIX_AFFECTED_CONTAINER: $CONTAINER_NAME"
            echo "FIX_ENV_DATABASE_URL: $DB_KEY"
            echo "FIX_ENV_DIRECT_URL: $DU_KEY"
            echo "FIX_HTTP_LOGIN_CODE: $HTTP_LOGIN_CODE"
            echo "FIX_PRISMA_ENV_ERROR_STILL_PRESENT: $PRISMA_ENV_ERR"
            echo "FIX_BACKUP_FILE: $BAK"
          ' 2>&1)

          echo "raw<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$OUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: "RUN36: Result summary"
        continue-on-error: true
        run: |
          set +eo pipefail
          OUT="${{ steps.fix.outputs.raw }}"
          getv() { printf '%s\n' "$OUT" | { grep -E "^$1:" || true; } | head -1 | cut -d: -f2- | sed "s/^[[:space:]]*//; s/[[:space:]]\+$//"; }
          for k in FIX_APPLIED FIX_AFFECTED_APP FIX_AFFECTED_CONTAINER FIX_ENV_DATABASE_URL FIX_ENV_DIRECT_URL FIX_HTTP_LOGIN_CODE FIX_PRISMA_ENV_ERROR_STILL_PRESENT FIX_BACKUP_FILE; do
            v="$(getv "$k")"; [ -z "$v" ] && v="(missing)"
            v="$(printf '%s' "$v" | head -c 1100)"
            v_safe="$(printf '%s' "$v" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::notice title=${k}::${v_safe}"
          done
