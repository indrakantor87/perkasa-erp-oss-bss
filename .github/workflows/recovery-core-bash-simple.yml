name: "RUN19 SUPER DUPER MINI (setiap step <3 lines!): ENTRYPOINTS ASLI proxy"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag_r19:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: "0. Install SSH Key"
        run: |
          USER="${{ secrets.COOLIFY_SERVER_USER }}"; USER="${USER:-root}"
          KEY="${{ secrets.COOLIFY_SERVER_SSH_PRIVATE_KEY }}"
          mkdir -p $HOME/.ssh; chmod 700 $HOME/.ssh
          K=$HOME/.ssh/id_ed25519_run19
          printf '%s\n' '-----BEGIN OPENSSH PRIVATE KEY-----' > /tmp/h.txt
          printf '%s\n' '-----END OPENSSH PRIVATE KEY-----' > /tmp/t.txt
          printf '%s' "$KEY" | grep -v 'OPENSSH PRIVATE KEY' | tr -d '\r' > /tmp/b.txt
          (cat /tmp/h.txt; cat /tmp/b.txt; cat /tmp/t.txt) > $K; chmod 600 $K
          echo "KEY=$K" >> $GITHUB_ENV
          echo "USER=$USER" >> $GITHUB_ENV
          echo "HOST=${{ secrets.COOLIFY_SERVER_HOST }}" >> $GITHUB_ENV

      - name: "R19-A1: Proxy name + image"
        run: |
          K=${{ env.KEY }}
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o BatchMode=yes -i $K"
          ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" 'PRX=$(docker ps -aq --format "{{.Names}}" 2>/dev/null | grep -iE coolify-proxy | head -1); IMG=$(docker inspect --format="{{.Config.Image}}" $PRX 2>/dev/null); echo "R19_PRX: $PRX"; echo "R19_PRX_IMG: $IMG"' 2>&1
          echo "RC=$?"

      - name: "R19-A2: PROXY ARGS (entrypoints flags KRITIS!)"
        run: |
          K=${{ env.KEY }}
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o BatchMode=yes -i $K"
          ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" 'PRX=$(docker ps -aq --format "{{.Names}}" 2>/dev/null | grep -iE coolify-proxy | head -1); for A in $(docker inspect $PRX 2>/dev/null | python3 -c "import sys,json;[print(a) for a in json.load(sys.stdin)[0].get(\"Args\",[])]" 2>/dev/null | grep -iE "entrypoint|address|:80|:443|http|web"); do echo "R19_ARG: $A"; done' 2>&1
          echo "RC=$?"

      - name: "R19-A3: proxy labels (if any traefik.* label)"
        run: |
          K=${{ env.KEY }}
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o BatchMode=yes -i $K"
          ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" 'PRX=$(docker ps -aq --format "{{.Names}}" 2>/dev/null | grep -iE coolify-proxy | head -1); docker inspect $PRX 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);l=d[0].get(\"Config\",{}).get(\"Labels\",{});[print(f\"R19_PX_LBL: {k}={v[:90]}\") for k,v in sorted(l.items()) if \"traefik\" in k.lower() or \"entrypoint\" in k.lower()]"' 2>&1
          echo "RC=$?"

      - name: "R19-B1: LOCAL HTTP webpsb via 127.0.0.1"
        run: |
          K=${{ env.KEY }}
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o BatchMode=yes -i $K"
          ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" 'D=webpsb.perkasa.net.id; C=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --resolve $D:80:127.0.0.1 http://$D/ 2>/dev/null); L=$(curl -s -o /dev/null -w "%{redirect_url}" --max-time 10 --resolve $D:80:127.0.0.1 http://$D/ 2>/dev/null); echo "R19_LOCAL_HTTP: $C REDIR: ${L:0:100}"' 2>&1
          echo "RC=$?"

      - name: "R19-B2: LOCAL HTTPS webpsb via 127.0.0.1 skip-verify"
        run: |
          K=${{ env.KEY }}
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o BatchMode=yes -i $K"
          ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" 'D=webpsb.perkasa.net.id; C=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 10 --resolve $D:443:127.0.0.1 https://$D/ 2>/dev/null); echo "R19_LOCAL_HTTPS: $C"' 2>&1
          echo "RC=$?"

      - name: "R19-B3: PUBLIC HTTP webpsb via normal DNS"
        run: |
          K=${{ env.KEY }}
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o BatchMode=yes -i $K"
          ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" 'D=webpsb.perkasa.net.id; C=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 http://$D/ 2>/dev/null); L=$(curl -s -o /dev/null -w "%{redirect_url}" --max-time 12 http://$D/ 2>/dev/null); echo "R19_PUB_HTTP: $C REDIR: ${L:0:100}"' 2>&1
          echo "RC=$?"

      - name: "R19-B4: PUBLIC HTTPS webpsb skip-verify"
        run: |
          K=${{ env.KEY }}
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o BatchMode=yes -i $K"
          ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" 'D=webpsb.perkasa.net.id; C=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 12 https://$D/ 2>/dev/null); echo "R19_PUB_HTTPS: $C"' 2>&1
          echo "RC=$?"

      - name: "R19-C1: DNS + rec17 container status + labels entrypoints"
        run: |
          K=${{ env.KEY }}
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o BatchMode=yes -i $K"
          ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" '
            set +e
            D=webpsb.perkasa.net.id
            IP=$(getent hosts $D 2>/dev/null | awk "{print \$1}" | head -1)
            [ -z "$IP" ] && IP=$(ping -c1 -W2 $D 2>&1 | grep -oE "\([0-9.]{7,}\)" | head -1 | tr -d "()")
            echo "R19_DNS: $D -> $IP"
            CID=$(docker ps -aq --format "{{.Names}}" 2>/dev/null | grep -iE "rec17-webpsb" | head -1)
            [ -z "$CID" ] && echo "R19_REC17: NONE"
            if [ -n "$CID" ]; then
              ST=$(docker inspect --format="{{.State.Status}}" $CID 2>/dev/null)
              IPNET=$(docker inspect -f "{{.NetworkSettings.Networks.coolify.IPAddress}}" $CID 2>/dev/null)
              echo "R19_REC17: $CID STATUS=$ST COOLIFY_IP=$IPNET"
              ENTRYLINE=$(docker inspect $CID 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);l=d[0].get(\"Config\",{}).get(\"Labels\",{});[print(f\"{k}={v[:120]}\") for k,v in sorted(l.items()) if \"entryPoint\" in k]" 2>/dev/null)
              for L in $ENTRYLINE; do echo "R19_PSB_EP: $L"; done | head -5
              RULELINE=$(docker inspect $CID 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);l=d[0].get(\"Config\",{}).get(\"Labels\",{});[print(f\"{k}={v[:120]}\") for k,v in sorted(l.items()) if \".rule\" in k]" 2>/dev/null)
              for L in $RULELINE; do echo "R19_PSB_RULE: $L"; done | head -5
              NETLBL=$(docker inspect -f "{{ index .Config.Labels \"traefik.docker.network\" }}" $CID 2>/dev/null)
              echo "R19_PSB_NET_LABEL: $NETLBL"
            fi
          ' 2>&1
          echo "RC=$?"
