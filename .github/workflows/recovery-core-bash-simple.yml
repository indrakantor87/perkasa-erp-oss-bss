name: "RUN44 SSH CONNECTIVITY DIAGNOSTIC ONLY"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag_r44:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: "0. Install SSH Key STANDARD SAFE (no output)"
        run: |
          USER="${{ secrets.COOLIFY_SERVER_USER }}"; USER="${USER:-root}"
          KEY="${{ secrets.COOLIFY_SERVER_SSH_PRIVATE_KEY }}"
          HOST="${{ secrets.COOLIFY_SERVER_HOST }}"
          mkdir -p $HOME/.ssh; chmod 700 $HOME/.ssh
          K=$HOME/.ssh/id_rsa_r25
          install -m 600 /dev/null $K
          printf '%s\n' "$KEY" > $K
          chmod 600 $K
          echo "KEY=$K" >> $GITHUB_ENV
          echo "USER=$USER" >> $GITHUB_ENV
          echo "HOST=$HOST" >> $GITHUB_ENV

      - name: "RUN44: SSH connectivity diagnostic (runner-side only)"
        id: diag
        continue-on-error: true
        run: |
          set +e
          K="${{ env.KEY }}"
          USER="${{ env.USER }}"
          HOST="${{ env.HOST }}"
          PORT="22"

          R44_TARGET_HOST_REDACTED="REDACTED"
          R44_SSH_PORT="$PORT"
          R44_RUNNER_PUBLIC_IP="UNKNOWN"

          R44_DNS="FAIL"
          R44_TCP_CONNECT="FAIL"
          R44_SSH_BANNER="FAIL"
          R44_SSH_AUTH_REACHED="NO"
          R44_SSH_FAILURE_STAGE="UNKNOWN"

          host_hash=""
          if [ -n "$HOST" ]; then
            host_hash="$(printf '%s' "$HOST" | sha256sum 2>/dev/null | awk '{print $1}' | cut -c1-12)"
            [ -n "$host_hash" ] && R44_TARGET_HOST_REDACTED="sha256:${host_hash}"
          fi

          ip="$(curl -fsS --max-time 6 https://checkip.amazonaws.com 2>/dev/null | tr -d '\r\n' | head -c 64)"
          if printf '%s' "$ip" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
            R44_RUNNER_PUBLIC_IP="$ip"
          else
            ip2="$(curl -fsS --max-time 6 https://api.ipify.org 2>/dev/null | tr -d '\r\n' | head -c 64)"
            if printf '%s' "$ip2" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
              R44_RUNNER_PUBLIC_IP="$ip2"
            fi
          fi

          is_ipv4="NO"
          if printf '%s' "$HOST" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
            is_ipv4="YES"
          fi

          if [ -z "$HOST" ]; then
            R44_DNS="FAIL"
            R44_TCP_CONNECT="FAIL"
            R44_SSH_BANNER="FAIL"
            R44_SSH_AUTH_REACHED="NO"
            R44_SSH_FAILURE_STAGE="DNS"
          else
            if [ "$is_ipv4" = "YES" ]; then
              R44_DNS="OK"
            else
              getent ahosts "$HOST" >/dev/null 2>&1 && R44_DNS="OK"
            fi

            if [ "$R44_DNS" = "OK" ]; then
              timeout 6 bash -c "cat < /dev/null > /dev/tcp/${HOST}/${PORT}" >/dev/null 2>&1
              if [ $? -eq 0 ]; then
                R44_TCP_CONNECT="OK"
              else
                R44_TCP_CONNECT="FAIL"
              fi
            fi

            if [ "$R44_TCP_CONNECT" = "OK" ]; then
              banner="$(timeout 6 bash -c "exec 3<>/dev/tcp/${HOST}/${PORT}; head -c 64 <&3" 2>/dev/null | tr -d '\r\n' | head -c 64)"
              if printf '%s' "$banner" | grep -q '^SSH-'; then
                R44_SSH_BANNER="OK"
              else
                R44_SSH_BANNER="FAIL"
              fi
            fi

            if [ "$R44_SSH_BANNER" = "OK" ]; then
              ssh_log="$(timeout 18 ssh -vv -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=10 -o ConnectionAttempts=1 -i "$K" "$USER@$HOST" true 2>&1 | tail -n 120)"
              ssh_rc=$?
              ssh_log_redacted="$(printf '%s\n' "$ssh_log" \
                | sed -E "s/${HOST}/<HOST_${R44_TARGET_HOST_REDACTED}>/g" \
                | sed -E 's/[0-9]{1,3}(\\.[0-9]{1,3}){3}/<REDACTED_IP>/g' \
                | head -n 120)"

              printf '%s\n' "$ssh_log_redacted" | grep -Eq 'Authentications that can continue|Offering public key|Next authentication method|Authentication succeeded|Permission denied' && R44_SSH_AUTH_REACHED="YES"

              if [ "$R44_SSH_AUTH_REACHED" = "YES" ] && [ $ssh_rc -ne 0 ]; then
                R44_SSH_FAILURE_STAGE="AUTH"
              fi
            fi

            if [ "$R44_DNS" != "OK" ]; then
              R44_SSH_FAILURE_STAGE="DNS"
            elif [ "$R44_TCP_CONNECT" != "OK" ]; then
              R44_SSH_FAILURE_STAGE="TCP"
            elif [ "$R44_SSH_BANNER" != "OK" ]; then
              R44_SSH_FAILURE_STAGE="BANNER"
            elif [ "$R44_SSH_AUTH_REACHED" != "YES" ]; then
              R44_SSH_FAILURE_STAGE="UNKNOWN"
            fi
          fi

          echo "R44_TARGET_HOST_REDACTED=$R44_TARGET_HOST_REDACTED"
          echo "R44_SSH_PORT=$R44_SSH_PORT"
          echo "R44_RUNNER_PUBLIC_IP=$R44_RUNNER_PUBLIC_IP"
          echo "R44_DNS=$R44_DNS"
          echo "R44_TCP_CONNECT=$R44_TCP_CONNECT"
          echo "R44_SSH_BANNER=$R44_SSH_BANNER"
          echo "R44_SSH_AUTH_REACHED=$R44_SSH_AUTH_REACHED"
          echo "R44_SSH_FAILURE_STAGE=$R44_SSH_FAILURE_STAGE"

          msgA="R44_TARGET_HOST_REDACTED=$R44_TARGET_HOST_REDACTED R44_SSH_PORT=$R44_SSH_PORT R44_RUNNER_PUBLIC_IP=$R44_RUNNER_PUBLIC_IP"
          msgB="R44_DNS=$R44_DNS R44_TCP_CONNECT=$R44_TCP_CONNECT R44_SSH_BANNER=$R44_SSH_BANNER R44_SSH_AUTH_REACHED=$R44_SSH_AUTH_REACHED R44_SSH_FAILURE_STAGE=$R44_SSH_FAILURE_STAGE"
          msgA_safe="$(printf '%s' "$msgA" | head -c 1400 | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
          msgB_safe="$(printf '%s' "$msgB" | head -c 1400 | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
          echo "::notice title=R44_RESULTS_A::${msgA_safe}"
          echo "::notice title=R44_RESULTS_B::${msgB_safe}"

          exit 0
