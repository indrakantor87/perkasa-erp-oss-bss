name: "RUN25 DIAGNOSTIC READ-ONLY: Traefik/PSB routing state"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag_r25:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: "0. Install SSH Key STANDARD SAFE"
        run: |
          USER="${{ secrets.COOLIFY_SERVER_USER }}"; USER="${USER:-root}"
          KEY="${{ secrets.COOLIFY_SERVER_SSH_PRIVATE_KEY }}"
          HOST="${{ secrets.COOLIFY_SERVER_HOST }}"
          mkdir -p $HOME/.ssh; chmod 700 $HOME/.ssh
          K=$HOME/.ssh/id_rsa_r25
          install -m 600 /dev/null $K
          printf '%s\n' "$KEY" > $K
          chmod 600 $K
          echo "KEY=$K" >> $GITHUB_ENV
          echo "USER=$USER" >> $GITHUB_ENV
          echo "HOST=$HOST" >> $GITHUB_ENV

      - name: "RUN25 DIAG: Read-only inspect Traefik/PSB/network/labels/dynamic + curl"
        id: diag_fix
        continue-on-error: true
        run: |
          K=${{ env.KEY }}
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o BatchMode=yes -i $K"
          OUT=$(ssh $OPTS "${{ env.USER }}@${{ env.HOST }}" '
            set +e
            D=webpsb.perkasa.net.id
            PRX=$(docker ps --filter "ancestor=traefik:v3.6" --format "{{.ID}}" 2>/dev/null | head -1); PRX=${PRX:-NONE}
            PSB_IDS=$(docker ps --filter "ancestor=local-web-psb:6f3e12e" --format "{{.ID}}" 2>/dev/null | tr "\n" " " | sed "s/[[:space:]]\+$//"); PSB_IDS=${PSB_IDS:-NONE}
            PSB1=$(printf "%s\n" "$PSB_IDS" | awk "{print \$1}"); PSB1=${PSB1:-NONE}

            if [ "$PRX" = "NONE" ]; then
              echo "R25_TRAEFIK: NOT_FOUND"
            else
              echo "R25_TRAEFIK: FOUND id=$PRX"
              TIMG=$(docker inspect -f "{{.Config.Image}}" "$PRX" 2>/dev/null); echo "R25_TRAEFIK_IMAGE: ${TIMG:-unknown}"
              TST=$(docker inspect -f "{{.State.Status}}" "$PRX" 2>/dev/null); echo "R25_TRAEFIK_STATUS: ${TST:-unknown}"
              CMD=$( (docker inspect -f "{{range .Args}}{{println .}}{{end}}" "$PRX" 2>/dev/null; docker inspect -f "{{range .Config.Cmd}}{{println .}}{{end}}" "$PRX" 2>/dev/null) | sed "/^$/d" )
              EPS=$(printf "%s\n" "$CMD" | grep -E "^\-\-entrypoints\." 2>/dev/null | sed -E "s/^--entrypoints\.([^.]+)\..*$/\1/" | sort -u | tr "\n" " " | sed "s/[[:space:]]\+$//")
              [ -z "$EPS" ] && EPS="UNKNOWN"
              echo "R25_ENTRYPOINTS: $EPS"
              RES=$(printf "%s\n" "$CMD" | grep -E "^\-\-certificatesresolvers\." 2>/dev/null | sed -E "s/^--certificatesresolvers\.([^.]+)\..*$/\1/" | sort -u | tr "\n" " " | sed "s/[[:space:]]\+$//")
              [ -z "$RES" ] && RES="NONE"
              echo "R25_TLS_RESOLVERS: $RES"
              P_DOCK=$(printf "%s\n" "$CMD" | grep -E "^\-\-providers\.docker(=|$)" 2>/dev/null | head -1 | sed "s/^--providers\.docker=//")
              P_FILE=$(printf "%s\n" "$CMD" | grep -E "^\-\-providers\.file(=|$)" 2>/dev/null | head -1 | sed "s/^--providers\.file=//")
              P_DIR=$(printf "%s\n" "$CMD" | grep -E "^\-\-providers\.file\.directory=" 2>/dev/null | head -1 | sed "s/^--providers\.file\.directory=//")
              [ -z "$P_DOCK" ] && P_DOCK="UNKNOWN"
              [ -z "$P_FILE" ] && P_FILE="UNKNOWN"
              [ -z "$P_DIR" ] && P_DIR="UNKNOWN"
              echo "R25_PROVIDERS: docker=$P_DOCK file=$P_FILE dir=$P_DIR"
            fi

            if [ "$PSB_IDS" = "NONE" ] || [ "$PSB1" = "NONE" ]; then
              echo "R25_PSB: NOT_FOUND"
            else
              CNT=$(printf "%s\n" "$PSB_IDS" | wc -w | tr -d " "); echo "R25_PSB: FOUND count=$CNT ids=${PSB_IDS:0:80}"
              PST=$(docker inspect -f "{{.State.Status}}" "$PSB1" 2>/dev/null); echo "R25_PSB_STATUS: ${PST:-unknown}"
              PIMG=$(docker inspect -f "{{.Config.Image}}" "$PSB1" 2>/dev/null); echo "R25_PSB_IMAGE: ${PIMG:-unknown}"
            fi

            PORT=$(docker image inspect local-web-psb:6f3e12e 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin)[0]; ports=(d.get(\"Config\") or {}).get(\"ExposedPorts\") or {}; c=[k.split(\"/\",1)[0] for k in ports.keys() if k.split(\"/\",1)[0].isdigit()]; print(c[0] if c else \"3000\")" 2>/dev/null | head -1)
            PORT=${PORT:-3000}
            echo "R25_PORT: $PORT"

            if [ "$PRX" != "NONE" ] && [ "$PSB1" != "NONE" ]; then
              PRX_NETS=$(docker inspect -f "{{range \$k, \$v := .NetworkSettings.Networks}}{{println \$k}}{{end}}" "$PRX" 2>/dev/null | tr "\n" " " | sed "s/[[:space:]]\+$//")
              PSB_NETS=$(docker inspect -f "{{range \$k, \$v := .NetworkSettings.Networks}}{{println \$k}}{{end}}" "$PSB1" 2>/dev/null | tr "\n" " " | sed "s/[[:space:]]\+$//")
              COMMON="NO"; CNET="NONE"
              for n in $PRX_NETS; do
                printf "%s\n" "$PSB_NETS" | grep -w "$n" >/dev/null 2>&1 && COMMON="YES" && CNET="$n" && break
              done
              echo "R25_NETWORK_COMMON: $COMMON name=$CNET"
              echo "R25_NETWORK_TRAEFIK: ${PRX_NETS:-none}"
              echo "R25_NETWORK_PSB: ${PSB_NETS:-none}"
            else
              echo "R25_NETWORK_COMMON: UNKNOWN name=NONE"
            fi

            DYN=/data/coolify/proxy/dynamic
            if [ -d "$DYN" ]; then
              FC=$(find "$DYN" -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d " ")
              FN=$(ls -1 "$DYN" 2>/dev/null | head -5 | tr "\n" " " | sed "s/[[:space:]]\+$//")
              [ -z "$FN" ] && FN="(empty)"
              echo "R25_DYNAMIC_DIR: YES files=$FC sample=$FN"
            else
              echo "R25_DYNAMIC_DIR: NO path=$DYN"
            fi

            HTTP_LBL="NOT_FOUND"; HTTPS_LBL="NOT_FOUND"
            if [ "$PSB_IDS" != "NONE" ]; then
              for id in $PSB_IDS; do
                L=$(docker inspect -f "{{json .Config.Labels}}" "$id" 2>/dev/null | tr -d "\n")
                printf "%s" "$L" | grep -F "$D" >/dev/null 2>&1 || continue
                printf "%s" "$L" | grep -F "entrypoints=websecure" >/dev/null 2>&1 && HTTPS_LBL="FOUND on=${id:0:12}"
                printf "%s" "$L" | grep -F "entrypoints=web" >/dev/null 2>&1 && HTTP_LBL="FOUND on=${id:0:12}"
              done
            fi
            echo "R25_ROUTER_HTTP_LABEL: $HTTP_LBL"
            echo "R25_ROUTER_HTTPS_LABEL: $HTTPS_LBL"

            BACK="UNKNOWN"
            if [ "$PSB1" != "NONE" ]; then
              CIP=$(docker inspect -f "{{range \$k, \$v := .NetworkSettings.Networks}}{{println \$v.IPAddress}}{{end}}" "$PSB1" 2>/dev/null | head -1 | tr -d "\r\n")
              if [ -n "$CIP" ]; then
                CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://$CIP:$PORT/" 2>/dev/null)
                [ -z "$CODE" ] && CODE="000"
                BACK="code=$CODE"
              fi
            fi
            echo "R25_BACKEND_REACHABLE: $BACK"

            CH=$(curl -s -o /dev/null -w "%{http_code}" --max-time 18 http://$D/ 2>/dev/null); RH=$(curl -s -o /dev/null -w "%{redirect_url}" --max-time 18 http://$D/ 2>/dev/null)
            echo "R25_PUBLIC_HTTP: code=${CH:-000} redir=${RH:0:120}"
            CK=$(curl -s -o /dev/null -w "%{http_code}" --max-time 18 https://$D/ 2>/dev/null); RC_HTTPS=$?
            TLS="UNKNOWN"; [ "$RC_HTTPS" = "0" ] && TLS="OK"
            echo "R25_PUBLIC_HTTPS: code=${CK:-000} tls=$TLS"

            CL=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --resolve $D:80:127.0.0.1 http://$D/ 2>/dev/null)
            RL=$(curl -s -o /dev/null -w "%{redirect_url}" --max-time 15 --resolve $D:80:127.0.0.1 http://$D/ 2>/dev/null)
            echo "R25_LOCAL_HTTP: code=${CL:-000} redir=${RL:0:120}"
            CL2=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --resolve $D:443:127.0.0.1 https://$D/ 2>/dev/null)
            echo "R25_LOCAL_HTTPS: code=${CL2:-000}"

            RESULT="UNKNOWN"
            if [ "$PRX" = "NONE" ] || [ "$PSB1" = "NONE" ]; then RESULT="P0_INFRA_BROKEN"; fi
            if [ "$PRX" != "NONE" ] && [ "$PSB1" != "NONE" ] && [ "$HTTP_LBL" = "NOT_FOUND" ] && [ "$HTTPS_LBL" = "NOT_FOUND" ]; then RESULT="P0_ROUTING_BROKEN"; fi
            echo "R25_RESULT: $RESULT"
          ' 2>&1)
          RC=$?
          echo "RAW_OUT<<EOF_R25" >> $GITHUB_OUTPUT
          printf '%s\n' "$OUT" >> $GITHUB_OUTPUT
          echo "EOF_R25" >> $GITHUB_OUTPUT
          echo "SSH_RC=$RC" >> $GITHUB_OUTPUT
          echo "--- RAW OUT START RC=$RC ---"
          printf '%s\n' "$OUT"
          echo "--- RAW OUT END ---"

      - name: "RUN25: Annotations ringkas (read-only)"
        continue-on-error: true
        run: |
          set +eo pipefail
          OUT="${{ steps.diag_fix.outputs.RAW_OUT }}"
          SSH_RC="${{ steps.diag_fix.outputs.SSH_RC }}"
          getv() {
            local key="$1"
            printf '%s\n' "$OUT" | { grep -E "^${key}:" || true; } | head -1 | cut -d: -f2- | sed 's/^[[:space:]]*//; s/[[:space:]]\+$//'
          }

          TRAEFIK="$(getv R25_TRAEFIK) img=$(getv R25_TRAEFIK_IMAGE) st=$(getv R25_TRAEFIK_STATUS) ep=$(getv R25_ENTRYPOINTS) resolvers=$(getv R25_TLS_RESOLVERS) prov=$(getv R25_PROVIDERS) dyn=$(getv R25_DYNAMIC_DIR)"
          PSB="$(getv R25_PSB) img=$(getv R25_PSB_IMAGE) st=$(getv R25_PSB_STATUS) port=$(getv R25_PORT) backend=$(getv R25_BACKEND_REACHABLE)"
          NET="$(getv R25_NETWORK_COMMON)"
          ROUTERS="http=$(getv R25_ROUTER_HTTP_LABEL) https=$(getv R25_ROUTER_HTTPS_LABEL)"
          PUB="http=$(getv R25_PUBLIC_HTTP) https=$(getv R25_PUBLIC_HTTPS)"
          LOC="http=$(getv R25_LOCAL_HTTP) https=$(getv R25_LOCAL_HTTPS)"
          RES="$(getv R25_RESULT)"

          for line in \
            "TRAEFIK: $TRAEFIK" \
            "PSB: $PSB" \
            "NETWORK_COMMON: $NET" \
            "ROUTERS_CUSTOM_DOMAIN: $ROUTERS" \
            "TEST_PUBLIC: $PUB" \
            "TEST_LOCAL: $LOC" \
            "RESULT: $RES (SSH_RC=$SSH_RC)"; do
            title="$(printf '%s' "$line" | cut -d: -f1 | head -c 60)"
            val="$(printf '%s' "$line" | cut -d: -f2- | sed 's/^[[:space:]]*//' | head -c 900)"
            val_safe="$(printf '%s' "$val" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::notice title=${title}::${val_safe}"
            printf '%s\n' "$line"
          done
