name: Deploy Production Coolify v2 (9 steps Stable SSH)

on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Build & Push Docker Image to GHCR"]
    types:
      - completed
    branches: [main]

concurrency:
  group: coolify-production-deploy-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-Flight Filter
        run: |
          set -e
          EVENT=$GITHUB_EVENT_NAME
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Event=$EVENT CommitMsg[0..30]=$(echo $COMMIT_MSG | cut -c1-30)"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "[OK] workflow_dispatch -> OK"
            echo "DEPLOY_OK=1" >> $GITHUB_ENV
            exit 0
          fi
          if [ "$EVENT" = "push" ]; then
            case "$COMMIT_MSG" in
              FORCE_DEPLOY*) echo "[OK] FORCE_DEPLOY commit -> OK"; echo "DEPLOY_OK=1" >> $GITHUB_ENV; exit 0 ;;
              *) echo "[SKIP] push biasa -> skip (success)"; echo "DEPLOY_OK=0" >> $GITHUB_ENV; exit 0 ;;
            esac
          fi
          if [ "$EVENT" = "workflow_run" ]; then
            CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            if [ "$CONCLUSION" = "success" ] && [ "$BRANCH" = "main" ]; then
              echo "[OK] workflow_run success main -> OK"
              echo "DEPLOY_OK=1" >> $GITHUB_ENV
              exit 0
            else
              echo "[SKIP] workflow_run $CONCLUSION/$BRANCH -> skip (success)"
              echo "DEPLOY_OK=0" >> $GITHUB_ENV
              exit 0
            fi
          fi
          echo "[SKIP] unknown event -> skip (success)"
          echo "DEPLOY_OK=0" >> $GITHUB_ENV
          exit 0

      - name: Install SSH Key
        if: env.DEPLOY_OK == '1'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.COOLIFY_SERVER_SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p $HOME/.ssh && chmod 700 $HOME/.ssh
          RAW=$HOME/.ssh/raw_key
          FINAL=$HOME/.ssh/id_ed25519_coolify
          echo "$SSH_PRIVATE_KEY" > $RAW
          BODY=$RAW.body
          tail -n +2 $RAW | head -n -1 | grep -v '^[[:space:]]*$' > $BODY || true
          { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; cat $BODY; echo "-----END OPENSSH PRIVATE KEY-----"; } > $FINAL
          chmod 600 $FINAL
          echo "Final key size: $(wc -c < $FINAL) bytes | lines: $(wc -l < $FINAL)"
          ssh-keygen -l -f $FINAL 2>&1 || true
          rm -f $RAW $BODY

      - name: Preflight SSH test
        if: env.DEPLOY_OK == '1'
        env:
          HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
        run: |
          set -e
          test -n "$HOST" || { echo "[ERR] COOLIFY_SERVER_HOST empty!"; exit 1; }
          KEY=$HOME/.ssh/id_ed25519_coolify
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o BatchMode=yes -i $KEY"
          echo "SSH $USER@$HOST"
          ssh $OPTS "$USER@$HOST" "echo HOST=\$(hostname); echo DOCKER=\$(docker -v 2>&1); echo DATE=\$(date '+%Y-%m-%d %H:%M:%S')"
          echo "[OK] SSH OK"

      - name: "Step 1/9 Login GHCR"
        if: env.DEPLOY_OK == '1'
        env:
          HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          KEY: /home/runner/.ssh/id_ed25519_coolify
          GHCR_U: ${{ github.actor }}
          GHCR_T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o BatchMode=yes -i $KEY"
          echo "[1/9] docker login ghcr.io"
          echo "$GHCR_T" | ssh $OPTS "$USER@$HOST" "docker login ghcr.io -u \"$GHCR_U\" --password-stdin 2>&1 | tail -5"

      - name: "Step 2/9 Pull Image (3-tier fallback: SHA then latest then KNOWN_GOOD)"
        if: env.DEPLOY_OK == '1'
        env:
          HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          KEY: /home/runner/.ssh/id_ed25519_coolify
        run: |
          set -e
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o BatchMode=yes -i $KEY"
          KNOWN_GOOD_IMG="ghcr.io/indrakantor87/perkasa-erp-oss-bss:main-fa65b42"
          LATEST_IMG="ghcr.io/indrakantor87/perkasa-erp-oss-bss:latest"
          SHA7="${GITHUB_SHA:0:7}"
          SHA_IMG="ghcr.io/indrakantor87/perkasa-erp-oss-bss:main-${SHA7}"
          IMG=""
          echo "[2/9] Tier 1: Cek apakah $SHA_IMG tersedia (commit build kode)..."
          EXISTS=$(ssh $OPTS "$USER@$HOST" "docker manifest inspect $SHA_IMG >/dev/null 2>&1 ; echo \$?")
          if [ "$EXISTS" = "0" ]; then
            echo "[OK] Tier 1 SHA image tersedia: $SHA_IMG"
            IMG="$SHA_IMG"
          else
            echo "[INFO] Tier 1 SHA image tdk ada (commit workflow / blm di-build). Coba tier 2: $LATEST_IMG"
            EXISTS2=$(ssh $OPTS "$USER@$HOST" "docker manifest inspect $LATEST_IMG >/dev/null 2>&1 ; echo \$?")
            if [ "$EXISTS2" = "0" ]; then
              echo "[OK] Tier 2 :latest tag tersedia: $LATEST_IMG (selalu terupdate setelah Build & Push sukses)"
              IMG="$LATEST_IMG"
            else
              echo "[WARN] Tier 2 :latest juga tdk ada! Fallback tier 3 KNOWN_GOOD (sudah punya /list-psb Control Tower): $KNOWN_GOOD_IMG"
              IMG="$KNOWN_GOOD_IMG"
            fi
          fi
          echo "[OK] FINAL IMAGE = $IMG"
          echo "IMAGE_FULL=$IMG" >> $GITHUB_ENV
          echo "[2/9] Pull $IMG"
          ssh $OPTS "$USER@$HOST" '
            set -x
            docker pull '"$IMG"' 2>&1 | tail -20
            echo "--- Image info ---"
            docker inspect --format='"'"'{{index .RepoDigests 0}} | {{.Created}} | {{.Size}}'"'"' '"$IMG"' 2>&1 || echo "FATAL: Image not found!"
          '

      - name: "Step 3/9 Stop Old Container"
        if: env.DEPLOY_OK == '1'
        env:
          HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          KEY: /home/runner/.ssh/id_ed25519_coolify
        run: |
          set -e
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o BatchMode=yes -i $KEY"
          ssh $OPTS "$USER@$HOST" '
            OLD=$(docker ps -aq --filter name=perkasa-erp-oss-bss)
            if [ -n "$OLD" ]; then
              echo "[3/9] Remove old container"
              docker rm -f perkasa-erp-oss-bss 2>&1 || true
              sleep 3
            else
              echo "[3/9] No old container"
            fi
          '

      - name: "Step 4/9 Set server.js + workdir (hardcode cocok Dockerfile runner stage)"
        if: env.DEPLOY_OK == '1'
        run: |
          set -e
          echo "[4/9] Hardcode WORKDIR + SERVER_JS yang SESUAI DENGAN Dockerfile runner stage"
          echo "   Dockerfile STAGE 3 (runner): WORKDIR=/app/apps/web/standalone, CMD=[node server.js]"
          echo "WORKDIR_CORRECT=/app/apps/web/standalone" >> "$GITHUB_ENV"
          echo "SERVER_JS_PATH=/app/apps/web/standalone/server.js" >> "$GITHUB_ENV"
          echo "[OK] WORKDIR_CORRECT=/app/apps/web/standalone (sesuai Dockerfile)"
          echo "[OK] SERVER_JS_PATH=/app/apps/web/standalone/server.js (sesuai Dockerfile)"

      - name: "Step 5/9 Run NEW Container - no heredoc YAML safe + base64 stdin"
        if: env.DEPLOY_OK == '1'
        env:
          HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          KEY: /home/runner/.ssh/id_ed25519_coolify
          DOMAIN: "de6w6jefch37pks4cbg9hivq.103.162.17.178.sslip.io"
          AUTH_SECRET: "278476982jhgs98763h59862fwjrihw648"
        timeout-minutes: 3
        run: |
          set -e
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=60 -o ServerAliveInterval=60 -o BatchMode=yes -i $KEY"
          IMG="${{ env.IMAGE_FULL }}"
          DEPLOY_ID=$(date +%Y%m%d%H%M%S)
          echo "[5/9] docker run image=$IMG deploy_id=$DEPLOY_ID"

          SCRIPT_FILE=$(mktemp)
          {
            echo '#!/usr/bin/env bash'
            echo 'set +e'
            echo 'IMG_VAL="__IMG__"'
            echo 'DOMAIN_VAL="__DOMAIN__"'
            echo 'AUTH_VAL="__AUTH__"'
            echo 'DEPLOY_VAL="__DEPLOY__"'
            echo 'BT=$(printf '\''\\x60'\'')'
            echo 'echo "[INFO] BT len: ${#BT} (must be 1)"'
            echo 'echo "[INFO] cleanup old containers"'
            echo 'docker rm -f perkasa-erp-oss-bss 2>/dev/null || true'
            echo 'sleep 2'
            echo 'TRAEFIK_RULE="traefik.http.routers.perkasa.rule=Host(${BT}${DOMAIN_VAL}${BT})"'
            echo 'echo "[INFO] Traefik rule: $TRAEFIK_RULE"'
            echo 'timeout 90 docker run -d \'
            echo '  --name perkasa-erp-oss-bss \'
            echo '  --network coolify \'
            echo '  --restart unless-stopped \'
            echo '  --memory 2g --cpus 2 \'
            echo '  -p 3000:3000 \'
            echo '  -e PORT=3000 \'
            echo '  -e HOSTNAME=0.0.0.0 \'
            echo '  -e NODE_ENV=production \'
            echo '  -e APP_DATA_MODE=mock \'
            echo '  -e AUTO_LOAD_DEMO_PSB=enabled \'
            echo '  -e AUTH_SESSION_SECRET="$AUTH_VAL" \'
            echo '  -e REVIEW_DB_CONNECT_TIMEOUT_MS=3000 \'
            echo '  -e AUTH_COOKIE_SECURE=false \'
            echo '  -e NEXTAUTH_URL="http://$DOMAIN_VAL" \'
            echo '  -l traefik.enable=true \'
            echo '  -l "traefik.http.routers.perkasa.entryPoints=http" \'
            echo '  -l "$TRAEFIK_RULE" \'
            echo '  -l traefik.http.services.perkasa.loadbalancer.server.port=3000 \'
            echo '  -l "deploy.id=$DEPLOY_VAL" \'
            echo '  "$IMG_VAL" > /tmp/cid.txt 2> /tmp/cid.err'
            echo 'RUN_RC=$?'
            echo 'CID=$(tr -d "\r\n " < /tmp/cid.txt)'
            echo 'ERRMSG=$(cat /tmp/cid.err 2>/dev/null)'
            echo 'echo "[DEBUG] docker run rc=$RUN_RC cid=[$CID] stderr=[$ERRMSG]"'
            echo 'if [ -z "$CID" ]; then'
            echo '  echo "CID_RESULT="'
            echo '  exit 16'
            echo 'fi'
            echo 'echo "CID_RESULT=$CID"'
            echo 'exit 0'
          } > "$SCRIPT_FILE"

          sed -i "s|__IMG__|$IMG|g; s|__DOMAIN__|$DOMAIN|g; s|__AUTH__|$AUTH_SECRET|g; s|__DEPLOY__|$DEPLOY_ID|g" "$SCRIPT_FILE"
          echo "[INFO] script written: $(wc -c < $SCRIPT_FILE) bytes, $(wc -l < $SCRIPT_FILE) lines"
          head -n 8 "$SCRIPT_FILE"
          echo "[INFO] --- backtick BT line + TRAEFIK line preview ---"
          grep -n "BT=" "$SCRIPT_FILE" || true
          grep -n "TRAEFIK_RULE=" "$SCRIPT_FILE" || true

          B64=$(base64 -w0 "$SCRIPT_FILE")
          rm -f "$SCRIPT_FILE"

          echo "[INFO] sending base64 via SSH stdin"
          RESULT=$(echo "$B64" | ssh $OPTS "$USER@$HOST" "set -e; base64 -d > /tmp/deploy-perkasa.sh; chmod +x /tmp/deploy-perkasa.sh; bash /tmp/deploy-perkasa.sh")
          REMOTE_RC=$?
          echo "[DEBUG] SSH rc=$REMOTE_RC | remote tail:"
          echo "$RESULT" | tail -n 20
          CID=$(echo "$RESULT" | grep '^CID_RESULT=' | tail -n 1 | cut -d'=' -f2 | tr -d '\r\n')
          test -n "$CID" || { echo "[ERR] CID empty - full output:"; echo "$RESULT"; exit 16; }
          echo "[OK] CONTAINER_ID=$CID"
          echo "NEW_CONTAINER_ID=$CID" >> "$GITHUB_ENV"

      - name: "Step 6/9 Health Wait 240s + HTTP 200 (cek /login DAN /list-psb)"
        if: env.DEPLOY_OK == '1'
        env:
          HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          KEY: /home/runner/.ssh/id_ed25519_coolify
        run: |
          set +e
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o BatchMode=yes -i $KEY"
          CID="${{ env.NEW_CONTAINER_ID }}"
          MAX=240 INTERVAL=10 ELAPSED=0 OK=0
          echo "[6/9] Wait max ${MAX}s health - DUAL CHECK: /login (200) + /list-psb (NOT 404)"
          while [ $ELAPSED -lt $MAX ]; do
            ST=$(ssh $OPTS "$USER@$HOST" "docker inspect --format='{{.State.Status}}|{{.State.ExitCode}}' $CID 2>/dev/null || echo missing")
            STATUS=$(echo "$ST" | cut -d'|' -f1)
            EXIT=$(echo "$ST" | cut -d'|' -f2)
            echo "  [${ELAPSED}s/$MAX] Status=$STATUS Exit=$EXIT"
            if [ "$STATUS" = "running" ]; then
              HTTP_LOGIN=$(ssh $OPTS "$USER@$HOST" "curl -sf -o /dev/null --max-time 8 http://127.0.0.1:3000/login ; echo \$?")
              if [ "$HTTP_LOGIN" = "0" ]; then
                echo "  [OK] /login HTTP 200 OK. Sekarang cek /list-psb (pastikan BUKAN image lawas 404)..."
                HTTP_CODE_PSB=$(ssh $OPTS "$USER@$HOST" "curl -s -o /dev/null -w '%{http_code}' --max-time 8 -L http://127.0.0.1:3000/list-psb?q=FA65B42-DEMO")
                echo "  [INFO] /list-psb HTTP status code: $HTTP_CODE_PSB"
                if [ "$HTTP_CODE_PSB" = "200" ] || [ "$HTTP_CODE_PSB" = "302" ] || [ "$HTTP_CODE_PSB" = "307" ] || [ "$HTTP_CODE_PSB" = "308" ]; then
                  echo "[OK] [${ELAPSED}s] /login 200 + /list-psb OK (status=$HTTP_CODE_PSB)! Image BENAR & Control Tower PSB tersedia!"
                  OK=1
                  break
                else
                  echo "  [WARN] /list-psb status=$HTTP_CODE_PSB (404 = image LAWAS!). Tunggu Next.js compile route..."
                fi
              fi
            fi
            if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
              echo "[ERR] Container CRASH! Last 100 logs:"
              ssh $OPTS "$USER@$HOST" "docker logs $CID 2>&1 | tail -100"
              OK=2
              break
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          if [ $OK -eq 0 ]; then
            echo "[WARN] TIMEOUT 240s - last 100 logs:"
            ssh $OPTS "$USER@$HOST" "docker logs $CID 2>&1 | tail -100"
          fi
          echo "FINAL_OK=$OK" >> "$GITHUB_ENV"
          exit 0

      - name: "Step 7/9 Prune Images"
        if: env.DEPLOY_OK == '1'
        env:
          HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          KEY: /home/runner/.ssh/id_ed25519_coolify
        run: |
          set +e
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o BatchMode=yes -i $KEY"
          ssh $OPTS "$USER@$HOST" "docker image prune -f --filter 'until=48h' >/dev/null 2>&1 ; echo done"
          exit 0

      - name: "Step 8/9 Summary + Post-Verify /list-psb 200 (live Traefik domain)"
        if: env.DEPLOY_OK == '1'
        env:
          HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          KEY: /home/runner/.ssh/id_ed25519_coolify
          DOMAIN: "de6w6jefch37pks4cbg9hivq.103.162.17.178.sslip.io"
        run: |
          set +e
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o BatchMode=yes -i $KEY"
          CID="${{ env.NEW_CONTAINER_ID }}"
          echo ""
          echo "[8/9] docker ps -a:"
          ssh $OPTS "$USER@$HOST" "docker ps -a --filter id=$CID --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.RunningFor}}'"
          echo ""
          echo "[8/9] Labels:"
          ssh $OPTS "$USER@$HOST" "docker inspect --format='{{range \$k,\$v := .Config.Labels}}{{printf \"%s=%s\\n\" \$k \$v}}{{end}}' $CID 2>/dev/null | grep -E '^traefik|^deploy.id' || echo skip"
          echo ""
          echo "[8/9] Last logs:"
          ssh $OPTS "$USER@$HOST" "docker logs --tail 60 $CID 2>&1 | grep -v '^$' | tail -70"
          echo ""
          echo "[8/9] POST-VERIFY: curl domain publik (Traefik routing) ke /list-psb..."
          PUB_STAT=$(ssh $OPTS "$USER@$HOST" "curl -s -o /dev/null -w '%{http_code}' --max-time 12 -L --resolve $DOMAIN:80:127.0.0.1 http://$DOMAIN/list-psb?q=FA65B42-DEMO")
          echo "   [INFO] /list-psb via Traefik ($DOMAIN) -> HTTP $PUB_STAT"
          if [ "$PUB_STAT" = "200" ] || [ "$PUB_STAT" = "302" ] || [ "$PUB_STAT" = "307" ]; then
            echo "   [OK] TRAEFIK ROUTING KE CONTROL TOWER PSB: BERHASIL!"
          else
            echo "   [WARN] Status=$PUB_STAT - jika 404 silakan tunggu 30s atau Ctrl+Shift+R hard refresh browser."
          fi
          echo ""
          echo "FINAL_HTTP_OK=${{ env.FINAL_OK }} (0=timeout 1=OK 2=crash)"
          exit 0

      - name: Deploy Done URLs
        if: always()
        run: |
          set +e
          echo "==========================================================="
          echo " DEPLOY v2 DONE - 3-tier fallback + dual health check"
          echo "==========================================================="
          echo "  Image Tag: main-${GITHUB_SHA:0:7} (fallback: :latest > main-fa65b42)"
          echo "  Login    : http://de6w6jefch37pks4cbg9hivq.103.162.17.178.sslip.io/login"
          echo "  DEMO PSB : http://de6w6jefch37pks4cbg9hivq.103.162.17.178.sslip.io/list-psb?q=FA65B42-DEMO"
          echo "  list-psb : http://de6w6jefch37pks4cbg9hivq.103.162.17.178.sslip.io/list-psb"
          echo "==========================================================="
          echo " Jika masih 404: tunggu 30s -> Ctrl+Shift+R (Hard Refresh)"
          echo "    atau run ulang workflow ini via Actions -> Run workflow"
          echo "==========================================================="
