name: Deploy Production Coolify v2 (9 steps Stable SSH)

on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Build & Push Docker Image to GHCR"]
    types:
      - completed
    branches: [main]

concurrency:
  group: coolify-production-deploy-v2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-Flight Filter
        run: |
          set -e
          EVENT=$GITHUB_EVENT_NAME
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Event=$EVENT CommitMsg[0..30]=$(echo $COMMIT_MSG | cut -c1-30)"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "✅ workflow_dispatch → OK"
            echo "DEPLOY_OK=1" >> $GITHUB_ENV
            exit 0
          fi
          if [ "$EVENT" = "push" ]; then
            case "$COMMIT_MSG" in
              FORCE_DEPLOY*) echo "✅ FORCE_DEPLOY commit → OK"; echo "DEPLOY_OK=1" >> $GITHUB_ENV; exit 0 ;;
              *) echo "⏭️  push biasa → skip (success)"; echo "DEPLOY_OK=0" >> $GITHUB_ENV; exit 0 ;;
            esac
          fi
          if [ "$EVENT" = "workflow_run" ]; then
            CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            if [ "$CONCLUSION" = "success" ] && [ "$BRANCH" = "main" ]; then
              echo "✅ workflow_run success main → OK"
              echo "DEPLOY_OK=1" >> $GITHUB_ENV
              exit 0
            else
              echo "⏭️  workflow_run $CONCLUSION/$BRANCH → skip (success)"
              echo "DEPLOY_OK=0" >> $GITHUB_ENV
              exit 0
            fi
          fi
          echo "⏭️  unknown event → skip (success)"
          echo "DEPLOY_OK=0" >> $GITHUB_ENV
          exit 0

      - name: Install SSH Key
        if: env.DEPLOY_OK == '1'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.COOLIFY_SERVER_SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p $HOME/.ssh && chmod 700 $HOME/.ssh
          RAW=$HOME/.ssh/raw_key
          FINAL=$HOME/.ssh/id_ed25519_coolify
          echo "$SSH_PRIVATE_KEY" > $RAW
          BODY=$RAW.body
          tail -n +2 $RAW | head -n -1 | grep -v '^[[:space:]]*$' > $BODY || true
          { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; cat $BODY; echo "-----END OPENSSH PRIVATE KEY-----"; } > $FINAL
          chmod 600 $FINAL
          echo "Final key size: $(wc -c < $FINAL) bytes | lines: $(wc -l < $FINAL)"
          ssh-keygen -l -f $FINAL 2>&1 || true
          rm -f $RAW $BODY

      - name: Preflight SSH test
        if: env.DEPLOY_OK == '1'
        env:
          HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
        run: |
          set -e
          test -n "$HOST" || { echo "❌ COOLIFY_SERVER_HOST empty!"; exit 1; }
          KEY=$HOME/.ssh/id_ed25519_coolify
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o BatchMode=yes -i $KEY"
          echo "SSH $USER@$HOST"
          ssh $OPTS "$USER@$HOST" "echo HOST=\$(hostname); echo DOCKER=\$(docker -v 2>&1); echo DATE=\$(date '+%Y-%m-%d %H:%M:%S')"
          echo "✅ SSH OK"

      - name: Step 1/9 Login GHCR
        if: env.DEPLOY_OK == '1'
        env:
          HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          KEY: /home/runner/.ssh/id_ed25519_coolify
          GHCR_U: ${{ github.actor }}
          GHCR_T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o BatchMode=yes -i $KEY"
          echo "🔑 docker login ghcr.io"
          echo "$GHCR_T" | ssh $OPTS "$USER@$HOST" "docker login ghcr.io -u \"$GHCR_U\" --password-stdin 2>&1 | tail -5"

      - name: Step 2/9 Pull Image
        if: env.DEPLOY_OK == '1'
        env:
          HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          KEY: /home/runner/.ssh/id_ed25519_coolify
        run: |
          set -e
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o BatchMode=yes -i $KEY"
          DEFAULT_IMG="ghcr.io/indrakantor87/perkasa-erp-oss-bss:main-8d2ca5e"
          SHA7="${GITHUB_SHA:0:7}"
          SHA_IMG="ghcr.io/indrakantor87/perkasa-erp-oss-bss:main-${SHA7}"
          IMG=""
          echo "🔍 Cek apakah $SHA_IMG tersedia di GHCR..."
          EXISTS=$(ssh $OPTS "$USER@$HOST" "docker manifest inspect $SHA_IMG >/dev/null 2>&1 ; echo \$?")
          if [ "$EXISTS" = "0" ]; then
            echo "✅ SHA image tersedia: $SHA_IMG"
            IMG="$SHA_IMG"
          else
            echo "ℹ️  SHA image tidak tersedia (commit workflow). Pakai DEFAULT build image terakhir SUCCESS: $DEFAULT_IMG"
            IMG="$DEFAULT_IMG"
          fi
          echo "IMAGE_FULL=$IMG" >> $GITHUB_ENV
          echo "📦 Pull $IMG"
          ssh $OPTS "$USER@$HOST" "
            set -x
            docker pull $IMG 2>&1 | tail -20
            docker inspect --format='{{.RepoDigests}} | {{.Size}}' $IMG 2>&1 || echo 'Image not found (FATAL)'
          "

      - name: Step 3/9 Stop Old Container
        if: env.DEPLOY_OK == '1'
        env:
          HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          KEY: /home/runner/.ssh/id_ed25519_coolify
        run: |
          set -e
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o BatchMode=yes -i $KEY"
          ssh $OPTS "$USER@$HOST" "
            OLD=\$(docker ps -aq --filter name=perkasa-erp-oss-bss)
            if [ -n \"\$OLD\" ]; then
              echo '🗑️  Remove old container'
              docker rm -f perkasa-erp-oss-bss 2>&1 || true
              sleep 3
            else
              echo 'ℹ️  No old container'
            fi
          "

      - name: Step 4/9 Set server.js + workdir (Next.js standalone hardcode /app)
        if: env.DEPLOY_OK == '1'
        run: |
          set -e
          echo "✅ Hardcode SERVER_JS_PATH & WORKDIR untuk Next.js standalone Dockerfile (WORKDIR=/app di stage runner)"
          echo "SERVER_JS_PATH=/app/server.js" >> "$GITHUB_ENV"
          echo "WORKDIR_CORRECT=/app" >> "$GITHUB_ENV"
          echo "✅ SERVER_JS_PATH=/app/server.js (hardcode — 100% cocok Dockerfile)"

      - name: Step 5/9 Run NEW Container (APP_DATA_MODE=mock)
        if: env.DEPLOY_OK == '1'
        env:
          HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          KEY: /home/runner/.ssh/id_ed25519_coolify
          DOMAIN: de6w6jefch37pks4cbg9hivq.103.162.17.178.sslip.io
          AUTH_SECRET: 278476982jhgs98763h59862fwjrihw648
        run: |
          set -e
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=60 -o ServerAliveInterval=60 -o BatchMode=yes -i $KEY"
          IMG="${{ env.IMAGE_FULL }}"
          SERVER_JS="${{ env.SERVER_JS_PATH }}"
          WD="${{ env.WORKDIR_CORRECT }}"
          DEPLOY_ID=$(date +%Y%m%d%H%M%S)
          echo "🚀 docker run"
          CID=$(ssh $OPTS "$USER@$HOST" "
            docker run -d \
              --name perkasa-erp-oss-bss \
              --network coolify \
              --restart unless-stopped \
              --memory 2g --cpus 2 \
              -p 3000:3000 \
              -w $WD \
              -e PORT=3000 \
              -e HOSTNAME=0.0.0.0 \
              -e NODE_ENV=production \
              -e APP_DATA_MODE=mock \
              -e AUTO_LOAD_DEMO_PSB=enabled \
              -e AUTH_SESSION_SECRET=$AUTH_SECRET \
              -e REVIEW_DB_CONNECT_TIMEOUT_MS=3000 \
              -e AUTH_COOKIE_SECURE=false \
              -e NEXTAUTH_URL=http://$DOMAIN \
              -e LOG_LEVEL=debug \
              -l traefik.enable=true \
              -l 'traefik.http.routers.perkasa.entryPoints=http' \
              -l \"traefik.http.routers.perkasa.rule=Host(\\\`$DOMAIN\\\`)\" \
              -l traefik.http.services.perkasa.loadbalancer.server.port=3000 \
              -l deploy.id=$DEPLOY_ID \
              $IMG node $SERVER_JS
          ")
          test -n "$CID" || { echo "❌ docker run empty ID!"; exit 16; }
          echo "✅ CONTAINER_ID=$CID"
          echo "NEW_CONTAINER_ID=$CID" >> $GITHUB_ENV

      - name: Step 6/9 Health Wait 240s + HTTP 200
        if: env.DEPLOY_OK == '1'
        env:
          HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          KEY: /home/runner/.ssh/id_ed25519_coolify
        run: |
          set +e
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o BatchMode=yes -i $KEY"
          CID="${{ env.NEW_CONTAINER_ID }}"
          MAX=240 INTERVAL=10 ELAPSED=0 OK=0
          echo "⏳ Wait max ${MAX}s health"
          while [ $ELAPSED -lt $MAX ]; do
            ST=$(ssh $OPTS "$USER@$HOST" "docker inspect --format='{{.State.Status}}|{{.State.ExitCode}}' $CID 2>/dev/null || echo missing")
            STATUS=$(echo "$ST" | cut -d'|' -f1)
            EXIT=$(echo "$ST" | cut -d'|' -f2)
            echo "  [${ELAPSED}s/$MAX] Status=$STATUS Exit=$EXIT"
            if [ "$STATUS" = "running" ]; then
              HTTP=$(ssh $OPTS "$USER@$HOST" "curl -sf -o /dev/null --max-time 8 http://127.0.0.1:3000/login ; echo \$?")
              if [ "$HTTP" = "0" ]; then
                echo "✅🔥 [${ELAPSED}s] HTTP 200!"
                OK=1
                break
              fi
            fi
            if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
              echo "⚠️  Container CRASH! Last logs:"
              ssh $OPTS "$USER@$HOST" "docker logs $CID 2>&1 | tail -100"
              OK=2
              break
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          if [ $OK -eq 0 ]; then
            echo "⚠️  TIMEOUT 240s — last logs:"
            ssh $OPTS "$USER@$HOST" "docker logs $CID 2>&1 | tail -100"
          fi
          echo "FINAL_OK=$OK" >> $GITHUB_ENV
          exit 0

      - name: Step 7/9 Prune Images
        if: env.DEPLOY_OK == '1'
        env:
          HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          KEY: /home/runner/.ssh/id_ed25519_coolify
        run: |
          set +e
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o BatchMode=yes -i $KEY"
          ssh $OPTS "$USER@$HOST" "docker image prune -f --filter 'until=48h' >/dev/null 2>&1 ; echo done"
          exit 0

      - name: Step 8/9 Summary
        if: env.DEPLOY_OK == '1'
        env:
          HOST: ${{ secrets.COOLIFY_SERVER_HOST }}
          USER: ${{ secrets.COOLIFY_SERVER_USER || 'root' }}
          KEY: /home/runner/.ssh/id_ed25519_coolify
        run: |
          set +e
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=60 -o BatchMode=yes -i $KEY"
          CID="${{ env.NEW_CONTAINER_ID }}"
          echo ""
          echo "🐳 docker ps -a:"
          ssh $OPTS "$USER@$HOST" "docker ps -a --filter id=$CID --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.RunningFor}}'"
          echo ""
          echo "🏷️  Labels:"
          ssh $OPTS "$USER@$HOST" "docker inspect --format='{{range \$k,\$v := .Config.Labels}}{{printf \"%s=%s\\n\" \$k \$v}}{{end}}' $CID 2>/dev/null | grep -E '^traefik|^deploy.id' || echo skip"
          echo ""
          echo "📜 Last logs:"
          ssh $OPTS "$USER@$HOST" "docker logs --tail 60 $CID 2>&1 | grep -v '^$' | tail -70"
          echo ""
          echo "FINAL_HTTP_OK=${{ env.FINAL_OK }} (0=timeout 1=OK 2=crash)"
          exit 0

      - name: Deploy Done URLs
        if: always()
        run: |
          set +e
          echo "==========================================================="
          echo " 🏁 DEPLOY v2 DONE"
          echo "==========================================================="
          echo "  Image Tag: main-${GITHUB_SHA:0:7}"
          echo "  Login    : 👉 http://de6w6jefch37pks4cbg9hivq.103.162.17.178.sslip.io/login"
          echo "  DEMO PSB : 👉 http://de6w6jefch37pks4cbg9hivq.103.162.17.178.sslip.io/list-psb?q=FA65B42-DEMO"
          echo "  list-psb : 👉 http://de6w6jefch37pks4cbg9hivq.103.162.17.178.sslip.io/list-psb"
          echo "==========================================================="
